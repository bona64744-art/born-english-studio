/* ---- 수업자료 저장: 서버 저장이 늦거나 실패해도 이 기기에는 반드시 남기고, 목록에서 사라지지 않게 한다 ---- */
const MAT_OV={}; /* 이름·폴더 변경은 서버 반영 전에도 화면에 바로 유지 */
const MAT_DEL=new Set();
let MAT_PEND=LS.get("bj-mat-pend",{}); /* 서버에 아직 확정되지 않은 자료(원본) */
function persistPend(){ try{LS.set("bj-mat-pend",MAT_PEND)}catch(e){} }
function applyMatOv(d){const o=d&&MAT_OV[d.id]; if(!o) return d; if(Object.keys(o).every(k=>d[k]===o[k])) delete MAT_OV[d.id]; else Object.assign(d,o); return d;}
function mergeMaterials(snapDocs){
  const arr=snapDocs.map(d=>applyMatOv(d)).filter(Boolean).filter(d=>{ if(MAT_DEL.has(d.id)) return false; return true; });
  MAT_DEL.forEach(id=>{ if(!snapDocs.some(d=>d&&d.id===id)) MAT_DEL.delete(id); });
  Object.values(MAT_PEND).forEach(l=>{
    if(!l||!l.id||MAT_DEL.has(l.id)) return;
    const i=arr.findIndex(d=>d.id===l.id);
    if(i<0) arr.push(l); else if((l.updated||0)>=(arr[i].updated||0)) arr[i]=l;
  });
  return arr.sort((a,b)=>b.created-a.created);
}
const matBytes=o=>new TextEncoder().encode(JSON.stringify(o)).length;
function slimDoc(m){ /* 서버 문서 한도(256KiB) 안에 들어가도록 부가 정보부터 덜어낸다 */
  const LIM=240000; let doc=JSON.parse(JSON.stringify(m)); delete doc.unsynced;
  if(matBytes(doc)<=LIM) return doc;
  if(doc.kind==="exam"&&doc.data&&Array.isArray(doc.data.docs)){
    doc.data.docs.forEach(u=>{ delete u.ref; });
    if(matBytes(doc)<=LIM) return doc;
    doc.data.docs.forEach(u=>(u.items||[]).forEach(it=>{ if(it.explanation) it.explanation=String(it.explanation).slice(0,260); }));
    if(matBytes(doc)<=LIM) return doc;
    doc.data.docs.forEach(u=>{ delete u.text; });
    return doc;
  }
  const qs=doc.data&&doc.data.questions; 
  if(Array.isArray(qs)){ qs.forEach(q=>{delete q.audit}); if(matBytes(doc)<=LIM) return doc;
    qs.forEach(q=>{ if(Array.isArray(q.notes)) q.notes=q.notes.map(x=>String(x).slice(0,60)); if(q.explanation) q.explanation=String(q.explanation).slice(0,400); }); }
  return doc;
}
const MAT_BUSY={};
async function dbWriteMat(m){
  if(!db) return true;
  if(MAT_BUSY[m.id]){ MAT_BUSY[m.id].again=true; return MAT_BUSY[m.id].p; }
  const st=MAT_BUSY[m.id]={again:false,p:null};
  st.p=(async()=>{
    let ok=false, err=null;
    do{
      st.again=false;
      const doc=slimDoc(m);
      for(let k=0;k<3;k++){
        try{ await db.doc("materials/"+m.id).set(doc); ok=true; err=null; break; }
        catch(e){ err=e; if(e&&["invalid_argument","quota_exceeded"].includes(e.code)) break; await new Promise(r=>setTimeout(r,500*(k+1))); }
      }
    }while(st.again);
    delete MAT_BUSY[m.id];
    if(ok){ if(!st.again){ delete MAT_PEND[m.id]; persistPend(); } const l=state.materials.find(x=>x.id===m.id); if(l) delete l.unsynced; }
    else{
      const l=state.materials.find(x=>x.id===m.id); if(l) l.unsynced=true;
      toast(err&&err.code==="invalid_argument"?"자료가 커서 서버에 저장하지 못했습니다. 이 기기에는 남아 있으니 지문 수를 나눠 만들어 주세요."
        :err&&err.code==="quota_exceeded"?"저장할 수 있는 자료 개수가 가득 찼습니다. 오래된 자료를 삭제해 주세요. 지금 자료는 이 기기에 남아 있습니다."
        :"서버에 저장하지 못했습니다. 이 기기에는 남아 있고 다음에 열 때 다시 저장합니다.");
    }
    return ok;
  })();
  return st.p;
}
async function saveMaterial(kind,title,data,folder){
  const id=`${kind}-${Date.now().toString(36)}${Math.random().toString(36).slice(2,5)}`;
  const now=Date.now();
  const doc={id,kind,title,folder:folder||"기본 폴더",created:now,updated:now,count:kind==="variant"?data.questions.length:data.docs.length,data};
  state.materials=[doc,...state.materials.filter(m=>m.id!==id)];
  if(db){ MAT_PEND[id]=doc; persistPend(); await dbWriteMat(doc); }
  else LS.set("bj-mat-local",state.materials);
  return doc;
}
async function updateMaterial(m,patch){
  Object.assign(m,patch); m.updated=Date.now();
  if('title' in patch||'folder' in patch){ MAT_OV[m.id]=Object.assign(MAT_OV[m.id]||{},('title' in patch?{title:patch.title}:{}),('folder' in patch?{folder:patch.folder}:{})); }
  if(db){ MAT_PEND[m.id]=m; persistPend(); await dbWriteMat(m); }
  else LS.set("bj-mat-local",state.materials);
}
async function deleteMaterial(m){
  state.materials=state.materials.filter(x=>x.id!==m.id);
  MAT_DEL.add(m.id); delete MAT_PEND[m.id]; persistPend();
  if(db){try{await db.doc("materials/"+m.id).delete()}catch(e){toast("삭제하지 못했습니다.")}}
  else LS.set("bj-mat-local",state.materials);
}

/* ---------------- diff / validation ---------------- */
const MARK_RE = /\[\[(\d|[a-e]|U):([\s\S]*?)\]\]|\[\[BLANK\]\]/g;
function normText(s){return String(s||"").replace(/[’‘`]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,"-").toLowerCase()}
function toks(s){return normText(s).match(/[a-z0-9']+|[^\sa-z0-9']/g)||[]}
function markedToks(raw){
  const out=[]; let last=0; raw=String(raw||""); MARK_RE.lastIndex=0; let m;
  while((m=MARK_RE.exec(raw))){
    toks(raw.slice(last,m.index)).forEach(w=>out.push({w,m:null}));
    if(m[1]) toks(m[2]).forEach(w=>out.push({w,m:m[1]}));
    last=MARK_RE.lastIndex;
  }
  toks(raw.slice(last)).forEach(w=>out.push({w,m:null}));
  return out;
}
function align(a,b){
  const n=a.length,m=b.length,W=m+1,dp=new Uint16Array((n+1)*(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i*W+j]=a[i].w===b[j]?dp[(i+1)*W+j+1]+1:Math.max(dp[(i+1)*W+j],dp[i*W+j+1]);
  let i=0,j=0,ins=0,del=0,outside=0;const changed=new Set();
  const tag=k=>{if(k==null)outside++;else changed.add(k)};
  while(i<n&&j<m){
    if(a[i].w===b[j]){i++;j++}
    else if(dp[(i+1)*W+j]>=dp[i*W+j+1]){ins++;tag(a[i].m);i++}
    else{del++;tag(a[i].m!=null?a[i].m:(i>0?a[i-1].m:null));j++}
  }
  while(i<n){ins++;tag(a[i].m);i++}
  while(j<m){del++;tag(n?a[n-1].m:null);j++}
  return {ins,del,edits:ins+del,changed,outside};
}
function diffText(txt,orig){return align(markedToks(txt),toks(orig))}
function markers(raw){const r=[];MARK_RE.lastIndex=0;let m;while((m=MARK_RE.exec(String(raw||""))))r.push(m[1]||"BLANK");return r}
function markerText(raw,id){MARK_RE.lastIndex=0;let m;while((m=MARK_RE.exec(String(raw||""))))if(m[1]===id)return m[2];return ""}
function joinParts(arr){return arr.filter(x=>x!=null&&String(x).trim()!=="").join(" ")}

const STOP=new Set("the a an and or but of to in on at for with by from as is are was were be been being it its this that these those they them their there what which who whom whose when where why how not no can could will would should may might must do does did have has had than then so such very more most also just only into about over under your you our we he she his her one some any all each other".split(" "));
function stemW(w){return w.replace(/(ies)$/,"y").replace(/(ing|ed|es|s|ly|er|est)$/,"")}
function contentWords(arr){return arr.filter(w=>/^[a-z]/.test(w)&&w.length>2&&!STOP.has(w)).map(stemW)}
function paraphraseOverlap(passage,orig,answer){
  const parts=String(passage).split("[[BLANK]]"); const B=toks(orig); const pre=toks(parts[0]).length, post=toks(parts[1]||"").length;
  const removed=new Set(contentWords(B.slice(pre,B.length-post)));
  const ans=new Set(contentWords(toks(answer)));
  const shared=[...removed].filter(w=>ans.has(w)).length;
  return {total:removed.size,shared,ratio:removed.size?shared/removed.size:0};
}
function contentTokens(s){return toks(s).filter(w=>/[a-z0-9]/.test(w)).sort()}
function validate(q){
  const t=T[q.type]; const P=[]; const hard=m=>P.push({m,hard:true}); const soft=m=>P.push({m,hard:false});
  if(!t){hard("알 수 없는 유형입니다.");return P}
  const o=q.orig;
  const five=a=>Array.isArray(a)&&a.length===5;
  const ansOK=()=>Number.isInteger(q.answer)&&q.answer>=1&&q.answer<=5;
  if(!hasKo(q.explanation)) hard("해설이 비어 있거나 한국어가 아닙니다.");
  if(["mc","summary","blank","implication"].includes(t.kind)){
    if(!five(q.options)) hard("선택지가 5개가 아닙니다.");
    else{
      const keys=q.options.map(x=>normText(Array.isArray(x)?x.join("|"):x).trim());
      if(keys.some(k=>!k||k==="|")) hard("비어 있는 선택지가 있습니다.");
      if(new Set(keys).size<5) hard("같은 선택지가 두 번 이상 나옵니다.");
    }
    if(!ansOK()) hard("정답 번호가 1~5 범위를 벗어났습니다.");
    if(!five(q.notes)) soft("선택지별 해석·근거(notes)가 5개가 아닙니다.");
    if(String(q.answer_text||"").trim()&&Array.isArray(q.options)&&q.options[q.answer-1]!==undefined){
      if(simText(optText(q.options[q.answer-1]),q.answer_text)<0.6) hard(`정답 번호(${q.answer})가 가리키는 선택지와 정답 내용(answer_text)이 다릅니다.`);
    }
  }
  switch(t.kind){
    case "mc":{
      const wantKo = q.lang ? q.lang==="ko" : (t.opt==="ko");
      if(five(q.options)){
        if(wantKo && q.options.some(x=>!hasKo(x))) hard("한국어여야 할 선택지에 영어만 있습니다.");
        if(!wantKo && q.options.some(x=>hasKo(x))) hard("영어여야 할 선택지에 한국어가 섞였습니다.");
      }
      break;}
    case "summary":{
      const s=String(q.summary||"");
      if((s.match(/\(A\)/g)||[]).length!==1||(s.match(/\(B\)/g)||[]).length!==1) hard("요약문에 (A), (B) 빈칸이 하나씩 있어야 합니다.");
      if(five(q.options)&&q.options.some(x=>!Array.isArray(x)||x.length!==2)) hard("요약문 선택지는 (A), (B) 두 칸 짝이어야 합니다.");
      if(hasKo(s)) hard("요약문은 영어여야 합니다.");
      break;}
    case "blank":{
      const mk=markers(q.passage);
      if(mk.length!==1||mk[0]!=="BLANK") hard("빈칸이 정확히 한 곳이어야 합니다.");
      else{
        const d=diffText(q.passage,o); if(d.ins>0) hard("빈칸 밖의 원문이 바뀌었습니다."); if(d.del<2) hard("빈칸으로 가린 표현이 너무 짧습니다.");
        if(d.ins===0 && five(q.options) && ansOK()){
          const r=paraphraseOverlap(q.passage,o,q.options[q.answer-1]);
          const limit = q.lv==="mid" ? 1.01 : (q.level==="상" ? 0.34 : 0.5);
          if(r.total>=2 && r.ratio>limit) hard(`빈칸 정답이 원문 표현을 거의 그대로 옮겼습니다(원문 내용어 ${r.total}개 중 ${r.shared}개 그대로 사용). 유의어로 바꿔 써야 합니다.`);
        }
      }
      break;}
    case "implication":{
      const mk=markers(q.passage);
      if(mk.length!==1||mk[0]!=="U") hard("함축 밑줄이 정확히 한 곳이어야 합니다.");
      else if(diffText(q.passage,o).edits>0) hard("밑줄 표시 외에 원문이 바뀌었습니다.");
      break;}
    case "under":{
      const mk=markers(q.passage);
      if(mk.join(",")!=="1,2,3,4,5") hard("밑줄 ①~⑤가 순서대로 한 번씩 있어야 합니다.");
      if(!ansOK()) hard("정답 번호가 1~5 범위를 벗어났습니다.");
      if(!five(q.notes)) soft("번호별 설명(notes)이 5개가 아닙니다.");
      if(String(q.answer_text||"").trim()&&mk.join(",")==="1,2,3,4,5"&&ansOK()&&simText(markerText(q.passage,String(q.answer)),q.answer_text)<0.6) hard(`정답 번호(${q.answer})가 가리키는 밑줄과 정답 내용(answer_text)이 다릅니다.`);
      if(mk.join(",")==="1,2,3,4,5"&&ansOK()){
        const d=diffText(q.passage,o); const a=String(q.answer);
        const changed=[...d.changed].sort().join(",");
        const single = q.type.endsWith("_wrong");
        const expect = single ? a : ["1","2","3","4","5"].filter(x=>x!==a).join(",");
        if(changed!==expect){
          hard(single ? `원문에서 바뀐 밑줄은 ${CN[q.answer-1]} 하나여야 하는데, 실제로 바뀐 곳은 ${changed?changed.split(",").map(x=>CN[x-1]).join(" "):"없음"}입니다.`
                      : `정답 ${CN[q.answer-1]}만 원문 그대로이고 나머지 넷은 바뀌어야 하는데, 실제로 바뀐 곳은 ${changed?changed.split(",").map(x=>CN[x-1]).join(" "):"없음"}입니다.`);
        }
        if(d.outside>2) hard("밑줄 밖의 원문이 바뀌었습니다.");
        else if(d.outside>0) soft("밑줄 바깥에서 원문과 다른 곳이 있을 수 있습니다.");
      }
      break;}
    case "form":{
      const mk=markers(q.passage);
      if(mk.join(",")!=="a,b,c") hard("(a), (b), (c) 표시가 순서대로 한 번씩 있어야 합니다.");
      if(!Array.isArray(q.answers)||q.answers.length!==3||q.answers.some(x=>!String(x||"").trim())) hard("고쳐 쓴 정답이 3개여야 합니다.");
      else if(mk.join(",")==="a,b,c"){
        ["a","b","c"].forEach((l,i)=>{ const t0=markerText(q.passage,l); if(!/^\s*\(.+\)\s*$/.test(t0)) hard(`(${l})는 괄호 안에 기본형을 넣어야 합니다.`); });
        let k=0; const rebuilt=String(q.passage).replace(MARK_RE,(all,id)=>id?q.answers[k++]:all);
        if(diffText(rebuilt,o).edits>0) hard("정답을 넣어도 원문과 같아지지 않습니다.");
        if(q.type==="m_fillw") ["a","b","c"].forEach((l,i)=>{ const h=markerText(q.passage,l).replace(/[()_\s]/g,"").charAt(0), a=String(q.answers[i]||"").trim().charAt(0); if(!h) hard(`(${l})에 주어진 첫 글자가 없습니다.`); else if(a&&h.toLowerCase()!==a.toLowerCase()) hard(`(${l})의 주어진 철자와 정답의 첫 글자가 다릅니다.`); });
      }
      break;}
    case "transform":{
      if(!String(q.source||"").trim()) hard("바꿔 쓸 원문 문장이 없습니다.");
      else if(diffText(q.source,o).edits>0 && !normText(o).replace(/\s+/g," ").includes(normText(q.source).replace(/\s+/g," ").trim())) hard("제시 문장이 지문에 그대로 있지 않습니다.");
      if(!String(q.condition||"").trim()||!hasKo(q.condition)) hard("조건이 비어 있습니다.");
      if(!Array.isArray(q.answers)||!q.answers.length||!String(q.answers[0]||"").trim()) hard("정답 문장이 없습니다.");
      else if(normText(q.answers[0]).replace(/[^a-z]/g,"")===normText(q.source||"").replace(/[^a-z]/g,"")) hard("정답이 제시 문장과 똑같습니다.");
      break;}
    case "arrange":{
      const ans=String(q.answer||"");
      if(!ans.trim()) hard("정답 문장이 없습니다.");
      else if(!normText(o).replace(/\s+/g," ").includes(normText(ans).replace(/\s+/g," ").trim().replace(/[.?!]$/,""))) hard("정답 문장이 지문에 그대로 있지 않습니다.");
      if(!Array.isArray(q.words)||q.words.length<5) hard("배열할 어구가 5덩어리 이상이어야 합니다.");
      else{
        const a=contentTokens(q.words.join(" ")), b=contentTokens(ans);
        if(a.join("|")!==b.join("|")) hard("주어진 어구를 모두 합쳐도 정답 문장과 같아지지 않습니다.");
      }
      if(!hasKo(q.ko||"")) hard("우리말 해석이 없습니다.");
      break;}
    case "compose":{
      const ans=String(q.answer||"");
      if(!ans.trim()) hard("정답 문장이 없습니다.");
      else if(!normText(o).replace(/\s+/g," ").includes(normText(ans).replace(/\s+/g," ").trim().replace(/[.?!]$/,""))) hard("정답 문장이 지문에 그대로 있지 않습니다.");
      if(!hasKo(q.ko||"")) hard("우리말 해석이 없습니다.");
      if(!Array.isArray(q.conditions)||!q.conditions.length) soft("조건이 없습니다.");
      if(Array.isArray(q.given)&&q.given.some(w=>!normText(ans).includes(normText(w).replace(/[^a-z ]/g,"").split(" ")[0]))) hard("필수 단어가 정답 문장에 들어 있지 않습니다.");
      break;}
    case "fix":{
      const mk=markers(q.passage);
      if(mk.join(",")!=="a,b,c") hard("(a), (b), (c) 밑줄이 순서대로 한 번씩 있어야 합니다.");
      if(!Array.isArray(q.answers)||q.answers.length!==3||q.answers.some(x=>!String(x||"").trim())) hard("고쳐 쓴 정답이 3개여야 합니다.");
      else if(mk.join(",")==="a,b,c"){
        const d=diffText(q.passage,o);
        if([...d.changed].sort().join(",")!=="a,b,c") hard("세 밑줄이 모두 원문에서 바뀐 부분이어야 합니다.");
        if(d.outside>0) hard("밑줄 밖의 원문이 바뀌었습니다.");
        let k=0; const rebuilt=String(q.passage).replace(MARK_RE,(all,id)=>id?q.answers[k++]:all);
        if(diffText(rebuilt,o).edits>0) hard("정답을 넣어도 원문과 같아지지 않습니다.");
      }
      break;}
    case "order":{
      if(!String(q.intro||"").trim()||!Array.isArray(q.parts)||q.parts.length!==3||q.parts.some(x=>!String(x||"").trim())) hard("주어진 글과 (A)~(C) 세 덩어리가 필요합니다.");
      else if(diffText(joinParts([q.intro,...q.parts]),o).edits>2) hard("주어진 글과 세 덩어리를 이어도 원문과 같지 않습니다.");
      break;}
    case "insert":{
      if(!Array.isArray(q.chunks)||q.chunks.length!==6||q.chunks.slice(0,5).some(x=>!String(x||"").trim())) hard("삽입 자리를 나누는 글 덩어리가 6개여야 합니다.");
      else if(!ansOK()) hard("정답 번호가 1~5 범위를 벗어났습니다.");
      else if(!String(q.sentence||"").trim()) hard("주어진 문장이 없습니다.");
      else{
        const arr=[...q.chunks]; arr.splice(q.answer,0,q.sentence);
        if(diffText(joinParts(arr),o).edits>2) hard("정답 자리에 문장을 넣어도 원문과 같지 않습니다.");
        if(q.chunks.some(c=>normText(c).includes(normText(q.sentence).slice(0,40)))) hard("주어진 문장이 본문에 그대로 남아 있습니다.");
      }
      break;}
    case "irrelevant":{
      if(!Array.isArray(q.sentences)||q.sentences.length!==5) hard("번호 붙은 문장이 5개여야 합니다.");
      else if(!ansOK()) hard("정답 번호가 1~5 범위를 벗어났습니다.");
      else{
        const rest=q.sentences.filter((_,i)=>i!==q.answer-1);
        if(diffText(joinParts([q.intro,...rest,q.tail]),o).edits>2) hard("정답 문장을 빼도 원문과 같지 않습니다.");
        if(normText(o).includes(normText(q.sentences[q.answer-1]).trim().slice(0,50))) hard("무관한 문장으로 표시된 문장이 원문에 있는 문장입니다.");
      }
      break;}
    case "refmc":{
      const mk=markers(q.passage);
      if(mk.join(",")!=="1,2,3,4,5") hard("밑줄 ⓐ~ⓔ([[1:..]]~[[5:..]])가 순서대로 한 번씩 있어야 합니다.");
      else if(diffText(q.passage,o).edits>0) hard("밑줄 표시 외에 원문이 바뀌었습니다.");
      if(!ansOK()) hard("정답 번호가 1~5 범위를 벗어났습니다.");
      if(!five(q.notes)) soft("밑줄별 설명(notes)이 5개가 아닙니다.");
      if(String(q.answer_text||"").trim()&&mk.join(",")==="1,2,3,4,5"&&ansOK()&&simText(markerText(q.passage,String(q.answer)),q.answer_text)<0.6) hard(`정답 번호(${q.answer})가 가리키는 밑줄과 정답 내용(answer_text)이 다릅니다.`);
      break;}
    case "multi":{
      const mk=markers(q.passage);
      if(mk.join(",")!=="1,2,3,4,5") hard("밑줄 ⓐ~ⓔ([[1:..]]~[[5:..]])가 순서대로 한 번씩 있어야 합니다.");
      if(!ansOK()) hard("정답 번호가 1~5 범위를 벗어났습니다.");
      if(!five(q.options)) hard("선택지가 5개가 아닙니다.");
      else{
        const sets=q.options.map(x=>(String(x).match(/[ⓐ-ⓔ]/g)||[]).map(c=>LB.indexOf(c)+1).sort().join(","));
        if(sets.some(x=>!x)) hard("선택지는 'ⓐ, ⓒ'처럼 밑줄 기호로 써야 합니다.");
        else if(new Set(sets).size<5) hard("같은 선택지가 두 번 이상 나옵니다.");
        else if(new Set(sets.map(x=>x.split(",").length)).size>1) hard("선택지의 밑줄 개수가 모두 같아야 합니다.");
        else if(ansOK()&&mk.join(",")==="1,2,3,4,5"){
          const d=diffText(q.passage,o); const changed=[...d.changed].sort().join(",");
          const nm=x=>x?x.split(",").map(n=>LB[n-1]).join(", "):"없음";
          if(changed!==sets[q.answer-1]) hard(`원문에서 바뀐 밑줄은 ${nm(changed)}인데 정답 선택지는 ${nm(sets[q.answer-1])}입니다. 정답 선택지와 실제로 바꾼 밑줄이 정확히 같아야 합니다.`);
          if(d.outside>2) hard("밑줄 밖의 원문이 바뀌었습니다.");
        }
      }
      if(!five(q.notes)) soft("밑줄별 설명(notes)이 5개가 아닙니다.");
      break;}
    case "pair3":{
      const src=String(q.passage||""); const re=/\[\[([ABC]):([^\]]*?)\]\]/g; const tp=[]; let mm;
      while((mm=re.exec(src))) tp.push({id:mm[1],ch:mm[2].split("|").map(x=>x.trim())});
      if(tp.map(x=>x.id).join("")!=="ABC") hard("(A), (B), (C) 네모([[A:표현1|표현2]])가 순서대로 한 번씩 있어야 합니다.");
      else if(tp.some(x=>x.ch.length!==2||x.ch.some(c=>!c)||normText(x.ch[0])===normText(x.ch[1]))) hard("각 네모에는 서로 다른 표현 두 개를 '|'로 나눠 넣어야 합니다.");
      else if(!five(q.options)) hard("선택지가 5개가 아닙니다.");
      else if(q.options.some(x=>!Array.isArray(x)||x.length!==3)) hard("선택지는 (A), (B), (C) 세 칸 짝이어야 합니다.");
      else{
        const keys=q.options.map(x=>x.map(v=>normText(v).trim()).join("|"));
        if(new Set(keys).size<5) hard("같은 선택지가 두 번 이상 나옵니다.");
        if(q.options.some(x=>x.some((v,i)=>!tp[i].ch.map(c=>normText(c)).includes(normText(v).trim())))) hard("선택지의 값은 각 네모 안의 두 표현 중 하나여야 합니다.");
        else if(ansOK()){ const pick=q.options[q.answer-1]; let k=0; const rebuilt=src.replace(re,()=>pick[k++]); if(diffText(rebuilt,o).edits>0) hard("정답 선택지를 넣으면 원문과 같아져야 합니다."); }
      }
      if(!ansOK()) hard("정답 번호가 1~5 범위를 벗어났습니다.");
      if(Array.isArray(q.notes)&&q.notes.length!==3) soft("(A)(B)(C) 설명(notes)이 3개가 아닙니다.");
      break;}
    case "short":{
      const sub=t.sub; const A=String(q.answer||"").trim();
      if(!A) hard("정답이 없습니다.");
      if(sub==="ref"){
        const mk=markers(q.passage);
        if(mk.join(",")!=="U") hard("지칭을 묻는 밑줄([[U:..]])이 정확히 한 곳이어야 합니다.");
        else if(diffText(q.passage,o).edits>0) hard("밑줄 표시 외에 원문이 바뀌었습니다.");
        if(A&&hasKo(A)) hard("정답은 영어여야 합니다.");
        else if(A&&!normText(o).includes(normText(A).replace(/[.!?]$/,"").trim())) hard("정답이 본문에 그대로 있는 표현이 아닙니다.");
      } else if(sub==="qa"){
        if(!String(q.question||"").trim()||hasKo(q.question)) hard("영어 질문(question)이 필요합니다.");
        if(A&&hasKo(A)) hard("정답은 영어 문장이어야 합니다.");
        else if(A&&A.split(/\s+/).length<3) soft("정답이 너무 짧습니다.");
      } else if(sub==="trans"){
        if(!String(q.source||"").trim()) hard("해석할 문장이 없습니다.");
        else if(!normText(o).replace(/\s+/g," ").includes(normText(q.source).replace(/\s+/g," ").trim())) hard("제시 문장이 지문에 그대로 있지 않습니다.");
        if(A&&!hasKo(A)) hard("정답은 우리말 해석이어야 합니다.");
      } else if(sub==="kw"){
        if(!String(q.definition||"").trim()||hasKo(q.definition)) hard("영영풀이(definition)가 필요합니다.");
        if(A&&!/^[A-Za-z' -]+$/.test(A)) hard("정답은 영어 단어(또는 짧은 어구)여야 합니다.");
        else if(A&&!normText(o).includes(normText(A))) hard("정답 단어가 본문에 없습니다.");
      }
      break;}
  }
  return P;
}

/* ---------------- prompts ---------------- */
function langRule(t){ if(t.lang) return t.lang==="ko"?"선택지는 한국어":"선택지는 영어"; if(t.opt==="en") return "선택지는 영어"; if(t.opt==="ko") return "선택지는 한국어"; return state.optLang==="ko"?"선택지는 한국어":"선택지는 영어"; }
const RULES = {
  purpose:t=>`글쓴이가 글을 쓴 목적. ${langRule(t)}(영어면 'To + 동사원형 ...' 형태).`,
  claim:t=>`필자의 주장. ${langRule(t)}. '~해야 한다' 형태의 주장 문장.`,
  gist:t=>`글의 요지(핵심 내용 한 문장). ${langRule(t)}.`,
  topic:t=>`글의 주제. ${langRule(t)}(영어면 the importance of ~, how ~, why ~ 같은 명사구).`,
  title:t=>`글의 제목. 선택지는 영어 제목(주요 단어 대문자). 비유·의문형 제목도 좋다.`,
  summary:()=>`영어 요약문 한 문장(18~30단어)에 (A), (B) 빈칸. 정답 어구는 본문 단어를 그대로 쓰지 말고 바꿔 표현한다. 선택지는 (A),(B) 짝 5개이며 두 칸이 모두 맞는 짝은 하나뿐이다. summary_ko에 요약문 해석을 쓴다.`,
  blank:()=>`글의 핵심을 담은 구나 절(4~12단어)을 [[BLANK]]로 바꾼다. 선택지는 영어 구/절 5개. 정답 선택지는 빈칸으로 가린 원문 표현을 그대로 옮기지 말고, 유의어와 구문 전환(명사화, 능동↔수동, 부정어 활용, 상위어로 일반화 등)으로 다시 쓴 영어 구/절로 만든다. 원문의 내용어(명사·동사·형용사·부사)를 절반 이상 그대로 쓰면 안 된다. 오답 네 개도 같은 길이·구조의 영어 구/절. notes의 정답 항목에는 '원문 표현 → 바꿔 쓴 표현'과 뜻을 밝힌다.`,
  blank_easy:()=>`[난이도 하] 빈칸 바로 앞뒤 문장에 단서가 분명한 핵심 어구(3~7단어)를 [[BLANK]]로 바꾼다. 정답 선택지는 빈칸으로 가린 원문 표현을 그대로 옮기지 말고, 유의어와 구문 전환(명사화, 능동↔수동, 부정어 활용, 상위어로 일반화 등)으로 다시 쓴 영어 구/절로 만든다. 원문의 내용어(명사·동사·형용사·부사)를 절반 이상 그대로 쓰면 안 된다. 오답 네 개도 같은 길이·구조의 영어 구/절. notes의 정답 항목에는 '원문 표현 → 바꿔 쓴 표현'과 뜻을 밝힌다. 정답은 비교적 가까운 유의어 바꿔쓰기로 하고, 오답은 반대 의미이거나 글과 무관해 본문 한두 문장만 읽어도 구별되게 만든다.`,
  blank_hard:()=>`[난이도 상] 주제문이나 결론에 해당하는 절(7~15단어)을 [[BLANK]]로 바꾼다. 정답 선택지는 빈칸으로 가린 원문 표현을 그대로 옮기지 말고, 유의어와 구문 전환(명사화, 능동↔수동, 부정어 활용, 상위어로 일반화 등)으로 다시 쓴 영어 구/절로 만든다. 원문의 내용어(명사·동사·형용사·부사)를 절반 이상 그대로 쓰면 안 된다. 오답 네 개도 같은 길이·구조의 영어 구/절. notes의 정답 항목에는 '원문 표현 → 바꿔 쓴 표현'과 뜻을 밝힌다. 정답은 글 전체의 논지를 추상화·일반화한 패러프레이즈로, 원문과 겹치는 내용어가 거의 없어야 한다. 오답은 본문 어휘를 활용한 매력적 오답(부분적으로만 맞는 진술, 인과 역전, 과잉 일반화, 반대 논리)으로 글 전체를 이해해야 걸러지게 만든다.`,
  order:()=>`원문의 첫 1~2문장을 intro로 두고, 나머지를 원문 순서대로 세 덩어리 parts로 나눈다. 각 덩어리 첫머리에 지시어·연결어·대명사 같은 단서가 있어 순서가 하나로만 정해지도록 끊는다. intro와 parts를 이어 붙이면 원문과 정확히 같아야 한다. 해설에서 덩어리는 원문 순서대로 {P1}, {P2}, {P3}로 가리킨다.`,
  insert:()=>`단서가 분명한 한 문장을 원문에서 빼서 sentence로 두고, 남은 글을 chunks 6개로 나눈다. 자리 k는 chunks[k-1]과 chunks[k] 사이다(chunks[5]는 ⑤ 뒤의 글, 없으면 ""). answer 자리에 sentence를 넣으면 원문과 정확히 같아야 하고, 다른 자리에는 논리적으로 들어갈 수 없어야 한다.`,
  irrelevant:()=>`원문의 첫 문장(들)을 intro로 두고, 이어지는 원문 문장 4개와 새로 쓴 무관한 문장 1개로 sentences 5개를 만든다(무관한 문장의 위치가 answer). 무관한 문장은 소재 어휘를 쓰되 흐름에서 벗어나야 한다. 남은 원문은 tail에 둔다. intro + answer를 뺀 sentences + tail = 원문.`,
  match_easy:()=>`[난이도 하] 본문과 일치하는 것 하나, 일치하지 않는 것 넷. 선택지는 본문 사실을 우리말로 바꿔 쓴 한국어 문장이며 본문 순서대로 배열한다. 불일치 선택지는 숫자·주체·긍부정·시점 등 한 요소만 틀리게 한다. notes에는 근거 문장.`,
  mismatch_easy:()=>`[난이도 하] 본문과 일치하지 않는 것 하나, 일치하는 것 넷. 선택지는 본문 사실을 우리말로 바꿔 쓴 한국어 문장이며 본문 순서대로 배열한다. 불일치 선택지는 숫자·주체·긍부정·시점 등 한 요소만 틀리게 한다. notes에는 근거 문장.`,
  match_hard:()=>`[난이도 상] 선택지 다섯 개 중 최소 세 개는 본문에 그대로 쓰여 있지 않고, 본문 내용을 적용하거나 추론해야 판단할 수 있는 한국어 진술로 만든다(새로운 사례·상황에 적용, 원인과 결과 추론, 필자의 전제나 함의, 두 대상 비교). 정답 하나는 본문 근거로 반드시 참(일치하거나 확실히 추론 가능)이어야 하고, 오답 넷은 과잉 추론, 인과 역전, 범위 확대, 본문과 반대, 근거 없음 가운데 하나로 분명히 틀려야 한다. '~일 수도 있다'처럼 참·거짓이 애매한 진술은 쓰지 않는다. 선택지는 글의 흐름 순서로 배열한다. notes에는 근거 문장과 추론 과정(참 또는 거짓인 이유)을 쓴다.`,
  mismatch_hard:()=>`[난이도 상] 선택지 다섯 개 중 최소 세 개는 본문에 그대로 쓰여 있지 않고, 본문 내용을 적용하거나 추론해야 판단할 수 있는 한국어 진술로 만든다(새로운 사례·상황에 적용, 원인과 결과 추론, 필자의 전제나 함의, 두 대상 비교). 네 개는 본문 근거로 반드시 참(일치하거나 확실히 추론 가능)이어야 하고, 정답 하나는 과잉 추론, 인과 역전, 범위 확대, 본문과 반대 가운데 하나로 분명히 틀려야 한다. '~일 수도 있다'처럼 참·거짓이 애매한 진술은 쓰지 않는다. 선택지는 글의 흐름 순서로 배열한다. notes에는 근거 문장과 추론 과정(참 또는 거짓인 이유)을 쓴다.`,
  match:()=>`본문과 일치하는 것 하나, 일치하지 않는 것 넷. 선택지는 한국어이며 본문 순서대로 배열한다. 정답 위치는 ①만 고집하지 말고 다양하게.`,
  mismatch:()=>`본문과 일치하지 않는 것 하나, 일치하는 것 넷. 선택지는 한국어이며 본문 순서대로 배열한다. 불일치 선택지는 숫자·주체·긍부정·시점 등 한 요소만 살짝 틀리게.`,
  grammar_wrong:()=>`서로 다른 문장에서 수능 빈출 어법 포인트(수일치, 준동사, 분사, 관계사, 접속사/전치사, 대명사, 형용사/부사, 병렬, 태, 도치 등) 다섯 곳에 [[1:..]]~[[5:..]] 밑줄. 정확히 한 곳(answer)만 틀리게 바꾸고 나머지 넷은 원문 그대로. 문맥상 두 형태가 모두 가능한 곳은 쓰지 않는다. notes에는 번호별 어법 설명(틀린 곳은 올바른 형태와 이유).`,
  grammar_right:()=>`다섯 곳에 [[1:..]]~[[5:..]] 밑줄. 네 곳은 명백히 틀리게 바꾸고, 정답(answer) 한 곳만 원문 그대로 둔다. notes에는 번호별 설명(틀린 곳은 올바른 형태와 이유).`,
  vocab_wrong:()=>`문맥상 의미가 중요한 낱말 다섯 개(서로 다른 문장)에 [[1:..]]~[[5:..]] 밑줄. 정확히 한 곳(answer)만 반의어 등 문맥에 명백히 맞지 않는 낱말로 바꾸고 나머지 넷은 원문 그대로. notes에는 번호별 뜻과 적절성(바꾼 곳은 원래 낱말).`,
  vocab_right:()=>`다섯 곳에 밑줄. 네 곳은 문맥에 명백히 맞지 않는 낱말로 바꾸고, 정답(answer) 한 곳만 원문 그대로. notes에는 번호별 뜻과 적절성.`,
  implication:()=>`비유적·함축적 표현(3~10단어) 하나를 [[U:..]]로 표시한다. 나머지 원문은 그대로. 선택지는 영어 구/절 5개.`,
  form:()=>`지문에서 주요 문법이 드러나는 서로 다른 문장 세 곳을 골라, 그 자리의 낱말을 기본형(원형)으로 바꾸고 [[a:(consider)]], [[b:(그 자리의 기본형)]], [[c:...]]처럼 괄호에 넣어 표시한다. 괄호 안은 반드시 기본형 한 단어(또는 두 단어)만 쓴다. answers에는 원문 그대로의 올바른 형태를 쓴다(괄호 설명 없이). 밑줄 밖은 원문 그대로. notes에는 세 곳의 어법 포인트와 SKY 단원 번호.`,
  transform:()=>`지문에서 주요 문법·구문이 들어 있는 문장 하나를 그대로 가져와(source) 조건에 맞게 바꿔 쓰게 한다. 조건(condition)은 '분사구문을 부사절로 바꿔 쓰시오', 'so ~ that 구문으로 바꿔 쓰시오', '수동태로 바꿔 쓰시오', 'It ~ that 강조 구문으로 바꿔 쓰시오'처럼 지문에 실제로 들어 있는 문법을 대상으로 한다. answers에는 정답 문장을 쓰고(허용되는 다른 답이 있으면 함께), explanation에는 전환 규칙과 자주 나오는 오답을 쓴다.`,
  arrange:()=>`지문의 문장 하나(또는 10~15단어 길이의 절)를 골라 우리말 해석(ko)과 함께, 그 문장을 이루는 말을 어구 단위로 잘라 뒤섞어 words에 담는다. words를 모두 쓰면 answer(원문 문장)가 정확히 나와야 하고, 대소문자·문장부호는 answer 기준으로 맞춘다. 주요 문법이 드러나는 자리(준동사, 관계사, 도치, 병렬 등)에서 끊는다.`,
  compose:()=>`지문의 문장 하나를 골라 우리말(ko)과 조건(conditions: 사용할 문법, 단어 수 등)을 주고 영작하게 한다. given에는 반드시 쓰게 할 단어 2~4개를 원형으로 적는다. answer는 원문 문장 그대로이고, 조건은 그 문장의 주요 문법을 가리켜야 한다.`,
  grammar_fix:()=>`서로 다른 문장 세 곳을 어법상 틀리게 바꾸고 [[a:..]], [[b:..]], [[c:..]]로 표시. answers에는 원문 그대로의 올바른 형태만 쓴다(괄호 설명 없이). 밑줄 밖은 원문 그대로. notes에는 세 곳의 어법 포인트.`
};

function ruleForMid(t){
  let r;
  if(MID_RULES[t.id]) r=MID_RULES[t.id](t);
  else if(MID_OVER[t.id]) r=MID_OVER[t.id](t);
  else{
    r=(RULES[t.id]?RULES[t.id](t):"")+(MID_ADD[t.id]?" "+MID_ADD[t.id]:"");
    if(t.lang==="en") r=r.replace(/우리말로 바꿔 쓴 한국어 문장/g,"영어로 바꿔 쓴 영어 문장").replace(/한국어 문장/g,"영어 문장").replace(/한국어 진술/g,"영어 진술").replace(/선택지는 한국어/g,"선택지는 영어")+" 선택지는 모두 영어로 쓰고, notes에는 각 선택지의 우리말 해석과 본문 근거를 함께 쓴다.";
  }
  if(!MID_RULES[t.id]||["m_mood","m_dlg","m_refmc","m_fillw"].includes(t.id)) r+=" "+(MID_LEVEL[t.level]||"");
  else r+=" "+(MID_LEVEL[t.level]||"");
  r=r.replace(/와 SKY 단원 번호/g,"").replace(/SKY 단원 번호/g,"");
  return r+focusRule(t)+((WRITTEN_IDS.has(t.id)||WRITE_KINDS.has(t.kind))?MID_WRITTEN_GUIDE:"");
}

/* ---------------- 이미 만든 문제와 겹치지 않게 ---------------- */
function _nk(t){return String(t||"").toLowerCase().replace(/[^a-z0-9가-힣]+/g," ").trim()}
function _head(t){return _nk(t).split(" ").slice(0,12).join(" ")}
function qKeyOf(q){
  const strip=x=>_nk(String(x||"").replace(/\[\[(?:[0-9a-eU]):?([\s\S]*?)\]\]/g,"$1"));
  switch(q.type){
    case "transform": return strip(q.source);
    case "arrange": case "compose": return strip(q.answer);
    case "form": case "grammar_fix": return _nk((q.answers||[]).join(" | "));
    case "insert": return strip(q.sentence);
    case "m_ref": case "m_kw": case "m_trans": case "m_qa": return _nk([q.source,q.question,q.definition,q.answer].filter(Boolean).join(" ")).slice(0,160);
    default: return q.answer_text? strip(q.answer_text) : "";
  }
}
function previousQs(p){
  const out=[], h=_head(p.text), pn=_nk(p.text);
  const take=(q,orig)=>{
    const o=_nk(orig||q.orig||""); if(!o||!h) return;
    if(o.includes(h)||pn.includes(_head(orig||q.orig||""))) out.push(q);
  };
  (state.materials||[]).forEach(m=>{
    if(m.kind!=="variant"||!m.data||!Array.isArray(m.data.questions)) return;
    m.data.questions.forEach(q=>take(q,(m.data.passages||{})[q._p]));
  });
  if(state.set&&!state.set.demo&&Array.isArray(state.set.questions)) state.set.questions.forEach(q=>take(q));
  (state.prevQs||[]).forEach(q=>take(q)); /* 새로 만들기 직전에 화면에 있던 문항(저장이 늦어도 남도록) */
  (state.units||[]).forEach(u=>(u.questions||[]).forEach(q=>take(q)));
  const seen=new Set();
  return out.filter(q=>{const k=q.type+"|"+(qKeyOf(q)||JSON.stringify(q.options||q.explanation||"").slice(0,80));if(seen.has(k))return false;seen.add(k);return true});
}
/* 문항이 밑줄·네모로 짚은 대상(표시 안의 낱말) — 정답 번호가 ⓐ~ⓔ 같은 기호뿐인 유형도 같은 대상을 겹쳐 내지 않도록 */
function qMarks(q){
  const out=new Set();

  return out;
}
function avoidBlock(p,types){

  const sorted=prev.slice().sort((a,b)=>(ids.has(b.type)?1:0)-(ids.has(a.type)?1:0)).slice(0,36);
  const line=q=>{
    const k=qKeyOf(q), M=[...qMarks(q)].slice(0,5);
    const base=k?k.slice(0,90):(M.length?"":String(q.explanation||"").slice(0,60));

function plainMarked(raw,abc){
  return String(raw||"")
    .replace(/\[\[([ABC]):([\s\S]*?)\]\]/g,(a,n,x)=>`(${n})[ ${x.split("|").map(v=>v.trim()).join(" / ")} ]`)
    .replace(/\[\[(\d):([\s\S]*?)\]\]/g,(a,n,x)=>`${(abc?LB:CN)[n-1]} ${x}`)
    .replace(/\[\[([a-e]):([\s\S]*?)\]\]/g,(a,n,x)=>`(${n}) ${x}`)
    .replace(/\[\[U:([\s\S]*?)\]\]/g,(a,x)=>x)
    .replace(/\[\[BLANK\]\]/g,"_____");
}
function solveText(q,n){
  const t=T[q.type]; let s=`[문항 ${n}] ${stemOf(q)}\n`;
  if(t.kind==="insert"){
    s+=`주어진 문장: ${q.sentence}\n`;
    let body=String(q.chunks[0]||"");
    for(let k=1;k<=5;k++) body+=` ( ${CN[k-1]} ) `+String(q.chunks[k]||"");
    s+=body+"\n";
  } else if(t.kind==="irrelevant"){
    let body=String(q.intro||"");
    (q.sentences||[]).forEach((x,i)=>{body+=` ${CN[i]} ${x}`});
    if(q.tail) body+=" "+q.tail;
    s+=body+"\n";
  } else {
    s+=plainMarked(t.kind==="mc"?q.orig:(q.passage||q.orig||""),useAbc(q))+"\n";
    if(t.kind==="summary") s+=`요약문: ${q.summary}\n`;
    if(t.kind==="under"&&useAbc(q)) s+=LB.map((l,i)=>`${CN[i]} ${l}`).join("  ")+"\n";
  }
  if(Array.isArray(q.options)&&q.options.length) s+=q.options.map((o,i)=>`${CN[i]} ${optText(o)}`).join("\n")+"\n";
  return s;
}

function addLessons(entries){
  if(!entries.length) return;
  const L=JSON.parse(JSON.stringify(state.lessons||{}));
  entries.forEach(({type,t})=>{
    t=String(t||"").trim().slice(0,160); if(!t) return;
    const arr=L[type]||(L[type]=[]); const hit=arr.find(x=>x.t===t);

function chunk(arr,n){const r=[];for(let i=0;i<arr.length;i+=n)r.push(arr.slice(i,i+n));return r}
function sameType(a,b){return a===b}
function normalizeQs(raw,types,p){
  const list = Array.isArray(raw)?raw:(raw&&Array.isArray(raw.questions)?raw.questions:[]);
  return types.map((t,i)=>{
    const found = list.find(x=>x&&sameType(x.type,t.id)) || list[i] || {};
    const q = {...found, type:t.id};
    if(q.answer!=null) q.answer = parseInt(q.answer,10);

async function ask(prompt,tier,signal){
  return await sample.json(prompt,{modelTier:tier,signal,cache:false});
}
function optText(o){return Array.isArray(o)?o.join(" / "):String(o||"")}
function simText(a,b){
  a=normText(a).replace(/[^a-z0-9가-힣]/g,""); b=normText(b).replace(/[^a-z0-9가-힣]/g,"");
  if(!a||!b) return 0; if(a===b) return 1;
  if(a.includes(b)||b.includes(a)) return 0.9;
  const A=new Set(a.match(/.{1,2}/g)||[]), B=new Set(b.match(/.{1,2}/g)||[]);
  let hit=0; A.forEach(x=>{if(B.has(x))hit++});
  return hit/Math.max(A.size,B.size);
}
function reconcileAnswer(q,t){
  const at=String(q.answer_text||"").trim(); if(!at) return;
  let cands=[];
  if(Array.isArray(q.options)&&q.options.length) cands=q.options.map(optText);
  else if(t&&t.kind==="under"&&q.passage) cands=[1,2,3,4,5].map(n=>markerText(q.passage,String(n)));
  if(!cands.length) return;
  let best=-1,score=0;
  cands.forEach((c,i)=>{const s=simText(c,at); if(s>score){score=s;best=i}});
  if(best>=0&&score>=0.75){
    const idx=best+1;
    if(q.answer!==idx){ q._answerFixed=`정답 번호(${q.answer})와 정답 내용이 달라 내용 기준 ${idx}번으로 맞춤`; q.answer=idx; }
  }
}
function normOne(found,t,p){
  const q={...(found||{}),type:t.id,level:t.level}; if(t.lang) q.lang=t.lang; else delete q.lang;
  if(t.lvl==="mid") q.lv="mid"; else delete q.lv;
  if(t.kind==="refmc") q.options=["ⓐ","ⓑ","ⓒ","ⓓ","ⓔ"];
  reconcileAnswer(q,t);
  if(q.answer!=null && !["arrange","compose","short"].includes(t.kind)) q.answer=parseInt(q.answer,10);
  q.orig=p.text; q.src={grade:p.grade,no:p.no,exam:p.exam};
  return q;
}
function genericLesson(m){
  if(m.includes("원문에서 바뀐 밑줄은")) return "틀린 것·부적절한 것 문항은 정답 밑줄 한 곳만 원문과 다르게 바꾸고, 나머지 밑줄은 원문 그대로 둘 것";
  if(m.includes("만 원문 그대로이고")) return "옳은 것·적절한 것 문항은 정답 한 곳만 원문 그대로 두고, 나머지 네 곳은 모두 바꿀 것";

async function applyFixes(qs,res,types,p){
  const issues=Array.isArray(res&&res.issues)?res.issues:[];
  const fixed=Array.isArray(res&&res.fixed)?res.fixed:[];
  const accepted=new Set();
  fixed.forEach(f=>{
    const i=Number(f&&f.index); if(!(i>=0&&i<qs.length)||!f.question) return;
    const cand=normOne(f.question,types[i],p);
    const oldHard=validate(qs[i]).filter(x=>x.hard).length, newHard=validate(cand).filter(x=>x.hard).length;
    const hasContent=cand.options||cand.passage||cand.parts||cand.chunks||cand.sentences;

async function processUnit(u){

    if(k<0) k=list.findIndex((x,j)=>!used.has(j)&&fits(x,t,false));

    if(state.solveCheck!==false&&!conflicts.some(c=>c.i===i)&&SOLVE_KINDS.has((T[q.type]||{}).kind)&&Number.isInteger(q.answer))

}
let posCount=[0,0,0,0,0];
function pickPos(){const min=Math.min(...posCount);const c=[0,1,2,3,4].filter(i=>posCount[i]===min);const p=c[Math.floor(Math.random()*c.length)];posCount[p]++;return p}
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function finalize(qs){
  for(const q of qs){
    if(!q.ok) continue; const t=T[q.type];
    if(t.kind==="multi"||t.kind==="pair3"){
      const ans=q.answer-1; const idx=shuffleArr([0,1,2,3,4]); const target=pickPos();
      const rest=idx.filter(i=>i!==ans); const perm=[]; let k=0; for(let p=0;p<5;p++) perm[p]= p===target?ans:rest[k++];
      q.options=perm.map(i=>q.options[i]); q.answer=target+1;
      q.explanation=String(q.explanation).replace(/[①②③④⑤]/g,"");
    } else if(SHUFFLE_KINDS.has(t.kind) && t.cat!=="내용일치"){
      const target=pickPos(), ans=q.answer-1;
      const others=shuffleArr([0,1,2,3,4].filter(i=>i!==ans)); const perm=[];let k=0;
      for(let p=0;p<5;p++) perm[p]= p===target?ans:others[k++];
      const oldToNew={}; perm.forEach((o,p)=>oldToNew[o]=p);
      q.options=perm.map(i=>q.options[i]); if(Array.isArray(q.notes)&&q.notes.length===5) q.notes=perm.map(i=>q.notes[i]);
      q.explanation=String(q.explanation).replace(/[①②③④⑤]/g,c=>CN[oldToNew[CN.indexOf(c)]]);
      q.answer=target+1;
    } else if(t.kind==="order"){

  if(t.kind==="transform") return (q.answers||[])[0]||"";
  return q.answer||"";}
function aHTML(q,n){
  const t=T[q.type]; let ex=esc(q.explanation||"");
  if(t.kind==="order"){const seq=q.seq||ORDER_OPTS[0]; ex=ex.replace(/\{P([123])\}/g,(a,k)=>`(${seq[k-1]})`);}
  let body=`<p>${skyTag(ex)}</p>`;
  if(t.kind==="summary"&&q.summary_ko) body+=`<p class="sub">요약문 해석: ${esc(q.summary_ko)}</p>`;
  if(t.kind==="order") body+=`<p class="sub">정답 순서: ${(q.seq||ORDER_OPTS[0]).map(x=>`(${x})`).join(" - ")}</p>`;
  if(t.kind==="insert") body+=`<p class="sub">주어진 문장: ${esc(q.sentence)}</p>`;
  if(t.kind==="transform"){
    body=`<p class="sub">조건: ${esc(q.condition||"")}</p><ul class="a-fix">${(q.answers||[]).map(a=>`<li><b>${esc(a)}</b></li>`).join("")}</ul>`+body;
  } else if(t.kind==="arrange"||t.kind==="compose"){
    body=`<ul class="a-fix"><li><b>${esc(q.answer||"")}</b></li></ul><p class="sub">${esc(q.ko||"")}</p>`+body;
  } else if(t.kind==="fix"||t.kind==="form"){
    body=`<ul class="a-fix">${["a","b","c"].map((l,i)=>`<li>(${l}) ${esc(markerText(q.passage,l))} → <b>${esc((q.answers||[])[i]||"")}</b>${q.notes&&q.notes[i]?` <span class="sub">${skyTag(esc(q.notes[i]))}</span>`:""}</li>`).join("")}</ul>`+body;
  } else if(t.kind==="short"){
    body=`<ul class="a-fix"><li><b>${esc(q.answer||"")}</b></li></ul>${q.question?`<p class="sub">질문: ${esc(q.question)}</p>`:""}${q.definition?`<p class="sub">영영풀이: ${esc(q.definition)}</p>`:""}${q.source?`<p class="sub">${esc(q.source)}</p>`:""}`+body;
  } else if(t.kind==="pair3"){
    body=`<ul class="a-fix"><li>${["A","B","C"].map((l,i)=>`(${l}) <b>${esc(((q.options||[])[q.answer-1]||[])[i]||"")}</b>`).join("   ")}</li></ul>`+body+(Array.isArray(q.notes)&&q.notes.length===3?`<ol class="a-notes">${q.notes.map((x,i)=>`<li><span class="cn">${"ABC"[i]}</span><span>${esc(x)}</span></li>`).join("")}</ol>`:"");
  } else if(t.kind==="multi"&&Array.isArray(q.notes)&&q.notes.length===5){
    const hit=new Set(String((q.options||[])[q.answer-1]||"").match(/[ⓐ-ⓔ]/g)||[]);
    body+=`<ol class="a-notes">${q.notes.map((x,i)=>`<li class="${hit.has(LB[i])?"hit":""}"><span class="cn">${LB[i]}</span><span>${esc(x)}</span></li>`).join("")}</ol>`;
  } else if(Array.isArray(q.notes)&&q.notes.length===5&&t.kind!=="order"&&t.kind!=="insert"&&t.kind!=="irrelevant"){
    const lb=useAbc(q)?LB:CN;
    body+=`<ol class="a-notes">${q.notes.map((x,i)=>`<li class="${i===q.answer-1?"hit":""}"><span class="cn">${lb[i]}</span><span>${skyTag(esc(x))}</span></li>`).join("")}</ol>`;
  }
  return `<div class="a"><div class="a-head"><b>${n}.</b><span class="ans">${ansLabel(q)}${useAbc(q)&&t.kind!=="multi"?`<small style="margin-left:4px">${LB[q.answer-1]||""}</small>`:""}</span><small>${esc(q.src.no)}${/^\d/.test(q.src.no)?"번":""} ${esc(nameOf(q))}</small></div>${body}</div>`;
}
function keyHTML(list){
  const mc=list.filter(x=>!WRITE_KINDS.has(T[x.q.type].kind)), fx=list.filter(x=>WRITE_KINDS.has(T[x.q.type].kind));
  const blocks=[];
  chunk(mc,60).forEach((part,i)=>blocks.push({cat:"정답 및 해설",html:`<div class="keyblk">${i===0?"<h4>정답표</h4>":""}<div class="key">${part.map(x=>`<div><span>${x.n}</span><span>${ansLabel(x.q)}</span></div>`).join("")}</div></div>`}));
  if(fx.length) blocks.push({cat:"정답 및 해설",html:`<div class="keyblk"><h4>서술형 정답</h4><ul class="keyfix">${fx.map(x=>`<li><span>${x.n}</span><span>${esc(writeAnswer(x.q))}</span></li>`).join("")}</ul></div>`});
  return blocks;
}
function orderedQs(){
  const qs=(state.set&&state.set.questions||[]).filter(q=>q.ok&&T[q.type]&&(state.version==="all"||!q.level||q.level===state.version));
  const ti=id=>TYPES.findIndex(t=>t.id===id);
  const pn=q=>(parseInt(q.src.no,10)||0);
  const ci=q=>CAT_ORDER.indexOf(T[q.type].cat);
  const lv=q=>q.level==="상"?1:0;
  if(state.sort==="cycle"||state.sort==="cyclerand"){
    // 1세트: 지문마다 한 문항씩 순서대로 → 2세트: 다시 처음 지문부터. 같은 지문의 문항이 이웃하지 않는다.
    const exOrder=[...new Set(qs.map(q=>q.src.exam))];
    const pkey=q=>q.src.exam+"|"+q.src.no;
    const groups=new Map();
    [...qs].sort((a,b)=>(exOrder.indexOf(a.src.exam)-exOrder.indexOf(b.src.exam))||(pn(a)-pn(b))||String(a.src.no).localeCompare(String(b.src.no)))
      .forEach(q=>{const k=pkey(q);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(q)});
    const lists=[...groups.values()].map(g=>g.sort((a,b)=>(lv(a)-lv(b))||(ci(a)-ci(b))||(ti(a.type)-ti(b.type))));
    const out=[]; const max=Math.max(0,...lists.map(l=>l.length));
    const rand=state.sort==="cyclerand"; let prev=null;
    for(let r=0;r<max;r++){
      let row=lists.filter(l=>l[r]);
      if(rand){ /* 세트마다 지문 순서를 무작위로(같은 값이면 늘 같은 순서) — 앞 세트의 마지막 지문이 이번 세트 맨 앞에 오지 않게 */
        row=row.map((l,i)=>[l,hash((state.sortSeed||1)+":"+r+":"+l[0].src.exam+"|"+l[0].src.no)]).sort((p,q)=>p[1]-q[1]).map(p=>p[0]);
        if(prev&&row.length>1&&row[0]===prev){ const t=row[0]; row[0]=row[1]; row[1]=t; }
      }
      row.forEach(l=>{ l[r]._set=r+1; out.push(l[r]); });
      if(row.length) prev=row[row.length-1];
    }
    return out;
  }
  return [...qs].sort((a,b)=> state.sort==="type"
    ? (ci(a)-ci(b))||(ti(a.type)-ti(b.type))||(lv(a)-lv(b))||(pn(a)-pn(b))
    : (pn(a)-pn(b))||(ci(a)-ci(b))||(ti(a.type)-ti(b.type))||(lv(a)-lv(b)));
}
let pxPerMm=3.7795;
function measureSetup(cls){
  const m=$("#measure"); m.innerHTML=`<div class="page${cls?" "+cls:""}" style="position:static"><div class="col" id="mcol" style="width:87mm"></div><div id="mref" style="height:100mm"></div></div>`;
  pxPerMm = $("#mref").getBoundingClientRect().height/100 || 3.7795;
}
function paginate(blocks,kind,popt){
  measureSetup(popt?popt.cls:"");
  const col=$("#mcol"); const colH=252*pxPerMm;
  const heights=blocks.map(b=>{col.innerHTML=b.html;let h=col.scrollHeight; if(h>colH){col.innerHTML=`<div class="squeeze">${b.html}</div>`;h=col.scrollHeight;b.squeeze=true} return h});
  col.innerHTML="";
  const pages=[]; let page=null, side=0, used=0;
  const newCol=()=>{ if(!page||side===1){page={cols:[[],[]],cat:null};pages.push(page);side=0}else side=1; used=0; };
  newCol();
  blocks.forEach((b,i)=>{
    const h=heights[i];
    if(b.br&&(page.cols[0].length||page.cols[1].length)){ side=1; newCol(); }
    if(used>0 && used+h>colH+1) newCol();
    page.cols[side].push(b.squeeze?`<div class="squeeze">${b.html}</div>`:b.html);
    if(!page.cat) page.cat=b.cat;
    used+=h;
  });
  const s=state.set, academy=state.academy.trim();
  return pages.map((p,i)=>`<div class="page${popt?" "+popt.cls:""}"><div class="pg-head"><div class="pg-brand"><b>${popt?popt.brand:s.level==="mid"?"중등 변형문제":"변형문제"}</b>${kind==="a"?"<span>정답 및 해설</span>":""}${!popt&&state.version!=="all"?`<span class="lv">${state.version} 버전</span>`:""}</div><div class="pg-src">${esc(s.title)}${academy?`<i>|</i>${esc(academy)}`:""}</div></div><div class="pg-body"><div class="col">${p.cols[0].join("")}</div><div class="col">${p.cols[1].join("")}</div></div><div class="pg-foot"><span>${esc(p.cat||"")}</span><span class="cp">${academy?esc(academy)+" 수업용 자료입니다. 무단 배포를 금합니다.":"수업용 자료입니다. 무단 배포를 금합니다."}</span><span>${i+1}</span></div></div>`);
}
function buildPages(kind){
  const list=orderedQs().map((q,i)=>({q,n:i+1}));
  if(!list.length) return [];
  if(kind==="q") return paginate(list.map(x=>({cat:T[x.q.type].cat,html:qHTML(x.q,x.n)})),"q");
  return paginate([...keyHTML(list),...list.map(x=>({cat:"정답 및 해설",html:aHTML(x.q,x.n)}))],"a");
}
function fitScale(sel){
  sel=sel||"#sheets"; const wrap=$(sel); if(!wrap) return; const avail=wrap.clientWidth-8;
  wrap.querySelectorAll(".frame").forEach(f=>{
    const ls=!!f.querySelector(".page.land"), full=(ls?297:210)*pxPerMm, s=Math.min(1,avail/full);
    f.style.width=(full*s)+"px";f.style.height=((ls?210:297)*pxPerMm*s)+"px";f.style.setProperty("--s",s)});
}
function renderLessons(){
  const rows=[]; Object.entries(state.lessons||{}).forEach(([type,arr])=>arr.forEach((l,i)=>rows.push({type,i,...l})));
  rows.sort((a,b)=>(b.n-a.n)||(b.at-a.at));
  return `<section class="card"><h3>교정 노트</h3><p class="hint">교정에서 실제로 지적된 실수를 모아 둔 목록입니다. 새 문항을 만들 때 출제 지시에 함께 들어가 같은 실수를 미리 막습니다. 맞지 않는 노트는 지우세요.</p>${rows.length?`<ul class="lessons">${rows.slice(0,60).map(r=>`<li><span class="ty">${esc(T[r.type]?T[r.type].name:"공통")}</span><span>${esc(r.t)}</span><span class="n">${r.n}회</span><button class="link" type="button" data-lesson="${esc(r.type)}:${r.i}">지우기</button></li>`).join("")}</ul>`:`<p class="hint" style="margin:0">아직 쌓인 노트가 없습니다.</p>`}</section>`;
}
function renderLog(){
  const qs=state.set&&state.set.questions||[];
  const groups={};
  qs.forEach(q=>{const k=`${q.src.exam} ${q.src.no}`;(groups[k]=groups[k]||[]).push(q)});
  const html=Object.entries(groups).map(([k,list])=>`<section class="log-unit"><header><b>${esc(k)}${/\d$/.test(k)?"번":""}</b><span style="color:var(--muted);font-size:12.5px">${list.length}문항</span></header>${list.map(q=>{
    const audit=q.audit||[];
    const st=audit.map(a=>{
      const n=(a.issues||[]).length+(a.local||[]).length; const lab=a.label||`${a.pass}교`;
      return `<span class="stamp ${n?"fixed":"clean"}"><b>${esc(lab)}</b><small>${n?`수정 ${n}`:"통과"}</small></span>`;}).join("");
    const notes=audit.flatMap(a=>{const lab=a.label||`${a.pass}교`;return [...(a.issues||[]).map(x=>`<li><b>${esc(lab)}</b>${esc(x.problem)}${x.fix?` → ${esc(x.fix)}`:""}</li>`),...(a.local||[]).map(x=>`<li><b>자동 검사</b>${esc(x)}</li>`),...(a.note?[`<li class="ok"><b>${esc(lab)}</b>${esc(a.note)}</li>`]:[])]}).join("");
    const bad=!q.ok?`<span class="excluded">검수를 통과하지 못해 문제지에서 뺐습니다: ${esc(validate(q).filter(x=>x.hard).map(x=>x.m).join(" "))}</span>`:"";
    return `<div class="log-q"><div class="nm">${esc(nameOf(q))}<small>${esc(T[q.type].cat)}</small></div><div><div class="stamps">${st}</div>${notes?`<ul class="issues">${notes}</ul>`:""}${bad}</div></div>`;}).join("")}</section>`).join("");
  return `<div class="log">${html||`<div class="empty"><h3>교정 기록이 없습니다</h3><p>문제를 만들면 문항마다 교정 내용이 여기에 남습니다.</p></div>`}${renderLessons()}</div>`;
}

  }catch(e){}

async function printPages(pages,title){
  if(!pages||!pages.length){toast("인쇄할 내용이 없습니다.");return}
  try{await document.fonts.ready}catch(e){}
  const root=$("#print-root"); root.innerHTML=pages.join("");
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  let fired=false; const on=()=>{fired=true};
  window.addEventListener("beforeprint",on,{once:true});
  try{ window.print(); }catch(e){}
  setTimeout(()=>{
    window.removeEventListener("beforeprint",on);
    if(fired) return;
    if(!openPrintWindow(title,pages)) printFallback(title,pages);
  },700);
}
function printFallback(title,pages){

}

function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("script"));document.head.appendChild(s)})}
async function pdfjs(){
  if(window.pdfjsLib) return window.pdfjsLib;
  const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  await loadScript(base+"pdf.min.js");
  await loadScript(base+"pdf.worker.min.js");

async function pdfText(buf){
  const lib=await pdfjs(); const doc=await lib.getDocument({data:buf}).promise; const out=[];
  for(let n=1;n<=doc.numPages;n++){
    const page=await doc.getPage(n); const vp=page.getViewport({scale:1}); const tc=await page.getTextContent();
    const items=tc.items.filter(it=>it.str&&it.str.trim()).map(it=>({x:it.transform[4],y:it.transform[5],s:it.str}));
    const mid=vp.width/2;
    [items.filter(i=>i.x<mid-4),items.filter(i=>i.x>=mid-4)].forEach(col=>{
      col.sort((a,b)=>(b.y-a.y)||(a.x-b.x));
      let line=[],ly=null;
      col.forEach(it=>{ if(ly!==null&&Math.abs(it.y-ly)>3){out.push(line.map(x=>x.s).join(" "));line=[]} line.push(it);ly=it.y; });
      if(line.length) out.push(line.map(x=>x.s).join(" "));
    });
    out.push("");
  }
  return out.join("\n");
}
async function fileText(file){
  if(!file) return "";
  const buf=await file.arrayBuffer(); const head=new Uint8Array(buf.slice(0,4));
  if(head[0]===0x25&&head[1]===0x50&&head[2]===0x44&&head[3]===0x46) return await pdfText(buf);
  if(head[0]===0x50&&head[1]===0x4B) throw new Error("zip");
  let t=new TextDecoder("utf-8").decode(buf);
  if((t.match(/\uFFFD/g)||[]).length>20){try{t=new TextDecoder("euc-kr").decode(buf)}catch(e){}}
  return t;
}
/* fast path: files already laid out like the reference sets (지문 번호 + 목적 발문) */
function localParse(text){
  const L=text.replace(/\r/g,"").split("\n").map(l=>l.replace(/\f/g,"")).filter(l=>l&&!/^이 자료는 저작권/.test(l)&&!/^20\d\d 고/.test(l)&&!/^(대의파악|내용일치\/불일치|어법|어휘|함축어구|서술형|정답 및 해설)( \d+)?$/.test(l));
  const out=[];
  for(let i=0;i<L.length;i++){
    const m=L[i].match(/^(\d+(?:~\d+)?)번$/);
    if(m&&L[i+1]&&L[i+1].includes("목적으로")){
      let j=i+2; const block=[]; while(j<L.length&&!/^\d+(~\d+)?번$/.test(L[j])){block.push(L[j]);j++}
      const idx=block.map((b,k)=>b.startsWith("To ")?k:-1).filter(k=>k>=0);
      const lines=block.slice(0,idx.length>=5?idx[idx.length-5]:block.length);
      if(!out.some(p=>p.no===m[1])){
        let t=""; lines.forEach((l,k)=>{l=l.replace(/\u0002/g,"-").trim(); if(!t){t=l;return} const prev=lines[k-1].trim(); t+=(prev.length<32&&prev.endsWith(","))?"\n"+l:" "+l;});
        out.push({no:m[1],text:t.replace(/ Sincerely,/,"\nSincerely,").replace(/ +/g," "),note:""});
      }
      i=j-1;
    }
  }
  return out.length>=8?out:null;
}
function trimForPrompt(text,limit){
  const enc=new TextEncoder();
  if(enc.encode(text).length<=limit) return text;
  const k=text.search(/(^|\n)\s*18\s*[.．]/); if(k>0) text=text.slice(k);
  while(enc.encode(text).length>limit) text=text.slice(0,Math.floor(text.length*0.92));
  return text;
}

function expandPassages(){
  return currentPassages().map(p=>{
    const kind=p.kind||(state.srcMode==="book"?"book":state.srcMode==="exam"?"exam":state.srcMode==="ext"?"ext":"");
    const splittable = kind==="book" || kind==="ext"; /* 모의고사 지문은 나누지 않는다 */
    const long = splittable && wordCount(p.text)>SPLIT_MAX;

  });
}
function partPassage(P,parts,pi){
  return {...P, no: parts.length>1?`${P.no} 본문${pi+1}`:P.no, text:parts[pi]};
}
function itemsForPassage(P){
  const dl=isDialogue(P.text);
  const base=selItems().filter(t=>!t.dlg||dl);
  const isBook = (P.kind||(state.srcMode==="book"?"book":""))==="book";
  return isBook ? base.concat(grammarItems()) : base;

function buildUnits(){
  const units=[];
  expandPassages().forEach(P=>{
    const items=itemsForPassage(P);
    const parts=P.parts;
    if(parts.length<2){ chunk(items,3).forEach((g,gi)=>units.push({id:P.key+"-"+gi,p:{...P,text:parts[0]},types:g,status:"wait",questions:[]})); return; }
    if(state.bookSplit==="each"){
      parts.forEach((t,pi)=>chunk(items,3).forEach((g,gi)=>{
        units.push({id:`${P.key}-${pi}-${gi}`,p:partPassage(P,parts,pi),types:g,status:"wait",questions:[]});
      }));
      return;
    }
    const buckets=parts.map(()=>[]);
    items.forEach((it,i)=>buckets[i%parts.length].push(it));
    buckets.forEach((its,pi)=>chunk(its,3).forEach((g,gi)=>{
      units.push({id:`${P.key}-${pi}-${gi}`,p:partPassage(P,parts,pi),types:g,status:"wait",questions:[]});
    }));
  });
  return units;
}

const RF_CIRC=["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩","⑪","⑫","⑬","⑭","⑮","⑯","⑰","⑱","⑲","⑳"];

function rfPrompt(p){

${passageHeader(p)}
[만들 것]
1. gist — 이 글을 한마디로 정리한 한글 한두 문장(80자 이내). 글쓴이가 무엇을 말하려는 글인지가 드러나야 합니다.
2. bg — 이 글의 배경과 의도를 자세히 풀어 쓴 한글 설명 3가지(각 2~3문장, 70~170자). 학생이 "이 사람이 왜 이런 글을 썼고 나에게 무엇을 바라는지"를 알아야 글이 이해되기 때문입니다.
 - background: 이 글의 '출처와 뿌리'를 설명합니다. ① 이 글이 어떤 종류의 글에서 나왔는지(책의 어느 분야, 신문·잡지 칼럼, 학술 연구 소개, 안내문, 이야기 등)와 ② 어떤 학문·이론·사회 현상·역사적 사건·이야기에서 파생된 내용인지(예: '도덕적 면허 효과'라는 심리학 연구, 자본주의와 환경 문제를 다루는 사회학 논의)를 풀어 줍니다. 학생이 모를 만한 핵심 개념의 정체도 함께 알려 줍니다. 출처의 책 제목·저자·연도·기관·수치는 확실히 아는 널리 알려진 경우가 아니면 절대 지어내지 말고, 확실하지 않으면 '~분야의 글로 보인다', '~에 관한 논의에서 나온 내용이다'처럼 갈래와 분야까지만 씁니다.
 - why: 필자가 왜 이 글을 썼는지(문제 제기, 안내, 설득, 경험 공유, 정보 전달 등 쓴 동기)를 지문 근거로 설명합니다.
 - want: 필자가 독자에게 결국 무엇을 원하는지(알아 두길, 행동하길, 생각을 바꾸길, 공감하길 등)와 이 글이 말하려는 최종 메시지를 설명합니다.
 - 중요한 낱말은 한글 뒤 괄호에 영어(지문에 나온 그대로)를 붙입니다.
3. points — 14~20개(지문이 짧아도 최소 12개). 이 자료는 A4 한 쪽에 지문 하나를 빈 곳 없이 꽉 채워 인쇄하므로, 지문을 이해하는 데 필요한 내용을 충분히 담아야 합니다. 지문이 길수록 20개에 가깝게, 짧은 지문은 한 문장을 '무슨 뜻인지 → 왜 그렇게 말했는지 → 그래서 어떻게 되는지'로 나누어 최소 12개 이상을 채웁니다. 단 같은 말을 반복하는 군더더기는 금지입니다. 지문의 처음부터 끝까지 이야기가 흐르는 순서대로, 중요한 내용은 빠뜨리지 않되 사소한 내용은 과감히 묶거나 뺍니다.
 - tag: 그 포인트의 역할을 나타내는 한글 낱말 1개(배경·상황·주제 제시·원인·이유·예시·설명·대조·반전·결과·주장·조건·부탁·결론·마무리 중에서 알맞은 것).
 - t: 한글로 풀어 쓴 설명 1~2문장(35~90자). 지문의 문장이 무슨 뜻인지, 앞 문장과 어떻게 이어지는지(왜·그래서·하지만), 글쓴이가 그 말을 하는 이유까지 학생이 바로 이해되도록 풉니다. 지문의 숨은 뜻이나 앞뒤 논리가 어려운 곳은 더 친절히 설명합니다.
4. 영어 낱말: 설명하다가 중요한 낱말·표현은 한글 바로 뒤 괄호 안에 영어를 지문에 나온 그대로 적습니다. 포인트마다 1~3개. 예) 학교 축제(festival)가 10월 14일에 열린다. 괄호 속 영어는 반드시 지문에 있는 낱말(필요하면 원형)이어야 합니다. 영어 문장을 통째로 옮기지 않습니다. 어려운 구문·접속어(because, instead, however 등)가 논리의 열쇠라면 그 영어를 괄호에 넣고 우리말로 무슨 역할을 하는지 풀어 줍니다.
5. points를 이어 읽으면 지문 전체가 완벽히 이해되어야 합니다. 같은 내용을 반복하지 말고, 같은 내용을 억지로 늘리지 않습니다. 지문이 길면 한 포인트에 여러 문장의 핵심을 묶습니다.
[규칙] 지문에 없는 사실·수치·의견을 지어내지 않습니다. 중학교 2학년이 이해하는 쉬운 우리말로, 선생님이 옆에서 설명해 주는 말투(~해요 대신 ~한다 체)로 씁니다.
[출력] 설명 없이 JSON 하나만: {"title_ko":"지문을 한 줄로 요약한 한글 제목","gist":"한마디 정리","bg":{"background":"…","why":"…","want":"…"},"points":[{"tag":"배경","t":"한글 설명(영어 낱말)"}]}`;
}
function rfNorm(r,text){
  if(!r||typeof r!=="object"||!Array.isArray(r.points)) return null;
  const ko=t=>/[가-힣]/.test(t), flat=t=>String(t||"").toLowerCase(), src=flat(text);
  const fixParen=t=>t.replace(/\(([A-Za-z][A-Za-z' \-]{1,30})\)/g,(m,w)=>{ const k=w.toLowerCase().trim(); const stem=k.length>5?k.slice(0,k.length-2):k; return src.includes(stem)?m:""; }).replace(/\s{2,}/g," ").trim();
  const seen=new Set(), pts=[];
  r.points.forEach(o=>{ if(!o) return; let t=String(o.t||"").replace(/\s+/g," ").trim(); if(t.length<14||!ko(t)) return; t=fixParen(t).slice(0,200);
    const k=t.replace(/[^가-힣A-Za-z0-9]/g,""); if(seen.has(k)) return; seen.add(k);
    pts.push({tag:String(o.tag||"").replace(/\s+/g,"").slice(0,6)||"설명",t}); });
  if(pts.length<12) return null;
  const gist=String(r.gist||"").replace(/\s+/g," ").trim().slice(0,140); if(!ko(gist)) return null;
  const g=r.bg&&typeof r.bg==="object"?r.bg:{}, bg={};
  for(const k of ["background","why","want"]){ const v=fixParen(String(g[k]||"").replace(/\s+/g," ").trim()).slice(0,300); if(v.length<30||!ko(v)) return null; bg[k]=v; }
  return {title_ko:String(r.title_ko||"").replace(/\s+/g," ").trim().slice(0,60),gist,bg,points:pts.slice(0,20)};
}

async function rfGen(d,run){
  const p={exam:d.src||"지문",no:d.no,grade:/고[123]/.exec(d.src||"")?.[0]||"",text:d.text};
  d.status="work";
  for(let a=0;a<3&&!run.ctl.signal.aborted;a++){
    let r=null; try{ r=await sample.json(rfPrompt(p),{modelTier:state.tier,signal:run.ctl.signal,cache:false}); }catch(e){ if(e&&e.code==="cancelled") throw e; if(e&&["not_granted","rate_limited","sampling_disabled","session_expired"].includes(e.code)){ d.error=errCopy(e); d.status="error"; run.ctl.abort(); toast(errCopy(e)); return; } r=null; }
    const n=rfNorm(r,d.text); if(n){ Object.assign(d,n,{status:"done"}); return; }
  }
  d.status=run.ctl.signal.aborted?"stop":"error";
}
async function rfRun(onlyBad){
  if(!sample){toast("이 페이지를 Claude 안에서 열어야 자료를 만들 수 있습니다.");return}

    const rows=filledRows("rf"); if(!rows.length){toast("지문을 넣어 주세요.");return}

    state.sub.rf="result"; state.rfTab="q"; renderView();
  }
  run.running=true; run.ctl=new AbortController(); rfProg();
  const queue=state.rfResult.docs.filter(d=>d.status!=="done"); let busy=0;
  const worker=async()=>{ while(queue.length&&!run.ctl.signal.aborted){ const d=queue.shift(); try{ await rfGen(d,run); }catch(e){ d.status="stop"; } rfProg(); renderRfSheets(); } };
  await Promise.all(Array.from({length:4},worker));
  run.running=false; state.rfResult.docs.forEach(d=>{ if(d.status==="wait"||d.status==="work") d.status="stop"; }); rfProg(); renderRfSheets();
  const ok=state.rfResult.docs.filter(d=>d.status==="done").length; if(ok) toast(`리딩 플로우 ${ok}개를 만들었습니다.`);
}
function buildRfPages(kind){

        {cat:nm,html:`<div class="rf-bg"><div class="rf-sl">이 글의 배경과 의도</div><dl><dt>배경 지식 · 출처와 뿌리</dt><dd>${esc(d.bg.background)}</dd><dt>왜 이 글을 썼나</dt><dd>${esc(d.bg.why)}</dd><dt>무엇을 원하나</dt><dd>${esc(d.bg.want)}</dd></dl></div>`}];

    };

function mtPlan(setNo,n,used,uses){

function splitSentences(text){

  const lines=String(text).split(/\n+/).map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean);
  const paras=[];
  lines.forEach(l=>{
    const prev=paras[paras.length-1];

    const cont=prev&&!greet&&!/[.!?]["”’)\]]*$/.test(prev)&&(/[,;—–-]$/.test(prev)||/^[a-z,)\]]/.test(l));

    while((m=re.exec(t))){const end=m.index+m[0].length; out.push(t.slice(start,end).trim()); start=end;}
    const last=t.slice(start).trim(); if(last) out.push(last);
  });

  const merged=[];

    else merged.push(x);
  });

}

const BX_CHUNK_RULES=`[chunks 규칙]

function bxSegOK(chunks,sentence){
  if(!Array.isArray(chunks)||!chunks.length) return false;
  const strip=s=>normText(s).replace(/\s+/g,"");
  return strip(chunks.filter(g=>g&&typeof g.t==="string").map(g=>g.t).join(""))===strip(sentence);
}

}
async function runAnalysisBx(){
  if(!sample){toast("이 페이지를 Claude 안에서 열어야 분석서를 만들 수 있습니다.");return}
  const rows=filledRows("ana"); if(!rows.length){toast("분석할 지문을 넣어 주세요.");return}
  const run=state.anaRun; run.running=true; run.ctl=new AbortController();
  rows.forEach(r=>{r.text=tidyBreaks(r.text)});
  const docs=rows.map((r,i)=>({n:i+1,no:(r.title||"").replace(/번$/,"").trim(),title_ko:/^\d+(~\d+)?번?$/.test((r.title||"").trim())?"":(r.title||""),src:r.src,text:r.text.trim(),sentences:splitSentences(r.text).map(s=>({s,status:"wait"}))}));
  state.anaResult={fmt:2,kicker:state.ana.kicker,docs,created:Date.now()};
  state.sub.ana="result"; renderView();
  const jobs=[];
  docs.forEach(d=>{
    ["head","review","gram","seq","vocab"].forEach(k=>jobs.push({d,kind:k}));
    for(let k=0;k<d.sentences.length;k+=4) jobs.push({d,kind:"sent",start:k,end:Math.min(k+4,d.sentences.length)});
  });
  run.total=jobs.length; run.done=0;
  const call=async(prompt,tier)=>{
    let last=null;
    for(let attempt=0;attempt<2;attempt++){
      try{ const r=await sample.json(prompt,{modelTier:tier,signal:run.ctl.signal,cache:false}); if(r&&typeof r==="object") return r; }
      catch(e){ if(e&&e.code==="cancelled") throw e; last=e; }
    }
    if(last) throw last; return null;
  };
  const doJob=async j=>{
    const d=j.d, sents=d.sentences.map(x=>x.s);
    if(j.kind==="head"){
      const r=await call(bxHeadPrompt(d.text,sents),"default"); if(!r) return;
      if(!d.title_ko||/^\d+번?$/.test(d.title_ko)) d.title_ko=bxS(r.title_ko)||d.title_ko;
      d.title_en=bxS(r.title_en); d.topic_en=bxS(r.topic_en); d.topic_ko=bxS(r.topic_ko);
      d.points=bxA(r.points).map(bxS).filter(Boolean).slice(0,4);
      d.flow=bxA(r.flow).filter(f=>f&&bxS(f.text)).slice(0,4).map(f=>({label:bxS(f.label),text:bxS(f.text)}));
      d.scenes=bxA(r.scenes).filter(x=>x&&bxS(x.easy||x.cap)).map(x=>({range:bxS(x.range),cap:bxS(x.cap),easy:bxS(x.easy)}));
      d.easy_intro=bxS(r.easy_intro);
    } else if(j.kind==="review"){
      const r=await call(bxReviewPrompt(d.text,sents),state.tier); if(!r) return;
      d.rv={summary_en:bxS(r.summary_en),summary_ko:bxS(r.summary_ko),easy:bxS(r.easy),
        ox:bxA(r.ox).filter(x=>x&&bxS(x.q)).slice(0,4).map(x=>({q:bxS(x.q),a:/^o/i.test(bxS(x.a))?"O":"X",ev:bxS(x.ev),why:bxS(x.why)})),
        test:r.test&&typeof r.test==="object"?{gram:r.test.gram||null,voc:r.test.voc||null,essay:r.test.essay||null}:{},
        voca:bxA(r.voca).filter(x=>x&&bxS(x.w)).slice(0,8).map(x=>({w:bxS(x.w),mean:bxS(x.mean),syn:bxS(x.syn),ant:bxS(x.ant)}))};
    } else if(j.kind==="gram"){
      const r=await call(bxGramPrompt(d.text,sents),state.tier); if(!r) return;
      d.gr={sub:bxS(r.sub),cards:bxA(r.cards).filter(c=>c&&bxS(c.head)).slice(0,4).map(c=>({head:bxS(c.head),ex:bxS(c.ex),left:bxS(c.left),fm:bxS(c.fm),check:bxS(c.check),ans:bxS(c.ans),unit:Number(c.unit)||0})),
        chain:bxA(r.chain).filter(c=>c&&bxS(c.t)).slice(0,3).map(c=>({t:bxS(c.t),s:bxS(c.s)}))};
    } else if(j.kind==="seq"){
      let r=null;
      for(let attempt=0;attempt<2;attempt++){
        r=await call(bxSeqPrompt(d.text,sents),state.tier); if(!r) continue;
        const ok=bxA(r.sentences).filter(x=>x&&Number.isInteger(+x.i)&&sents[+x.i-1]&&bxSegOK(bxA(x.cards).map(c=>({t:c&&c.t})),sents[+x.i-1]));
        if(ok.length>=2||attempt===1){ r.sentences=ok.length?ok:bxA(r.sentences); break; }
      }
      if(!r) return;
      d.sq=bxA(r.sentences).filter(x=>x&&Number.isInteger(+x.i)&&sents[+x.i-1]).slice(0,2).map(x=>({i:+x.i,sub:bxS(x.sub),merged:bxS(x.merged),tip:bxS(x.tip),
        link:x.link&&bxS(x.link.from)?{from:bxS(x.link.from),to:bxS(x.link.to),text:bxS(x.link.text)}:null,
        cards:bxA(x.cards).filter(c=>c&&bxS(c.t)).map(c=>({t:bxS(c.t),ko:bxS(c.ko),tag:bxS(c.tag),read:bxS(c.read),care:bxS(c.care)}))}));
    } else if(j.kind==="vocab"){
      const r=await call(bxVocabPrompt(d.text,sents),state.tier); if(!r) return;

const BASE_VOCAB={"b-2026-1-09":VOCAB["고1"],"b-2026-2-09":VOCAB["고2"]};

function vocabKey(ex){

function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function seededShuffle(arr,seed){const a=arr.map((x,i)=>[x,hash(seed+":"+i+":"+x[0])]);a.sort((p,q)=>p[1]-q[1]);return a.map(x=>x[0])}

  const w=state.words, ex=wordsExam(), key=vocabKey(ex); const blocks=[];
  ex.passages.filter(p=>w.sel.has(p.no)).forEach(p=>{
    let list=vocabOf(key,p.no)||[]; if(!list.length) return;
    if(w.shuffle) list=seededShuffle(list,String(w.seed)+p.no);
    for(let k=0;k<list.length;k+=22){
      const part=list.slice(k,k+22);
      const rows=part.map((x,i)=>{const n=k+i+1;
        if(w.mode==="list") return `<div class="wd-row"><span class="n">${n}</span><span class="w">${esc(x[0])}</span><span class="m">${esc(x[1]||"")}</span></div>`;

      }).join("");
      blocks.push(`<div class="wd-blk"><h4>${esc(p.no)}${/^\d/.test(p.no)?"번":""}${k?" (계속)":""}</h4>${rows}</div>`);

[출력] 설명 없이 JSON 하나만: {"items":[["단어","뜻"], ...]}`;

function chunkText(text,limit){
  const enc=new TextEncoder(); const parts=text.split(/\n{2,}/); const out=[]; let cur="";
  parts.forEach(p=>{ if(enc.encode(cur+"\n\n"+p).length>limit&&cur){out.push(cur);cur=p} else cur=cur?cur+"\n\n"+p:p; });
  if(cur) out.push(cur);
  return out.flatMap(c=>{ if(enc.encode(c).length<=limit) return [c]; const r=[]; for(let i=0;i<c.length;i+=Math.floor(limit/3)) r.push(c.slice(i,i+Math.floor(limit/3))); return r; });
}
function extractPrompt(name,text){

- 같은 지문이 여러 번 나오면 한 번만 넣습니다. 한 문장짜리 예문이나 문제 보기 문장은 지문이 아닙니다.
- 줄 끝 하이픈으로 끊긴 단어는 붙이고, 편지·안내문의 인사말과 서명은 줄바꿈(\\n)을 살립니다. 철자와 문장부호는 그대로 둡니다.

async function handleDropFiles(key,files){
  files=[...files].filter(f=>/\.(pdf|txt)$/i.test(f.name)||/pdf|text/.test(f.type));
  if(!files.length){toast("PDF나 텍스트 파일만 넣을 수 있습니다.");return}
  const name=files.map(f=>f.name.replace(/\.[^.]+$/,"")).join(", ");
  state.modal={type:"pdf",key,name,status:"loading",msg:"PDF에서 글자를 읽고 있습니다.",items:[],sel:new Set()}; renderModal();
  try{
    let text="";
    for(const f of files) text+=(await fileText(f))+"\n\n";
    if((text.match(/[A-Za-z]{2,}/g)||[]).length<40) throw new Error("empty");
    let items=localParse(text);
    if(items) items=items.map(p=>({title:p.no+"번",text:p.text,note:""}));
    else if(sample){
      const chunks=chunkText(text,45000);
      state.modal.msg=`Claude가 영어 지문을 찾아 정리하고 있습니다${chunks.length>1?` (${chunks.length}부분으로 나눠 처리)`:""}. 1~2분 걸릴 수 있습니다.`; renderModal();
      const res=await Promise.all(chunks.map(c=>sample.json(extractPrompt(name,c),{modelTier:"default",cache:false}).catch(e=>{ if(e&&e.code==="prompt_too_large") return {passages:[]}; throw e; })));
      items=res.flatMap(r=>Array.isArray(r&&r.passages)?r.passages:[]).filter(p=>p&&String(p.text||"").split(/\s+/).length>=30)
        .map(p=>({title:String(p.title||"").trim(),text:String(p.text).trim(),note:String(p.note||"").trim()}));
      const seen=new Set(); items=items.filter(p=>{const k=normText(p.text).replace(/[^a-z]/g,"").slice(0,80); if(seen.has(k)) return false; seen.add(k); return true;});
    } else {
      items=[{title:"",text:text.replace(/[ \t]+/g," ").trim(),note:"Claude 없이 읽어서 지문을 나누지 못했습니다. 표에서 직접 다듬어 주세요."}];
    }
    if(!state.modal||state.modal.type!=="pdf") return;
    if(!items.length) throw new Error("none");
    state.modal.items=items; state.modal.sel=new Set(items.map((_,i)=>i)); state.modal.status="ready";
    state.modal.msg=`${items.length}개 지문을 찾았습니다. 넣을 지문을 고르세요.`;
  }catch(e){
    if(!state.modal||state.modal.type!=="pdf") return;
    state.modal.status="error";
    state.modal.msg = e&&e.message==="zip" ? "압축 파일은 읽지 못합니다. PDF를 올려 주세요."
      : e&&e.message==="empty" ? "글자를 거의 찾지 못했습니다. 스캔한 PDF라면 글자를 복사해 붙여 넣어 주세요."
      : e&&e.message==="none" ? "영어 지문을 찾지 못했습니다."
      : e&&e.message==="script" ? "PDF 읽기 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요."
      : e&&e.code ? errCopy(e) : "파일을 읽지 못했습니다.";
  }
  renderModal();
}

function dropKey(){ if(state.view==="rf"&&state.sub.rf==="new") return "rf"; if(state.view==="mt"&&state.sub.mt==="new") return "mt"; if(state.view==="ps"&&state.sub.ps==="new") return "ps"; if(state.view==="cr"&&state.sub.cr==="new") return "cr"; if(state.view==="hs"&&state.sub.hs==="new") return "hs"; if(state.view==="exam"&&state.sub.exam==="new") return "exam"; if(state.view==="basic"&&state.sub.basic==="new") return "basic"; if(state.view==="wkbk"&&state.sub.wkbk==="new") return "wkbk"; if(state.view==="cls"&&state.sub.cls==="new") return "cls"; if(state.view==="ana"&&state.sub.ana==="new") return "ana"; if(state.view==="gen"&&state.sub.gen==="new") return "gen"; if(state.view==="lib"&&!state.bulk.running) return "lib"; return null; }

const MONTH_WORDS={"3":["3월"],"4":["4월"],"5":["5월"],"6":["6월"],"7":["7월"],"9":["9월"],"10":["10월"],"11":["11월"]};
function metaFromName(name){
  const s=name.replace(/[_\-]+/g," ");
  const y=(s.match(/20\d\d/)||[])[0];
  const g=(s.match(/고\s?([123])/)||[])[1];
  const mo=(s.match(/(\d{1,2})\s?월/)||[])[1];
  const kind=/수능/.test(s)?"수능":/모의평가|평가원/.test(s)?"모의평가":"학력평가";
  if(!y||!g||!mo||!MONTH_WORDS[String(+mo)]) return null;
  return {year:+y,grade:"고"+g,month:+mo,kind};
}
async function metaFromText(name,text){
  const local=metaFromName(name); if(local) return local;

async function bulkImport(files){
  files=[...files].filter(f=>/\.(pdf|txt)$/i.test(f.name)||/pdf|text/.test(f.type));
  if(!files.length){toast("PDF나 텍스트 파일만 넣을 수 있습니다.");return}
  if(files.length>40){toast("한 번에 40개까지만 처리합니다. 나눠서 올려 주세요.");files=files.slice(0,40)}
  const b=state.bulk;
  b.items=files.map(f=>({name:f.name,file:f,status:"wait",msg:"대기"}));
  b.running=true; state.view="lib"; renderView();
  const q=[...b.items];
  const one=async it=>{
    const upd=(s,m)=>{it.status=s;it.msg=m;renderBulk()};
    try{
      upd("busy","파일 읽는 중");
      const text=await fileText(it.file);
      if((text.match(/[A-Za-z]{2,}/g)||[]).length<40) throw new Error("empty");
      upd("busy","시험 확인 중");
      const meta=await metaFromText(it.name,text);
      if(!meta) throw new Error("meta");
      it.meta=meta; const title=examTitle(meta), id=examId(meta);
      if(state.library.some(e=>e.id===id)&&!b.overwrite){ upd("skip",`${title} — 이미 보관함에 있어 건너뜀`); return; }
      let passages=localParse(text);
      if(!passages){
        if(!sample) throw new Error("nosample");
        upd("busy",`${title} — 지문 복원 중`);
        const body=trimForPrompt(text,52000);
        const [a,c]=await Promise.all(["18~31","32~45"].map(r=>sample.json(splitPrompt(title,body,"",r),{modelTier:"default",cache:false}).catch(()=>null)));
        passages=[...((a&&a.passages)||[]),...((c&&c.passages)||[])].filter(p=>p&&p.no&&String(p.text||"").split(/\s+/).length>=30)
          .map(p=>({no:String(p.no).replace(/\s/g,"").replace(/[-–]/,"~"),text:String(p.text).trim(),note:String(p.note||"").trim()}));
        const seen=new Set(); passages=passages.filter(p=>!seen.has(p.no)&&seen.add(p.no));
        passages.sort((x,y)=>parseInt(x.no)-parseInt(y.no));
      }
      if(!passages.length) throw new Error("none");
      await saveExam({id,title,grade:meta.grade,year:meta.year,month:meta.month,kind:meta.kind,added:Date.now(),passages:passages.map(p=>({no:p.no,text:p.text}))});
      const flagged=passages.filter(p=>p.note).length;
      upd("done",`${title} · 지문 ${passages.length}개 저장${flagged?` · 복원 확인 ${flagged}개`:""}${meta.guess?" · 시험 정보 추정":""}`);
    }catch(e){
      upd("err", e&&e.message==="empty"?"글자를 찾지 못했습니다(스캔본)":e&&e.message==="meta"?"어떤 시험인지 알 수 없습니다. 파일 이름에 연도·학년·월을 넣어 주세요":e&&e.message==="none"?"독해 지문을 찾지 못했습니다":e&&e.message==="nosample"?"Claude 안에서 열어야 합니다":e&&e.code?errCopy(e):"읽지 못했습니다");
    }
  };
  await Promise.all(Array.from({length:2},async()=>{while(q.length) await one(q.shift())}));
  b.running=false; renderView();
  const ok=b.items.filter(x=>x.status==="done").length;
  if(ok) toast(`${ok}개 시험을 보관함에 저장했습니다.`);
}

function wkbkOxSim(a,b){ const g=t=>{ t=String(t).toLowerCase().replace(/[^a-z0-9가-힣]/g,""); const o=new Set(); for(let i=0;i<t.length-1;i++) o.add(t.slice(i,i+2)); return o; };
  const A=g(a),B=g(b); if(!A.size||!B.size) return 0; let n=0; A.forEach(x=>{ if(B.has(x)) n++; }); return n/(A.size+B.size-n); }

function wkbkOxPick(pool,nKo,nEn,hardKo,hardEn){
  const dedupe=arr=>{ const out=[]; arr.forEach(x=>{ if(!out.some(y=>wkbkOxSim(x.q,y.q)>.72)) out.push(x); }); return out; };
  const pickN=(arr,n,needHard)=>{
    const cap=Math.ceil(n*.6); let o=0,x=0,h=0; const ch=new Set();
    const add=i=>{ const a=arr[i]; if(ch.has(i)||ch.size>=n) return false; if(a.answer==="O"?o>=cap:x>=cap) return false; ch.add(i); if(a.answer==="O") o++; else x++; return true; };
    arr.forEach((a,i)=>{ if(h<needHard&&a.level==="hard"&&add(i)) h++; });
    arr.forEach((a,i)=>{ add(i); });
    return [...ch].sort((a,b)=>a-b).map(i=>arr[i]);
  };
  return {ko:pickN(dedupe(pool.ko),nKo,hardKo),en:pickN(dedupe(pool.en),nEn,hardEn)};
}

      prev.en=String(prev.en||"")+" "+String(c.en||""); prev.ko=(String(prev.ko||"")+" "+String(c.ko||"")).trim();
      prev.tag=String(prev.tag||"").replace(/\s*\(동격\)$/,"")+"(동격)";
    } else out.push({...c});
  });
  return out;
}

function illusSVG(il){
  if(!il||!Array.isArray(il.nodes)||!il.nodes.length) return "";
  const n=il.nodes.slice(0,5), kind=il.kind||"flow";
  const W=560, boxW=kind==="compare"?230:Math.min(150,(W-20-(n.length-1)*26)/n.length), boxH=78;
  const esc2=s=>esc(String(s||""));
  let inner="", H=140;
  const box=(x,y,w,nd)=>`<g><rect x="${x}" y="${y}" width="${w}" height="${boxH}" rx="10" fill="#faf6f7" stroke="#7A2233" stroke-width="1.2"/><text x="${x+w/2}" y="${y+26}" text-anchor="middle" font-size="19">${esc2(nd.icon||"•")}</text><text x="${x+w/2}" y="${y+46}" text-anchor="middle" font-size="11.5" fill="#1b1b1b" font-weight="600">${esc2(nd.label)}</text><text x="${x+w/2}" y="${y+62}" text-anchor="middle" font-size="10" fill="#7A2233" font-style="italic">${esc2(nd.sub)}</text></g>`;
  const arrow=(x1,y1,x2,y2,label)=>`<g><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#7A2233" stroke-width="1.2" marker-end="url(#ar)"/>${label?`<text x="${(x1+x2)/2}" y="${y1-6}" text-anchor="middle" font-size="9.5" fill="#7A2233">${esc2(label)}</text>`:""}</g>`;
  if(kind==="cycle"){
    H=300; const cx=W/2, cy=150, R=104;
    n.forEach((nd,i)=>{const a=-Math.PI/2+i*2*Math.PI/n.length; const x=cx+R*Math.cos(a)-60, y=cy+R*Math.sin(a)-boxH/2; inner+=box(x,y,120,nd);});
    n.forEach((nd,i)=>{const a1=-Math.PI/2+(i+0.35)*2*Math.PI/n.length, a2=-Math.PI/2+(i+0.65)*2*Math.PI/n.length;
      inner+=arrow(cx+(R-14)*Math.cos(a1),cy+(R-14)*Math.sin(a1),cx+(R-14)*Math.cos(a2),cy+(R-14)*Math.sin(a2),"");});
  } else if(kind==="compare"){
    H=150; n.slice(0,2).forEach((nd,i)=>{inner+=box(30+i*(boxW+40),34,boxW,nd)});
    inner+=`<text x="${W/2}" y="78" text-anchor="middle" font-size="16" fill="#7A2233">↔</text>`;
    n.slice(2).forEach((nd,i)=>{inner+=`<text x="${W/2}" y="${130+i*16}" text-anchor="middle" font-size="10.5" fill="#444">${esc2(nd.label)} · ${esc2(nd.sub)}</text>`; H=Math.max(H,150+i*16)});
  } else if(kind==="scene"){
    H=110+Math.ceil(n.length/3)*0; const gap=(W-20-n.length*boxW)/Math.max(1,n.length-1);
    n.forEach((nd,i)=>{inner+=box(10+i*(boxW+gap),24,boxW,nd)}); H=130;
  } else {
    const gap=n.length>1?(W-20-n.length*boxW)/(n.length-1):0;
    n.forEach((nd,i)=>{const x=10+i*(boxW+gap); inner+=box(x,30,boxW,nd); if(i<n.length-1){const lab=(il.links||[]).find(l=>+l[0]===i&&+l[1]===i+1); inner+=arrow(x+boxW+4,30+boxH/2,x+boxW+gap-4,30+boxH/2,lab?lab[2]:"")}});
    H=130;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc2(il.caption)}"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7A2233"/></marker></defs>${inner}</svg>`;
}

let qrCache={};
async function qrSVG(text,mm){
  if(!text) return "";

  try{

    let q=null;
    for(let v=6;v<=30;v++){ try{ const t=qr(v,"L"); t.addData(text); t.make(); q=t; break; }catch(e){} }
    if(!q) return "";
    const n=q.getModuleCount(), s=100/n; let path="";
    for(let r=0;r<n;r++){ let c=0; while(c<n){ if(q.isDark(r,c)){ let len=1; while(c+len<n&&q.isDark(r,c+len)) len++;
      path+=`M${(c*s).toFixed(2)},${(r*s).toFixed(2)}h${(len*s).toFixed(2)}v${s.toFixed(2)}h-${(len*s).toFixed(2)}z`; c+=len; } else c++; } }
    const svg=`<svg viewBox="0 0 100 100" width="${mm}mm" height="${mm}mm" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="100" height="100" fill="#fff"/><path d="${path}" fill="#111"/></svg>`;
    qrCache[text]=svg; return svg;
  }catch(e){ return ""; }

/* ================= 긴 교과서 지문을 모의고사 길이로 나누기 ================= */
let SPLIT_TARGET=150, SPLIT_MIN=140, SPLIT_MAX=160;
function applyLevelConsts(){ if(isMid()){SPLIT_TARGET=110;SPLIT_MIN=90;SPLIT_MAX=130}else{SPLIT_TARGET=150;SPLIT_MIN=140;SPLIT_MAX=160} } /* 교과서·외부 지문: 한 문제에 쓰는 지문은 영어 단어 140~160개 */
state.splitLong = LS.get("bj-split-long",true);
/* 문장 중간에서 잘린 줄바꿈을 없애고, 인사말·서명·문단 구분만 남긴다 */
const SPK=/^[A-Z][A-Za-z.']{0,14}(?: [A-Z][A-Za-z.']{0,14})?\s?:\s/;
function isDialogue(t){return String(t||"").split("\n").filter(l=>SPK.test(l.trim())).length>=4}
function tidyBreaks(t){
  const src=String(t||"").replace(/\r/g,"").replace(/[ \t]+/g," ");
  const blocks=src.split(/\n{2,}/).map(b=>{
    const lines=b.split("\n").map(x=>x.trim()).filter(x=>x.length);
    const dlgBlock=lines.filter(x=>SPK.test(x)).length>=3;
    let out="";
    lines.forEach(ln=>{
      if(!out){out=ln;return}
      const prevLine=out.slice(out.lastIndexOf("\n")+1);
      const endsSentence=/[.!?"”'’)\]]$/.test(prevLine);
      const endsComma=/,$/.test(prevLine);
      const short=prevLine.length<45;
      const nextCap=/^[A-Z“"'(\[]/.test(ln);
      const nextShort=ln.length<45, nextEndsSentence=/[.!?]$/.test(ln);
      const keep = (dlgBlock&&SPK.test(ln))
        || (endsComma&&short)
        || (nextShort&&!nextEndsSentence&&(endsSentence||endsComma))
        || (short&&nextShort&&!/[.!?,;:]$/.test(prevLine)&&!nextEndsSentence&&nextCap);
      out += keep ? "\n"+ln : " "+ln;
    });
    return out;
  }).filter(Boolean);
  return blocks.join("\n\n").replace(/ +/g," ").trim();
}
function wordCount(t){return (String(t).match(/[A-Za-z][A-Za-z'’-]*/g)||[]).length}
function splitLongPassage(text){
  const MIN=SPLIT_MIN, MAX=SPLIT_MAX, AIM=SPLIT_TARGET;
  const clean=tidyBreaks(text);
  const total=wordCount(clean);
  if(total<=MAX) return [clean];
  const toks=[];
  clean.split(/\n{2,}/).map(x=>x.trim()).filter(Boolean).forEach(par=>{
    splitSentences(par).forEach((sn,i)=>toks.push({t:sn,w:wordCount(sn),np:i===0}));
  });
  const join=(arr)=>arr.map((k,i)=>(i?(k.np?"\n\n":" "):"")+k.t).join("").trim();
  const pickEnd=(from,dir)=>{ /* 140~160단어 안에서 150에 가장 가까운 끝을 고른다 */
    let c=0, best=-1, bd=1e9;
    for(let j=from;dir>0?j<toks.length:j>=0;j+=dir){
      c+=toks[j].w;
      if(c>=MIN-10){ const d=Math.abs(c-AIM)+(c>MAX||c<MIN?30:0); if(d<bd){bd=d;best=j} }
      if(c>MAX+12) break;
    }
    return best;
  };
  const out=[]; let i=0;
  while(i<toks.length){
    const rest=toks.slice(i).reduce((a,k)=>a+k.w,0);
    if(rest<=MAX && rest>=MIN){ out.push(join(toks.slice(i))); break; }
    if(rest<MIN){
      if(out.length && rest>=50){ /* 남은 부분이 어느 정도 되면 끝에서부터 140~160단어를 다시 잡는다 */
        const st=pickEnd(toks.length-1,-1); if(st>=0) out.push(join(toks.slice(st)));
      }
      break;
    }
    const e=pickEnd(i,1);
    if(e<0){ out.push(join(toks.slice(i))); break; }
    out.push(join(toks.slice(i,e+1))); i=e+1;
  }
  return out.length?out:[clean];
}
function splitRowsInto(key){
  const rows=rowsOf(key); const next=[]; let changed=0;
  rows.forEach(r=>{
    const parts=splitLongPassage(r.text||"");
    if(parts.length<2){next.push(r);return}
    changed++;
    const base=(r.title||"본문").replace(/\s*본문\d+$/,"");
    parts.forEach((p,i)=>next.push({title:`${base||"본문"}${base&&!/본문$/.test(base)?" ":""}본문${i+1}`.replace(/^본문본문/,"본문"),src:r.src,text:p,kind:r.kind||"book"}));
  });
  if(!changed){toast(`나눌 만큼 긴 지문이 없습니다. ${SPLIT_MAX}단어가 넘는 지문만 나눕니다.`);return}
  if(next.length>30){toast("나누면 30개를 넘습니다. 지문을 줄여서 다시 시도해 주세요.");return}
  state[key].rows=next; saveDraft(key); renderView();
  toast(`긴 지문 ${changed}개를 ${next.length}개로 나눴습니다.`);
}
function splitInfo(key){
  const long=rowsOf(key).filter(r=>wordCount(r.text||"")>SPLIT_MAX&&(r.kind||"")!=="exam").length;
  return long?`<span class="warnchip">${long}개 지문이 ${SPLIT_MAX}단어를 넘습니다 — 나누기를 권합니다</span>`:"";
}

async function makeExternal(){
  if(!sample){toast("이 페이지를 Claude 안에서 열어야 지문을 만들 수 있습니다.");return}
  const e=state.ext;
  const words=e.words.split(/[,\n·]/).map(x=>x.trim()).filter(Boolean);
  if(words.length<3){toast("단어를 세 개 이상 넣어 주세요.");return}
  e.busy=true; e.msg="지문을 쓰고 있습니다."; renderView();
  try{
    let ps=[], pool=[];
    for(let attempt=0; attempt<2+Math.ceil(e.n/3) && ps.length<e.n; attempt++){
      if(attempt) { e.msg=`지문을 쓰고 있습니다 (${ps.length}/${e.n}편 완료)`; renderView(); }
      const r=await sample.json(extPrompt({...e,n:Math.min(3,e.n-ps.length)}),{modelTier:state.tier,cache:false});
      const got=(r&&Array.isArray(r.passages)?r.passages:[]).filter(p=>p&&p.text&&wordCount(p.text)>=60);
      got.forEach(p=>{ const c=wordCount(p.text); if(c>=SPLIT_MIN&&c<=SPLIT_MAX) ps.push(p); else pool.push(p); });
    }
    if(ps.length<e.n) ps=ps.concat(pool.sort((a,b)=>Math.abs(wordCount(a.text)-SPLIT_TARGET)-Math.abs(wordCount(b.text)-SPLIT_TARGET)).slice(0,e.n-ps.length));
    ps=ps.slice(0,e.n);
    if(!ps.length) throw new Error("none");
    const extBase=Math.max(0,...(state.gen.rows||[]).map(r=>{const m=/^외부 지문 (\d+)$/.exec(String(r.title||"").trim());return m?+m[1]:0}));
    const items=ps.map((p,i)=>{
      const miss=words.filter(w=>!normText(p.text).includes(normText(w).replace(/[^a-z ]/g,"").split(" ")[0].slice(0,Math.max(4,Math.min(7,w.length)))));
      return {title:`외부 지문 ${extBase+i+1}`,aiTopic:String(p.title||p.topic_ko||""),text:String(p.text).trim(),src:"외부 지문",note:(miss.length?`빠진 단어: ${miss.join(", ")}`:"")+(p.note?` ${p.note}`:""),words:wordCount(p.text)};
    });
    state.modal={type:"ext",items,sel:new Set(items.map((_,i)=>i))};
    e.msg=`지문 ${items.length}편을 만들었습니다.`;
  }catch(err){ e.msg = err&&err.code?errCopy(err):"지문을 만들지 못했습니다. 단어를 줄이거나 다시 시도해 주세요."; }
  e.busy=false; LS.set(extKey(),{...e,busy:false}); renderView();
}

const USAGE_KEY="bj-usage";
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function usageLoad(){
  const now=new Date(), day=ymd(now), mon=day.slice(0,7);
  const u=LS.get(USAGE_KEY,null)||{};
  if(u.day!==day){u.day=day;u.d=0}
  if(u.mon!==mon){u.mon=mon;u.m=0}
  u.d=u.d||0; u.m=u.m||0; u.total=u.total||0; u.err=u.err||0;
  return u;
}
function usageBump(kind){
  const u=usageLoad();
  if(kind==="call"){u.d++;u.m++;u.total++}
  if(kind==="limit"){u.rl=Date.now()}
  if(kind==="err"){u.err++}
  LS.set(USAGE_KEY,u); renderUsage();
}
function wrapSample(s){
  if(!s||s.__wrapped) return s;
  const w=Object.create(s);
  w.json=async(prompt,opts)=>{
    usageBump("call");
    try{ return await s.json(prompt,opts); }
    catch(e){ if(e&&e.code==="rate_limited") usageBump("limit"); else if(e&&e.code&&e.code!=="cancelled") usageBump("err"); throw e; }
  };
  w.__wrapped=true; return w;
}
/* ---------- Claude 밖(공개 사이트)에서 열었을 때: 본인의 Claude API 키로 연결 ---------- */
const API_KEY="bj-apikey";
function apiSample(key){
  const MODEL={quick:"claude-haiku-5-5",default:"claude-sonnet-5-5",complex:"claude-opus-5-5"};
  const call=async(prompt,opts)=>{
    opts=opts||{}; const ctl=new AbortController();
    if(opts.signal){ if(opts.signal.aborted) throw {code:"cancelled"}; opts.signal.addEventListener("abort",()=>ctl.abort()); }
    let res; try{
      res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:ctl.signal,headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:MODEL[opts.modelTier]||MODEL.default,max_tokens:32000,messages:[{role:"user",content:String(prompt)}]})});
    }catch(e){ if(ctl.signal.aborted) throw {code:"cancelled"}; throw {code:"network"}; }
    if(!res.ok){ let j=null; try{ j=await res.json(); }catch(e){} const m=(j&&j.error&&j.error.message)||"";
      if(res.status===401||res.status===403) throw {code:"bad_key"};
      if(/credit balance|billing/i.test(m)) throw {code:"no_credit"};
      if(res.status===429||res.status===529) throw {code:"rate_limited"};
      if(res.status===413||/prompt is too long|too large/i.test(m)) throw {code:"prompt_too_large"};
      throw {code:"api_error",message:m}; }
    const j=await res.json(); return {text:(j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join(""),truncated:j.stop_reason==="max_tokens"};
  };
  const f=(i,o)=>call(i,o);
  f.json=async(i,o)=>{ const r=await call(i,o); const t=r.text.replace(/^\s*```(?:json)?\s*/i,"").replace(/\s*```\s*$/,"").trim();
    try{ return JSON.parse(t); }catch(e){ for(const [a,b] of [["{","}"],["[","]"]]){ const x=t.indexOf(a), y=t.lastIndexOf(b); if(x>=0&&y>x){ try{ return JSON.parse(t.slice(x,y+1)); }catch(e2){} } } throw {code:"invalid_json"}; } };
  return f;
}
function blobDownloads(){
  return {save:async({filename,data})=>{ const b=data instanceof Blob?data:new Blob([data],{type:/\.html?$/i.test(filename)?"text/html;charset=utf-8":"application/octet-stream"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); return {saved:true}; }};
}

    found.forEach(f=>{ g++; num[f.i]=g; enH+=esc(en.slice(p,f.at))+`<u class="tfu">${esc(en.slice(f.at,f.at+f.len))}</u><sub class="tfs">${g}</sub>`; p=f.at+f.len; });

    if(!cur||cur.chars>1000){ cur={en:[],ko:[],bank:[],chars:0}; groups.push(cur); }

function fullVerbPrompt(p,sents,start){
  return `당신은 한국 고등학교 영어 교재를 만드는 전문 편집자입니다. 지문 전체를 '동사형 연습' 워크북으로 만듭니다. 학생이 괄호 안의 동사 원형(사전형)을 보고 문맥에 맞는 올바른 형태로 고쳐 쓰는 형식입니다.
${passageHeader(p)}
[이번에 다룰 문장]
${sents.map((s,k)=>`${start+k}: ${s}`).join("\n")}

각 문장에서, 사전형(원형)이 아닌 형태로 쓰인 동사·동사구를 문장에 나오는 순서대로 빠짐없이 모두 찾습니다(본동사, 조동사+동사, to부정사, 동명사, 분사, 완료/진행/수동태, 부정문의 don't/doesn't/didn't 포함). 그 자리를 [[v1]], [[v2]] ...로(그 문장 안에서 1부터 순서대로) 표시합니다.
한 문장 안에 바꿔 쓸 동사가 여러 개 있는 경우가 많습니다(접속사로 이어진 여러 절, and/or/콤마로 나열된 여러 동사, 주절+분사구문 등). 보이는 동사를 전부, 하나도 빠뜨리지 말고 각각 따로 표시하세요. 문장 하나에 2~4개, 때로는 그 이상도 나올 수 있습니다. 눈에 띄는 동사 하나만 표시하고 멈추지 마세요.
예시: "She enjoys listening to music, discovers new songs, and explores new artists every day."라는 문장이면 → "She [[v1]] [[v2]] to music, [[v3]] new songs, and [[v4]] new artists every day." 처럼 네 동사를 모두 표시합니다(hints: ["enjoy","listen","discover","explore"]).
- hints 배열의 같은 순서 자리에는 그 동사의 사전형(원형)을 적습니다. 조동사나 부정어가 같은 의미 단위로 묶여 있으면 쉼표로 나열합니다(예: 조동사+동사는 "can, do", 부정 명령문은 "not, jump").
- answers 배열의 같은 순서 자리에는 지문 원문 그대로의 정확한 형태를 적습니다.
- marked에서 [[vN]] 표시를 answers의 해당 글자로 되돌리면 원문 문장과 정확히 같아야 합니다. 마커로 표시하지 않은 나머지 글자는 한 글자도 바꾸지 않습니다.
- ko에는 그 문장의 자연스러운 한국어 해석을 씁니다.
- 바꿀 동사가 전혀 없는 문장이면 hints와 answers를 빈 배열로 둡니다.

[출력] 설명 없이 JSON 하나만: {"sentences":[{"i":문장 번호,"marked":"...[[v1]]...[[v2]]...","hints":["원형1","원형2"],"answers":["정답1","정답2"],"ko":"해석"}]}`;
}
function fullverbRebuild(item){
  const re=/\[\[v(\d+)\]\]/g;
  return String(item.marked||"").replace(re,(_,n)=>{const idx=+n-1; const a=item.answers&&item.answers[idx]; return a!==undefined?a:"";});
}
function fullverbOK(item,orig){
  if(!item||typeof item.marked!=="string") return false;
  const h=Array.isArray(item.hints)?item.hints:[], a=Array.isArray(item.answers)?item.answers:[];
  if(h.length!==a.length) return false;
  const cleanA=s=>normText(s).replace(/[^a-z0-9가-힣]/g,"");
  return cleanA(fullverbRebuild(item))===cleanA(orig);
}
async function runFullVerb(d,p,opts){
  const sents=splitSentences(d.text);
  const items=sents.map(s=>({s,status:"wait"}));
  const chunks=[]; for(let k=0;k<sents.length;k+=3) chunks.push([k,Math.min(k+3,sents.length)]);
  const q=[...chunks];
  const worker=async()=>{
    while(q.length){
      const [a,b]=q.shift();
      const part=sents.slice(a,b);
      let got=[];
      for(let attempt=0;attempt<2;attempt++){
        try{ const r=await sample.json(fullVerbPrompt(p,part,a),opts); got=(r&&r.sentences)||[]; }catch(e){ if(e&&e.code==="cancelled") throw e; got=[]; }
        let bad=0;
        part.forEach((s,k)=>{ const idx=a+k; const hit=got.find(x=>Number(x.i)===idx)||got[k]; if(!hit){bad++;return}
          const ok=fullverbOK(hit,s);
          if(ok||attempt===1) items[idx]={s,status:"done",ok,marked:ok?hit.marked:"",hints:ok?hit.hints:[],answers:ok?hit.answers:[],ko:String(hit.ko||"")};
          if(!ok) bad++;
        });
        if(!bad) break;
      }
    }
  };
  await Promise.all(Array.from({length:3},worker));
  return items;
}
function stripABLabels(s){
  s=String(s||"");
  // "(A. visited / B. visiting)" "(A: x / B: y)" 처럼 괄호·슬래시 뒤에 붙은 글자·번호 라벨만 제거
  s=s.replace(/\(\s*[AaBb12①②]\s*[.):]\s*/g,"(");
  s=s.replace(/\/\s*[AaBb12①②]\s*[.):]\s*/g,"/ ");
  s=s.replace(/\(\s*[AaBb]\s+(?=[a-zA-Z])/g,"(");
  s=s.replace(/\/\s*[AaBb]\s+(?=[a-zA-Z])/g,"/ ");
  return s.replace(/\(\s+/,"(").replace(/\s+\)/,")").replace(/\s{2,}/g," ");
}
const oxAns=a=>/^\s*(t|true|o|○|⭕|참|맞)/i.test(String(a==null?"":a))?"O":"X";
function sanitizeWorkbook(wb){
  if(!wb) return wb;
  if(Array.isArray(wb.tf)) wb.tf=wb.tf.filter(x=>x&&String(x.q||"").trim()).map(x=>({q:String(x.q).trim(),answer:oxAns(x.answer),why:String(x.why||"").trim()}));

  });
  return wb;
}

  const items=wkbkWordItems(md); if(!items.length) return [];

/* ---- word search (client-side, no AI) ---- */
function buildWordSearchJS(words,size){
  const N=size; const grid=Array.from({length:N},()=>Array(N).fill(null));
  const dirs=[[0,1],[1,0],[1,1],[-1,1]];
  const up=[...new Set(words.map(w=>String(w).replace(/[^a-zA-Z]/g,"").toUpperCase()))].filter(w=>w.length>=3&&w.length<=N);
  function tryPlace(word){
    for(let a=0;a<200;a++){
      const [dr,dc]=dirs[Math.floor(Math.random()*dirs.length)];
      const r0=Math.floor(Math.random()*N), c0=Math.floor(Math.random()*N);
      const r1=r0+dr*(word.length-1), c1=c0+dc*(word.length-1);
      if(r1<0||r1>=N||c1<0||c1>=N) continue;
      let ok=true;
      for(let i=0;i<word.length;i++){ const r=r0+dr*i,c=c0+dc*i,ch=grid[r][c]; if(ch!==null&&ch!==word[i]){ok=false;break} }
      if(!ok) continue;
      for(let i=0;i<word.length;i++) grid[r0+dr*i][c0+dc*i]=word[i];
      return true;
    }
    return false;
  }
  const placed=[];
  up.sort((a,b)=>b.length-a.length).forEach(w=>{ if(tryPlace(w)) placed.push(w); });
  const ABC="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(grid[r][c]===null) grid[r][c]=ABC[Math.floor(Math.random()*26)];
  return {grid,placed};
}
function wordSearchHTML(grid){
  const N=grid.length;
  return `<table class="ws-grid"><tbody>${grid.map(row=>`<tr>${row.map(ch=>`<td>${ch}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

  const docs=rows.map((r,i)=>({n:i+1,no:(r.title||"").replace(/번$/,"").trim(),src:r.src,title_ko:(/^\d+(~\d+)?번?$/.test((r.title||"").trim())?"":(r.title||"")),text:r.text.trim(),words:[],grammar:null,sv:[],chunks:[],extras:null}));
  state.basicResult={kicker:state.basic.kicker,docs,created:Date.now()};
  state.sub.basic="result"; renderView();
  const opts={modelTier:state.tier,signal:run.ctl.signal,cache:false};
  const jobs=[];
  docs.forEach(d=>{
    const p={exam:d.src||"지문",no:d.no,grade:/고[123]/.exec(d.src||"")?.[0]||"",text:d.text};
    const sents=splitSentences(d.text);
    d.sv=sents.map(s=>({s,status:"wait"}));
    d.chunks=sents.map(()=>null);
    jobs.push(async()=>{ const r=await sample.json(basicWordPrompt(p),opts); d.words=(r&&Array.isArray(r.words)?r.words:[]).filter(w=>w&&w.w).map(w=>({w:String(w.w),mean:String(w.mean||""),pos:String(w.pos||""),ex:String(w.ex||"")})); });
    jobs.push(async()=>{ const r=await sample.json(basicGrammarPrompt(p),opts); if(r) d.grammar=r; });
    for(let k=0;k<sents.length;k+=4){ const a=k,b=Math.min(k+4,sents.length);
      jobs.push(async()=>{ const r=await sample.json(basicSVPrompt(p,sents.slice(a,b),a),opts); const got=(r&&r.sentences)||[];
        sents.slice(a,b).forEach((s,kk)=>{ const idx=a+kk; const hit=got.find(x=>Number(x.i)===idx)||got[kk]; if(hit) d.sv[idx]={s,status:"done",subject:String(hit.subject||""),verb:String(hit.verb||"")}; }); });
    }
    for(let k=0;k<sents.length;k+=3){ const a=k,b=Math.min(k+3,sents.length);
      jobs.push(async()=>{ const r=await sample.json(clsChunkPrompt(p,sents.slice(a,b),a),opts); ((r&&r.sentences)||[]).forEach(x=>{const idx=Number(x.i); if(idx>=0&&idx<sents.length) d.chunks[idx]={s:sents[idx],chunks:Array.isArray(x.chunks)?x.chunks:[],ko:String(x.ko||"")};}); });
    }
    jobs.push(async()=>{
      for(let i=0;i<40&&!d.words.length;i++) await new Promise(r=>setTimeout(r,500));

}

function buildBasicPages(key){
  const res=state.basicResult; if(!res) return [];
  const m=$("#measure"); m.innerHTML=`<div class="page cls" style="position:static"><div id="bcol" style="width:178mm"></div><div id="mref" style="height:100mm"></div></div>`;
  pxPerMm=$("#mref").getBoundingClientRect().height/100||3.7795;
  const col=$("#bcol"), H=(297-16-18)*pxPerMm; const pages=[]; const answers=[];
  const measure=b=>{col.innerHTML=b; return col.scrollHeight};
  const flow=blocks=>{ let cur=[],used=0;
    blocks.forEach((b,i)=>{ if(b==="§PAGEBREAK§"){ if(cur.length){pages.push(cur);cur=[];used=0} return; }
      const h=measure(b); let need=h;
      if(/^<div class="cls-sec"/.test(b)&&blocks[i+1]&&blocks[i+1]!=="§PAGEBREAK§") need+=Math.min(measure(blocks[i+1]),H*0.4);
      if(cur.length&&used+need>H){pages.push(cur);cur=[];used=0} cur.push(b); used+=h; });
    if(cur.length) pages.push(cur);
  };
  res.docs.forEach(d=>{ const r=basicBlocks(d,res,key); flow(r.B); answers.push(...r.A); });
  if(key&&answers.length){ pages.push([`<div class="cls-sec">추가 정답 모음 (교사용)</div>`]); const last=pages[pages.length-1];
    answers.forEach(b=>{ const h=measure(b); const used=last.reduce((a,x)=>a+measure(x),0); if(used+h>H) pages.push([b]); else last.push(b); }); }
  col.innerHTML="";
  return pages.map((p,i)=>`<div class="page cls"><div class="cls-body">${p.join("")}</div><div class="an-foot"><img src="${LOGO_FULL}" alt=""><span>${i+1}</span></div></div>`);
}

/* ================= 중등 시험지 (학교 시험지 형식) ================= */
const EX_CIR="ⓐⓑⓒⓓⓔⓕⓖ";
const exCl=l=>{const i="abcdefg".indexOf(String(l||"").toLowerCase()); return i>=0?EX_CIR[i]:String(l||"")};
const EX_MARK_RE=/\[\[([LGBKCP]):([\s\S]*?)\]\]/g;
const exFields=b=>String(b).split("|").map(s=>s.trim());
const exMarks=raw=>{const out=[]; String(raw||"").replace(EX_MARK_RE,(m,c,b)=>{out.push({c,f:exFields(b)});return m}); return out};
const exNorm=s=>String(s==null?"":s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"').replace(/[^a-z0-9가-힣']+/g," ").trim();
const exS=x=>String(x==null?"":x).trim();
const exArr=x=>Array.isArray(x)?x:[];
const EX_ABC=["A","B","C","D","E"];
/* 표시를 원문으로 되돌린다. keep(c,f)가 true인 표시는 그대로 둔다(부분 정리용). */
function exOriginalOf(c,f,opt){
  if(c==="L") return f[2]!==undefined&&f[2]!==""?f[2]:(f[1]||"");
  if(c==="G"||c==="B"||c==="C") return f[1]||"";
  if(c==="K") return f[2]||"";
  if(c==="P") return (opt&&opt.given&&opt.slot&&String(f[0]).toLowerCase()===String(opt.slot).toLowerCase())?" "+opt.given+" ":"";
  return "";
}
function exRebuild(raw,opt,keep){
  return String(raw||"").replace(EX_MARK_RE,(m,c,b)=>{const f=exFields(b); if(keep&&keep(c,f)) return m; return exOriginalOf(c,f,opt)});
}
/* 지문 종류: 대화문이면 true */
function exIsDialog(text){
  const lines=String(text||"").split(/\n/).map(s=>s.trim()).filter(Boolean);
  if(lines.length<3) return false;
  const n=lines.filter(l=>/^[A-Za-z][A-Za-z.\- ]{0,14}:\s*\S/.test(l)).length;
  return n>=3&&n/lines.length>=0.5;
}
/* 순서 섞기용 결정적 난수 */
function exShuf(arr,seed){
  return arr.map((x,i)=>[x,hash(seed+":"+i+":"+JSON.stringify(x).slice(0,60))]).sort((p,q)=>p[1]-q[1]).map(p=>p[0]);
}

/* ---------- 문항 만들기(검증 포함) ---------- */
function exFive(a,n){ if(!Array.isArray(a)||a.length!==5) throw `${n||"선택지"}가 5개가 아닙니다.`; return a; }
function exOpts(a){ a=exFive(a).map(exS); if(a.some(x=>!x)) throw "비어 있는 선택지가 있습니다."; if(new Set(a.map(exNorm)).size<5) throw "같은 선택지가 있습니다."; return a; }
function exAns(n){ n=Number(n); if(!Number.isInteger(n)||n<1||n>5) throw "정답 번호가 1~5가 아닙니다."; return n; }

    if(!r){ errs.push(`${EX_T[id].name}: 문항이 없습니다.`); return; }
    if(r.skip){ errs.push(`${EX_T[id].name}: 이 지문에서는 만들 수 없다고 건너뜀`); return; }
    try{ const it=exMakeItem(id,r,ctx); out.items.push(it); kept.add(id); }
    catch(e){ errs.push(`${EX_T[id].name}: ${typeof e==="string"?e:(e&&e.message)||"오류"}`); }
  });

/* 독립 문항 */
function exBuildStd(raw,types){
  const errs=[]; const items=[]; const rawItems=exArr(raw&&raw.items).filter(x=>x&&typeof x==="object");

  types.forEach((id,k)=>{
    let r=rawItems.find((x,j)=>x.type===id&&!used.has(j)); const j=rawItems.indexOf(r); if(r) used.add(j);
    if(!r){ errs.push({id,msg:`${EX_T[id].name}: 문항이 없습니다.`}); return; }

  });

}

/* ---------- 실행 계획 ---------- */
function exPick(i,isDlg,sel,maxPer){
  const cand=sel.filter(id=>{ const t=EX_T[id]; return t.grp==="pas"||(isDlg&&t.grp==="dlg"); });
  const bySlot={}; cand.forEach(id=>{ (bySlot[EX_T[id].slot]=bySlot[EX_T[id].slot]||[]).push(id); });
  let chosen=[];
  EX_SLOT_ORDER.forEach(s=>{ const l=bySlot[s]||[]; if(!l.length) return; if(s==="NONE") l.forEach(id=>chosen.push(id)); else chosen.push(l[i%l.length]); });
  if(chosen.length>maxPer){ const st=i%chosen.length; chosen=[...chosen.slice(st),...chosen.slice(0,st)].slice(0,maxPer); }
  return chosen.sort((a,b)=>EX_SLOT_ORDER.indexOf(EX_T[a].slot)-EX_SLOT_ORDER.indexOf(EX_T[b].slot));
}
function exPlan(rows,sel,nStd,maxPer){
  const units=[]; let k=0;
  rows.forEach((r,i)=>{
    const text=tidyBreaks(r.text).trim(); const isDlg=exIsDialog(text);
    const types=exPick(i,isDlg,sel,maxPer); if(!types.length) return;
    units.push({id:"u"+(k++),kind:"set",pos:isDlg?"dlg":"txt",src:r.src||"",title:/[A-Za-z]{3}/.test(r.title||"")&&!/^\d/.test(r.title||"")?(r.title||"").trim():"",isDlg,text,types,items:[],passage:"",status:"wait",errs:[]});
  });
  const std=sel.filter(id=>EX_T[id].grp==="std");
  if(std.length&&nStd>0){
    const seq=[]; for(let j=0;j<nStd;j++) seq.push(std[j%std.length]);
    const ref=rows.map(r=>r.text).join("\n\n");
    [["pre",seq.filter(id=>EX_T[id].pre)],["post",seq.filter(id=>!EX_T[id].pre)]].forEach(([pos,list])=>{
      for(let s=0;s<list.length;s+=4) units.push({id:"u"+(k++),kind:"std",pos,types:list.slice(s,s+4),ref,items:[],status:"wait",errs:[]});
    });
  }
  return units;
}
const EX_POS_ORDER={pre:0,dlg:1,post:2,txt:3};
function exOrdered(res){ return (res.docs||[]).map((d,i)=>[d,i]).sort((a,b)=>(EX_POS_ORDER[a[0].pos]-EX_POS_ORDER[b[0].pos])||(a[1]-b[1])).map(x=>x[0]); }
function exAllItems(res){ const out=[]; exOrdered(res).forEach(d=>(d.items||[]).forEach(it=>out.push(it))); return out; }
/* 정답 번호가 한쪽으로 몰리지 않게 고정되지 않은 문항의 보기 순서를 돌린다 */
function exBalance(res,seed){
  const mov=exAllItems(res).filter(it=>!it.fixed); const tg=[];
  for(let b=0;b*5<mov.length;b++) exShuf([0,1,2,3,4],(seed||"x")+b).forEach(x=>tg.push(x));
  mov.forEach((it,k)=>{ const arr=it.kind==="table"?it.rows:it.opts; const cur=it.answer-1, t=tg[k]; if(cur===t||cur<0||cur>=arr.length) return; const [x]=arr.splice(cur,1); arr.splice(t,0,x); it.answer=t+1; });
}
function exTotal(res){ return exAllItems(res).reduce((a,it)=>a+(+it.score||0),0); }
function exFit100(res){
  const its=exAllItems(res); if(!its.length) return; let tot=exTotal(res), guard=0;
  while(tot!==100&&guard++<500){
    if(tot<100){ const m=Math.min(...its.map(i=>i.score)); const c=its.filter(i=>i.score===m); c[guard%c.length].score++; tot++; }
    else { const M=Math.max(...its.map(i=>i.score)); const c=its.filter(i=>i.score===M); if(M<=2) break; c[guard%c.length].score--; tot--; }
  }
}
/* ---------- 만들기 ---------- */
async function exCall(prompt,run){
  let last=null;
  for(let a=0;a<2;a++){
    try{ const r=await sample.json(prompt,{modelTier:state.tier,signal:run.ctl.signal,cache:false}); if(r&&typeof r==="object") return r; }
    catch(e){ if(e&&e.code==="cancelled") throw e; last=e; }
  }
  if(last) throw last; return null;
}
async function exGenSet(u,run){
  let best=null, errs=[];
  for(let a=0;a<2;a++){
    let r=null; try{ r=await exCall(exSetPrompt(u,errs),run); }catch(e){ if(e&&e.code==="cancelled") throw e; errs=[errCopy(e)]; continue; }
    const b=exBuildSet(u,r,u.types);
    if(!best||b.items.length>best.items.length) best=b;
    errs=b.errs;
    if(b.items.length===u.types.length) break;
  }
  if(!best){ u.status="err"; u.errs=errs; return; }
  u.items=best.items; u.passage=best.passage; u.errs=best.errs;
  await exVerify(u,run);
  u.status=u.items.length?"done":"err";
}
async function exGenStd(u,run){
  let items=[], pending=u.types.slice(), errs=[];
  for(let a=0;a<2&&pending.length;a++){
    let r=null; try{ r=await exCall(exStdPrompt(pending,u,errs.map(e=>e.msg)),run); }catch(e){ if(e&&e.code==="cancelled") throw e; errs=[{msg:errCopy(e)}]; continue; }
    const b=exBuildStd(r,pending); items.push(...b.items); errs=b.errs; pending=b.errs.map(e=>e.id);
  }
  u.items=items; u.errs=errs.map(e=>e.msg); await exVerify(u,run);
  u.status=u.items.length?"done":"err";
}
async function exVerify(u,run){
  const chk=u.items.filter(it=>it.verify); if(!chk.length||!sample) return;
  try{
    const r=await exCall(exSolvePrompt(u,chk),run); const ans=exArr(r&&r.answers);
    chk.forEach((it,i)=>{ const a=ans.find(x=>Number(x&&x.i)===i); if(!a) return; const n=Number(a.answer);
      if(n!==it.answer){ it.warn=n===0?"검수 풀이에서 정답이 없거나 둘 이상으로 보입니다":`검수 풀이는 ${CN[n-1]||"?"}번이 정답으로 나왔습니다(출제 정답과 다름)`; } });
  }catch(e){ if(e&&e.code==="cancelled") throw e; }
}

async function exRedo(){
  const res=state.examResult; if(!res||!sample) return; const E=state.exam;

/* ---------- 시험지 그리기 ---------- */
function exInline(line){
  let out="",last=0; const re=new RegExp(EX_MARK_RE.source,"g"); let m;
  while((m=re.exec(line))){
    out+=esc(line.slice(last,m.index)); last=m.index+m[0].length;
    const c=m[1], f=exFields(m[2]);
    if(c==="L") out+=`<u>${exCl(f[0])}${esc(f[1]||"")}</u>`;
    else if(c==="G") out+=`<span class="xlb">(${esc(f[0])})</span><u>${esc(f[1]||"")}</u>`;
    else if(c==="B") out+=`<u class="xbk">(${esc(f[0])})</u>`;
    else if(c==="K") out+=`<u>&lt;${esc(f[0])}&gt;${esc(f[1]||"")}</u>`;
    else if(c==="C"){ const sw=hash("c"+f[0]+(f[1]||""))%2; const p=sw?[f[1],f[2]]:[f[2],f[1]]; out+=`<span class="xlb">(${esc(f[0])})</span>[${esc(p[0]||"")} / ${esc(p[1]||"")}]`; }
    else if(c==="P") out+=`( ${exCl(f[0])} )`;
  }
  return out+esc(line.slice(last));
}

function exItemHTML(it,n,pbox){

function exBlocks(res,mode){
  const blocks=[]; let n=0; const docs=exOrdered(res);
  if(mode==="a"){
    const all=[]; let k=0; docs.forEach(d=>(d.items||[]).forEach(it=>{ k++; all.push(`<span><b>${k}</b> ${CN[it.answer-1]||"?"}${it.warn?"<i>⚠</i>":""}</span>`); }));
    blocks.push({html:`<div class="xs"><h4>정답 한눈에 <small>총 ${k}문항 · ${exTotal(res)}점</small></h4><div class="xsg">${all.join("")}</div></div>`});
  }
  docs.forEach(d=>{
    const its=d.items||[]; if(!its.length) return;
    const start=n+1;
    if(d.kind==="set"&&mode==="q"&&its.length>1){
      blocks.push({html:`<div class="xg">[${start}-${n+its.length}] ${d.isDlg?"다음 대화문을 읽고, 물음에 답하시오.":"다음 글을 읽고, 물음에 답하시오."}</div>${exPassageBox(d)}`,keep:true});
      its.forEach(it=>blocks.push({html:exItemHTML(it,++n)}));
    } else if(d.kind==="set"&&mode==="q"){
      blocks.push({html:exItemHTML(its[0],++n,exPassageBox(d))});
    } else {
      its.forEach(it=>{ n++; blocks.push({html:mode==="a"?exAnsHTML(it,n):exItemHTML(it,n)}); });
    }
  });
  return blocks;
}
function exPages(res,mode){
  const m=$("#measure"); m.innerHTML=`<div class="page ex" style="position:static"><div class="ex-col" id="excol" style="width:87.5mm"></div><div id="mref" style="height:100mm"></div></div>`;
  pxPerMm=$("#mref").getBoundingClientRect().height/100||3.7795;
  const col=$("#excol"), colH=259*pxPerMm; const blocks=exBlocks(res,mode);
  const hs=blocks.map(b=>{ col.innerHTML=b.html; let h=col.scrollHeight; if(h>colH){ b.html=`<div class="xsq">${b.html}</div>`; col.innerHTML=b.html; h=col.scrollHeight; } return h; });
  col.innerHTML="";
  const pages=[]; let page=null, side=0, used=0;
  const newCol=()=>{ if(!page||side===1){page={cols:[[],[]]};pages.push(page);side=0}else side=1; used=0; };
  newCol();
  blocks.forEach((b,i)=>{ const h=hs[i]; let need=h; if(b.keep&&hs[i+1]) need+=Math.min(hs[i+1],colH*0.45);
    if(used>0&&used+need>colH+1) newCol(); page.cols[side].push(b.html); used+=h; });
  const title=exHeadTitle(res.meta||state.exam);
  return pages.map((p,i)=>`<div class="page ex"><div class="ex-head"><span class="t">${esc(title)}${mode==="a"?" · 정답 및 해설":""}</span>${mode==="a"?"":`<span class="nm">name :</span>`}</div><div class="ex-body"><div class="ex-col">${p.cols[0].join("")}</div><div class="ex-col">${p.cols[1].join("")}</div></div><div class="ex-foot"><span class="pn">- ${i+1} -</span><img src="${LOGO_FULL}" alt=""></div></div>`);
}

규칙
- rflow(리딩 플로우): 이 글을 앞에서부터 읽으면서 흐름을 따라가도록 돕는 설명입니다. 5개 이상(문장이 8개 이하면 5개, 9~14개면 6~7개, 그보다 길면 8개까지)을 순서대로 쓰고, r은 담당하는 문장 번호("3" 또는 "4~6" 형식)로 모든 문장을 빠짐없이 한 번씩 덮습니다. t는 한국어 1~2문장으로, 그 구간에서 글쓴이가 무엇을 하는지(문제 제기·주장·근거·예시·반전·결론 등)와 다음 내용을 어떻게 예상할 수 있는지를 쉽게 씁니다. 연결어(however, for example 등)가 있으면 짚어 줍니다.
- refs(지시어·대명사): this, that, these, those, such, it, they, them, one, the former/the latter, 앞 내용 전체를 받는 which 등 중에서 무엇을 가리키는지 헷갈리기 쉬운 것을 문장 순서대로 6~10개 고릅니다. i는 그 단어가 있는 문장 번호(1부터), w는 그 문장에 실제로 있는 단어 그대로, ref는 가리키는 대상을 지문에 나온 영어 표현 그대로 씁니다. note는 한국어 한 줄로 무엇을 가리키는지와 해석 요령을 씁니다. 의미 없는 가주어 it·비인칭 it은 넣지 않습니다. 지문 첫 문장처럼 가리킬 앞 내용이 없으면 넣지 않습니다.
- 주제(topic)는 글이 다루는 핵심 대상과 내용을 담은 명사구이고, 제목(title)은 글 내용에 어울리는 짧은 제목입니다. 둘은 표현이 달라야 합니다.
- 영어 칸에는 영어만, 한국어 칸에는 한국어만 씁니다.
- 지문에 없는 사실·통계·인명·연도를 넣지 않습니다.`;
}
function hsSentPrompt(d,chunk,o){
  return `${HS_INTRO}

[지문 전체 — 맥락 파악용]
<<<
${d.text}
>>>

아래 문장을 분석하세요. 대괄호 안 숫자는 문장 번호 i(0부터)입니다. 문장 원문은 바꾸지 않습니다.
${chunk.map(x=>`[${x.i}] ${x.s}`).join("\n")}

다음 JSON만 답하세요.
{"sentences":[{"i":0,
 "jik":"사회학자들은 주장한다 / 우리의 시간 인지와 사용은 / 그저 자연의 기본적 특성이 아닐 뿐만 아니라, / ...",
 "words":[{"w":"perception","pos":"명","mean":"인지, 지각","note":"","syn":"awareness"}],
 "trans":"자연스러운 완역",
 "ex":"구체적 예시",
 "grammar":[{"name":"not just A, nor B 구문","text":"설명 …","star":true}]
${o.struct?` ,"struct":"S(주어): … / V(동사): … / O(목적어): …"`:""}
${o.flow?` ,"role":"주제문"`:""}
}]}
규칙
- jik(직독직해): 영어 어순 그대로 앞에서부터 읽으며 우리말로 옮깁니다. 의미 덩어리마다 " / "로 끊고(문장당 3~9덩어리), 덩어리를 차례로 이으면 뜻이 통하게 씁니다.
- words(고등 필수 단어): 수능·모의고사에 자주 나오는 단어와 숙어 1~4개. 중학교 수준의 쉬운 단어는 넣지 않습니다. 이 문장에 실제로 나온 단어만 쓰고(w는 문장에 나온 철자 또는 원형), pos는 명·동·형·부·전·접·숙어 중 하나, mean은 이 문맥의 뜻입니다. note는 다른 뜻이 있거나 복수형·혼동 주의가 있을 때만 쓰고 없으면 빈 문자열("※ 재산이라는 뜻도 있음"처럼).${o.syn?" syn은 바꿔 쓸 수 있는 영어 유의어 1~2개(쉼표로 구분, 없으면 빈 문자열)입니다.":" syn은 빈 문자열로 둡니다."} 쉬운 문장이라 고를 단어가 없으면 빈 배열입니다.
- trans(상세 문장 해석): 자연스러운 완역, "~합니다/~입니다"체로 씁니다.
- ex(구체적 예시): 이 문장이 말하는 바를 일상·학교생활의 사례로 쉽게 풀어 1~2문장으로 씁니다. 널리 알려진 사실이나 누구나 겪는 상황만 쓰고, 지문에 없는 숫자·인명·연도는 지어내지 않습니다.
- grammar(주요 문법 설명): 이 문장에 실제로 쓰인 구문·어법 0~3개. name은 구문 이름, text는 쉬운 설명 1~2문장(문장 속 해당 부분을 영어로 인용). 시험에 자주 나오는 포인트는 star를 true로 하고 text 끝에 "(시험 출제 포인트!)"를 붙입니다.
${o.struct?`- struct: 주절의 주어·동사·목적어(또는 보어)를 한 줄로. 종속절은 절 이름으로 짧게 씁니다.
`:""}${o.flow?`- role: 이 문장이 글에서 하는 역할을 6자 이내로(주제문, 배경, 근거, 예시, 부연, 전환, 반론, 결론 등).
`:""}`;
}

/* ---- 검증 ---- */
function hsCleanSent(x,s,o){
  if(!x||typeof x!=="object") return null;
  const jik=hsStr(x.jik), trans=hsStr(x.trans), ex=hsStr(x.ex);
  const nw=s.split(/\s+/).length;
  if(!hsKo(jik)||!hsKo(trans)) return null;
  if(nw>=5&&!jik.includes("/")) return null;
  const sl=" "+hsNorm(s)+" ";
  const words=(Array.isArray(x.words)?x.words:[]).map(w=>({w:hsStr(w&&w.w),pos:hsStr(w&&w.pos).replace(/[()]/g,""),mean:hsStr(w&&w.mean),note:hsStr(w&&w.note),syn:o.syn?hsStr(w&&w.syn):""}))
    .filter(w=>{ if(!w.w||!w.mean) return false; const n=hsNorm(w.w); if(!n) return false; if(sl.includes(" "+n+" ")) return true;
      const st=n.split(" ")[0]; const stem=st.length>5?st.slice(0,st.length-2):st.slice(0,Math.max(3,st.length-1)); return sl.includes(" "+stem); }).slice(0,4);
  const grammar=(Array.isArray(x.grammar)?x.grammar:[]).map(g=>({name:hsStr(g&&g.name),text:hsStr(g&&g.text),star:!!(g&&g.star)})).filter(g=>g.name&&g.text&&hsKo(g.text)).slice(0,3);
  return {jik,words,trans,ex:hsKo(ex)?ex:"",grammar,struct:o.struct?hsStr(x.struct):"",role:o.flow?hsStr(x.role).slice(0,10):""};
}
function hsCleanHead(r,d,o){
  if(!r||typeof r!=="object"||!hsKo(r.summary)) return null;
  const en=v=>{ v=hsStr(v); return v&&!hsKo(v)&&/[a-z]/i.test(v)&&v.length<=120?v:""; };
  const ko=v=>{ v=hsStr(v); return v&&hsKo(v)&&v.length<=80?v:""; };
  const toks=t=>hsNorm(t).split(" ").filter(x=>x.length>2); const pt=new Set(toks(d.text));
  const seenR=new Set();
  const refs=(Array.isArray(r.refs)?r.refs:[]).map(x=>({i:+(x&&x.i),w:hsStr(x&&x.w),ref:hsStr(x&&x.ref),note:hsStr(x&&x.note)})).filter(x=>{
    if(!(x.i>=1&&x.i<=d.sents.length)||!x.w||!x.ref||!x.note||!hsKo(x.note)||hsKo(x.ref)||x.ref.length>110) return false;
    const re=new RegExp("(?<![A-Za-z])"+x.w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![A-Za-z])","i"); if(!re.test(d.sents[x.i-1].s)) return false;
    const tk=toks(x.ref); if(!tk.length||tk.filter(t=>pt.has(t)).length/tk.length<0.6) return false;
    const key=x.i+"|"+hsNorm(x.w); if(seenR.has(key)) return false; seenR.add(key); return true; }).sort((a,b)=>a.i-b.i).slice(0,12);
  const rflow=(Array.isArray(r.rflow)?r.rflow:[]).map(x=>({r:hsStr(x&&x.r).replace(/\s/g,""),t:hsStr(x&&x.t)})).filter(x=>{
    const m=/^(\d+)(?:~(\d+))?$/.exec(x.r); if(!m||!hsKo(x.t)||x.t.length<8||x.t.length>220) return false; const a=+m[1],b=m[2]?+m[2]:a; return a>=1&&b>=a&&b<=d.sents.length; }).slice(0,9);
  return {title_ko:hsStr(r.title_ko),title_en:en(r.title_en),topic_en:en(r.topic_en),topic_ko:ko(r.topic_ko),summary:hsStr(r.summary),refs,rflow:rflow.length>=4?rflow:[]};
}

/* ---- 끝 단어 정리 (유의어 · 반의어) ---- */
function hsCollectWords(d){
  const seen=new Map();
  d.sents.forEach(x=>{ if(x.status!=="done") return; (x.words||[]).forEach(w=>{ const k=hsNorm(w.w); if(!k) return;
    if(!seen.has(k)) seen.set(k,{w:w.w,pos:w.pos,mean:w.mean,note:w.note||"",syn:w.syn||"",ant:"",no:[x.i+1]});
    else { const e=seen.get(k); if(!e.no.includes(x.i+1)) e.no.push(x.i+1); if(!e.syn&&w.syn) e.syn=w.syn; } }); });
  return [...seen.values()];
}
function hsVocabPrompt(list){
  return `${HS_INTRO}

아래는 고등 모의고사 지문에서 뽑은 필수 단어·숙어입니다. [뜻]은 지문 속 의미입니다. 그 의미를 기준으로 영어 유의어와 반의어를 쓰세요.
${list.map((w,i)=>`[${i}] ${w.w}${w.pos?` (${w.pos})`:""} — ${w.mean}`).join("\n")}

다음 JSON만 답하세요.
{"words":[{"i":0,"syn":"awareness, recognition","ant":"misperception"}]}
규칙
- syn은 1~3개, ant는 1~2개를 쉼표로 구분합니다. 영어만 쓰고, 이 뜻에 맞는 것만 고릅니다.
- 알맞은 반의어가 없으면 ant는 빈 문자열입니다. 억지로 만들지 않습니다. 숙어는 뜻이 비슷한 표현을 syn에 씁니다.
- 모든 번호를 빠짐없이 답합니다.`;
}
function hsCleanWordList(v,self){
  const me=hsNorm(self); const arr=String(v||"").split(/[,;]/).map(t=>t.trim()).filter(t=>t&&!hsKo(t)&&t.length<=40&&/[a-z]/i.test(t)&&hsNorm(t)!==me);
  return [...new Set(arr)].slice(0,3).join(", ");
}
function hsVocabJobs(docs,opts){
  const jobs=[];
  docs.forEach(d=>{
    if(d.vocabOk||!d.sents.some(x=>x.status==="done")) return;
    jobs.push(async()=>{
      const all=hsCollectWords(d); let okAll=true;
      for(let k=0;k<all.length;k+=20){ const chunk=all.slice(k,k+20); let got=null;
        for(let a=0;a<2&&!got;a++){ let r=null; try{ r=await sample.json(hsVocabPrompt(chunk),opts); }catch(e){ if(e&&e.code==="cancelled") throw e; }
          if(r&&Array.isArray(r.words)) got=r.words; }
        if(!got){ okAll=false; continue; }
        chunk.forEach((w,j)=>{ const hit=got.find(g=>g&&Number(g.i)===j)||(got.length===chunk.length?got[j]:null); if(!hit) return;
          const sy=hsCleanWordList(hit.syn,w.w), an=hsCleanWordList(hit.ant,w.w); if(sy) w.syn=sy; w.ant=an.split(", ").slice(0,2).join(", "); });
      }
      d.vocab=all; d.vocabOk=okAll;
    });
  });
  return jobs;
}
async function hsPool(jobs,run,loud){
  const q=[...jobs];
  await Promise.all(Array.from({length:5},async()=>{ while(q.length&&!run.ctl.signal.aborted){ try{ await q.shift()(); }catch(e){ if(e&&e.code==="cancelled") break; if(loud) toast(errCopy(e)); } run.done++; renderHsProgress(); }}));
}

/* ---- 실행 ---- */
async function runHs(){
  if(!sample){toast("이 페이지를 Claude 안에서 열어야 분석할 수 있습니다.");return}
  const H=state.hs; const rows=filledRows("hs"); if(!rows.length){toast("지문을 넣어 주세요.");return}
  const run=H.run; run.running=true; run.ctl=new AbortController(); run.done=0;
  const o={...H.opts};
  const docs=rows.map((r,i)=>{ const text=r.text.trim(); const ss=splitSentences(text);
    return {n:i+1,no:(r.title||"").replace(/번$/,"").trim(),src:r.src||"",title_ko:"",text,head:null,sents:ss.map((s,k)=>({i:k,s,status:"wait"}))}; });
  state.hsResult={kicker:H.kicker,opts:o,docs,created:Date.now()};
  state.sub.hs="result"; renderView();
  const opts={modelTier:state.tier,signal:run.ctl.signal,cache:false};
  const jobs=[];
  docs.forEach(d=>{
    jobs.push(async()=>{
      for(let a=0;a<2&&!(d.head&&d.head.topic_en&&d.head.refs&&(d.head.rflow||[]).length>=4);a++){ let r=null; try{ r=await sample.json(hsHeadPrompt(d,o),opts); }catch(e){ if(e&&e.code==="cancelled") throw e; }
        const nh=hsCleanHead(r,d,o); if(nh) d.head=nh; }
      if(d.head&&d.head.title_ko) d.title_ko=d.head.title_ko;
    });
    for(let k=0;k<d.sents.length;k+=3){ const chunk=d.sents.slice(k,k+3);
      jobs.push(async()=>{
        for(let a=0;a<2;a++){
          const need=chunk.filter(x=>x.status!=="done"); if(!need.length) break;
          let r=null; try{ r=await sample.json(hsSentPrompt(d,need,o),opts); }catch(e){ if(e&&e.code==="cancelled") throw e; continue; }
          const got=(r&&Array.isArray(r.sentences))?r.sentences:[];
          need.forEach((x,kk)=>{ const hit=got.find(g=>g&&Number(g.i)===x.i)||(got.length===need.length?got[kk]:null); const c=hit&&hsCleanSent(hit,x.s,o); if(c) Object.assign(x,c,{status:"done"}); });
        }
        chunk.forEach(x=>{ if(x.status!=="done") x.status="err"; });
      });
    }
  });
  run.total=jobs.length; renderHsProgress();
  await hsPool(jobs,run,true);
  if(!run.ctl.signal.aborted){ const vj=hsVocabJobs(docs,opts); run.total+=vj.length; renderHsProgress(); await hsPool(vj,run,true); }
  run.running=false; LS.set("bj-hs-last",state.hsResult); renderHsProgress(); renderHsSheets();
  if(docs.some(d=>d.sents.some(x=>x.status==="done"))){
    const groups=[]; let cur=[],size=0;
    docs.forEach(d=>{ const n=matBytes(d); if(cur.length&&size+n>170000){groups.push(cur);cur=[];size=0} cur.push(d); size+=n; });
    if(cur.length) groups.push(cur);
    const base=(H.kicker?H.kicker+" ":"")+"고등 지문 분석";
    let saved=0;
    for(let g=0;g<groups.length;g++){
      const m=await saveMaterial("hs",groups.length>1?`${base} (${g+1}/${groups.length}) ${groups[g].map(d=>d.no||d.n).join("·")}`:base,{...state.hsResult,docs:groups[g]});
      if(m) saved++;
    }
    if(saved) toast(`수업자료 › 고등 지문 분석에 저장했습니다.${groups.length>1?` (${groups.length}개로 나눠 저장)`:""}`);
  }
}
async function hsRedo(){
  const res=state.hsResult; if(!res||!sample) return;
  const H=state.hs; const run=H.run; run.running=true; run.ctl=new AbortController(); run.done=0;
  const o=res.opts||{}; const opts={modelTier:state.tier,signal:run.ctl.signal,cache:false}; const jobs=[];
  res.docs.forEach(d=>{
    if(!(d.head&&d.head.topic_en&&d.head.refs&&(d.head.rflow||[]).length>=4)) jobs.push(async()=>{ let r=null; try{ r=await sample.json(hsHeadPrompt(d,o),opts);}catch(e){ if(e&&e.code==="cancelled") throw e; } const nh=hsCleanHead(r,d,o); if(nh) d.head=nh; if(d.head&&d.head.title_ko) d.title_ko=d.head.title_ko; });
    const bad=d.sents.filter(x=>x.status!=="done");
    for(let k=0;k<bad.length;k+=3){ const chunk=bad.slice(k,k+3);
      jobs.push(async()=>{ let r=null; try{ r=await sample.json(hsSentPrompt(d,chunk,o),opts);}catch(e){ if(e&&e.code==="cancelled") throw e; return; }
        const got=(r&&Array.isArray(r.sentences))?r.sentences:[];
        chunk.forEach((x,kk)=>{ const hit=got.find(g=>g&&Number(g.i)===x.i)||(got.length===chunk.length?got[kk]:null); const c=hit&&hsCleanSent(hit,x.s,o); if(c) Object.assign(x,c,{status:"done"}); }); });
    }
  });
  run.total=jobs.length; renderHsProgress();
  await hsPool(jobs,run,false);
  if(!run.ctl.signal.aborted){ res.docs.forEach(d=>{ if(d.vocab&&!d.vocabOk&&d.sents.some(x=>x.status!=="done")) d.vocab=null; }); const vj=hsVocabJobs(res.docs,opts); run.total+=vj.length; renderHsProgress(); await hsPool(vj,run,false); }
  run.running=false; hsPersist(); renderHsProgress(); renderHsSheets();
}
function hsPersist(){
  const res=state.hsResult; if(!res) return; LS.set("bj-hs-last",res);
  state.materials.filter(m=>m.kind==="hs").forEach(m=>{ if(!m.data.docs.some(d=>res.docs.some(r=>r.text===d.text))) return;
    m.data.docs=m.data.docs.map(d=>res.docs.find(r=>r.text===d.text)||d); updateMaterial(m,{}); });
}

/* ---- PDF 글자 읽기(한 단 문서용): 같은 줄의 글자를 이어 붙인다 ---- */
async function tbPdfText(buf){
  const lib=await pdfjs(); const doc=await lib.getDocument({data:buf}).promise; const out=[];
  for(let n=1;n<=doc.numPages;n++){
    const page=await doc.getPage(n); const tc=await page.getTextContent();
    const its=tc.items.filter(it=>it.str&&it.str.trim()!=="").map(it=>({x:it.transform[4],y:it.transform[5],w:it.width||0,h:Math.abs(it.transform[3])||10,s:it.str}));
    its.sort((a,b)=>(Math.abs(b.y-a.y)>3?b.y-a.y:a.x-b.x));
    let line=[],ly=null; const flush=()=>{ if(!line.length) return; line.sort((a,b)=>a.x-b.x); let t=""; line.forEach((it,i)=>{ if(i){ const p=line[i-1]; const gap=it.x-(p.x+p.w); t+=gap>p.h*0.18?" ":""; } t+=it.s; }); out.push(t); line=[]; };
    its.forEach(it=>{ if(ly!==null&&Math.abs(it.y-ly)>3) flush(); line.push(it); ly=it.y; }); flush();
    out.push("\f");
  }
  return out.join("\n");
}
async function tbFileText(file){
  const buf=await file.arrayBuffer(); const h=new Uint8Array(buf.slice(0,4));
  if(h[0]===0x25&&h[1]===0x50&&h[2]===0x44&&h[3]===0x46) return await tbPdfText(buf);
  let t=new TextDecoder("utf-8").decode(buf);
  if((t.match(/\uFFFD/g)||[]).length>20){ try{ t=new TextDecoder("euc-kr").decode(buf); }catch(e){} }
  return t;
}

 "grammar":[{"name":"관계대명사 which / that","exp":"쉬운 설명 2~3문장","n":3,"choices":[{"right":"that can be implanted","wrong":"that can implanting"}]}]}

- syn(유의어) 2~3개: 이 문장의 뜻 그대로 바꿔 쓸 수 있는 영어 단어(w)와 우리말 뜻(k). 반드시 같은 품사이고 이 문맥에서 통하는 것만 씁니다. ant(반의어) 1~2개: 정확히 반대되는 영어 단어(w)와 뜻(k). 뚜렷한 반의어가 없으면 빈 배열로 둡니다. 유의어·반의어는 시험에 자주 나오므로 고등학생이 알아야 할 단어를 우선합니다. 원래 단어와 같은 철자는 쓰지 않습니다.

/* ---- 검증 ---- */
const tbTok=f=>{ const e=String(f).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); return new RegExp("(?<![A-Za-z'’-])"+e+"(?![A-Za-z'’-])","i"); };
function tbCleanWords(arr,d){
  const out=[],used=new Set();
  (Array.isArray(arr)?arr:[]).forEach(w=>{
    const f=hsStr(w&&w.f)||hsStr(w&&w.w), mean=hsStr(w&&w.mean); if(!f||!mean||!hsKo(mean)) return;
    let s=d.sents.find(x=>x.n===+w.n&&tbTok(f).test(x.en)); if(!s) s=d.sents.find(x=>tbTok(f).test(x.en)); if(!s) return;
    const m=s.en.match(tbTok(f)); const real=m?m[0]:f; const k=real.toLowerCase(); if(used.has(k)) return; used.add(k);
    const base=(hsStr(w.w)||real).toLowerCase(); const seen=new Set([base,real.toLowerCase()]);
    const lst=(a,max)=>(Array.isArray(a)?a:[]).map(x=>({w:hsStr(x&&x.w),k:hsStr(x&&x.k)})).filter(x=>x.w&&/^[A-Za-z][A-Za-z '’-]*$/.test(x.w)&&x.k&&hsKo(x.k)).filter(x=>{ const l=x.w.toLowerCase(); if(seen.has(l)) return false; seen.add(l); return true; }).slice(0,max);
    const syn=lst(w.syn,3), ant=lst(w.ant,2);
    out.push({w:hsStr(w.w)||real,f:real,pos:hsStr(w.pos).replace(/[()]/g,""),mean,n:s.n,syn,ant});
  });
  return out.slice(0,10);
}
function tbCleanGram(arr,d){
  const out=[];
  (Array.isArray(arr)?arr:[]).forEach(g=>{
    const name=hsStr(g&&g.name), exp=hsStr(g&&g.exp); if(!name||!exp||!hsKo(exp)) return;
    const s=d.sents.find(x=>x.n===+g.n); if(!s) return;
    const ch=(Array.isArray(g.choices)?g.choices:[]).map(c=>({right:hsStr(c&&c.right),wrong:hsStr(c&&c.wrong)})).filter(c=>c.right&&c.wrong&&c.right.toLowerCase()!==c.wrong.toLowerCase()&&tbTok(c.right).test(s.en)).slice(0,2);
    out.push({name,exp,n:s.n,choices:ch});
  });
  return out.slice(0,2);
}
function tbSeed(n){ let x=(n*2654435761)>>>0; return ()=>{ x=(Math.imul(x^(x>>>15),2246822519)+0x6D2B79F5)>>>0; return (x%100000)/100000; }; }
function tbShuf(arr,seed){ const r=tbSeed(seed), a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

async function tbRunDay(d,opts,run){
  const o={modelTier:state.tier,signal:run.ctl.signal,cache:false};
  const call=async p=>{ try{ return await sample.json(p,o); }catch(e){ if(e&&e.code==="cancelled") throw e; return null; } };
  /* C: 끊어 읽기·해석 채우기 */
  const needC=()=>d.sents.filter(s=>s.needK||s.chunks.some(c=>!c.k));
  for(let a=0;a<2&&needC().length;a++){
    const list=needC();
    for(let k=0;k<list.length;k+=6){ const part=list.slice(k,k+6).map(s=>({...s,pre:s.chunks.length>1})); const r=await call(tbPromptC(d,part)); 
      ((r&&r.sentences)||[]).forEach(x=>{ const s=d.sents.find(y=>y.n===+x.n); if(!s) return; const cs=Array.isArray(x.chunks)?x.chunks.map(c=>({e:hsStr(c&&c.e),k:hsStr(c&&c.k)})):[]; if(!cs.length||cs.some(c=>!c.k||!hsKo(c.k))) return;
        const pre=part.find(p=>p.n===s.n).pre;
        if(pre){ if(cs.length!==s.chunks.length) return; s.chunks.forEach((c,i)=>{ c.k=cs[i].k; }); s.needK=false; }
        else { if(hsNorm(cs.map(c=>c.e).join(" "))!==hsNorm(s.en)||cs.some(c=>!c.e)) return; s.chunks=cs; s.needK=false; } }); }
  }
  run.done++; renderTbProgress();
  /* A·Q 병렬 */
  const pa=(async()=>{ if(!opts.words&&!opts.fillen&&!opts.gram) return; for(let a=0;a<2&&!(d.words.length||d.gram.length);a++){ const r=await call(tbPromptA(d)); if(r){ d.words=tbCleanWords(r.words,d); d.gram=tbCleanGram(r.grammar,d); } } })();
  const pq=(async()=>{ if(!opts.quiz) return; for(let a=0;a<2&&d.quiz.length<3;a++){ const r=await call(tbPromptQ(d)); const qs=((r&&r.quiz)||[]).map(x=>({q:hsStr(x&&x.q),a:x&&x.a===true?true:(x&&x.a===false?false:null),n:+(x&&x.n)})).filter(x=>x.q&&hsKo(x.q)&&x.a!==null).slice(0,6); if(qs.length<3) continue;
      const v=await call(tbPromptV(d,qs)); const ans=(v&&v.answers)||[]; const keep=qs.filter((q,i)=>{ const h=ans.find(x=>+x.i===i); return h&&h.a===q.a; }); if(keep.length>=3) d.quiz=keep.slice(0,4); } })();
  await Promise.all([pa,pq]); run.done+=2; renderTbProgress();
  d.status=d.sents.every(s=>!s.needK)?"done":"part";
}

function crCleanSent(x,s){

function crCleanHead(r,d,o){
  if(!r||typeof r!=="object"||!crKo(r.one_line)) return null;
  const n=d.sents.length, tl=" "+crNorm(d.text)+" ";

    .filter(w=>{ if(!w.w||!w.mean||!crKo(w.mean)) return false; const nn=crNorm(w.w); if(!nn) return false; if(tl.includes(" "+nn+" ")) return true;
      const st=nn.split(" ")[0]; const stem=st.length>5?st.slice(0,st.length-2):st.slice(0,Math.max(3,st.length-1)); return tl.includes(" "+stem); }).slice(0,12);
  words.forEach(w=>{ if(crKo(w.fam)||w.fam.length>60||!/[a-z]/i.test(w.fam)) w.fam=""; if(crKo(w.def)||w.def.length>100||!/[a-z]/i.test(w.def)) w.def=""; });

  const h={title_ko:crStr(r.title_ko),title_en:crStr(r.title_en),one_line:crStr(r.one_line),summary:crKo(r.summary)?crStr(r.summary):"",
    words:uw,
    phrases:crArr(r.phrases).map(p=>({p:crStr(p&&p.p),mean:crStr(p&&p.mean)})).filter(p=>p.p&&crKo(p.mean)&&crHas(d.text,p.p)).slice(0,6),
    grammar:crArr(r.grammar).map(g=>({name:crStr(g&&g.name),rule:crStr(g&&g.rule),ex:crStr(g&&g.ex),bad:crStr(g&&g.bad),note:crStr(g&&g.note)}))
      .filter(g=>g.name&&crKo(g.rule)&&g.ex&&crHas(d.text,g.ex)).map(g=>({...g,bad:g.bad&&crNorm(g.bad)!==crNorm(g.ex)?g.bad:""})).slice(0,5),
    write:[],ox:[],gcheck:[]};

      if(!(c.i>=1&&c.i<=n&&crHas(d.sents[c.i-1].s,c.ex))){ const k=d.sents.findIndex(x=>crHas(x.s,c.ex)); c.i=k>=0?k+1:0; } return c; }).filter(c=>c.i>=1).filter(c=>{ const k=crNorm(c.item)+"|"+crNorm(c.ex); if(seenG.has(k)) return false; seenG.add(k); return true; }).slice(0,14); }

  if(o.ox) h.ox=crArr(r.ox).map(q=>({q:crStr(q&&q.q),a:q&&q.a===true?true:(q&&q.a===false?false:null),why:crStr(q&&q.why)})).filter(q=>q.q&&crKo(q.q)&&q.a!==null).slice(0,5);
  return h;
}

async function runCr(){
  if(!sample){toast("이 페이지를 Claude 안에서 열어야 정리할 수 있습니다.");return}
  const H=state.cr; const rows=filledRows("cr"); if(!rows.length){toast("지문을 넣어 주세요.");return}
  const run=H.run; run.running=true; run.ctl=new AbortController(); run.done=0;
  const o={...H.opts};
  const docs=rows.map((r,i)=>{ const text=r.text.trim(); const ss=splitSentences(text);
    return {n:i+1,no:(r.title||"").replace(/번$/,"").trim(),src:r.src||"",title_ko:"",text,head:null,sents:ss.map((s,k)=>({i:k,s,status:"wait"}))}; });
  state.crResult={kicker:H.kicker,opts:o,docs,created:Date.now()};
  state.sub.cr="result"; renderView();
  const opts={modelTier:state.tier,signal:run.ctl.signal,cache:false};
  const jobs=[];
  docs.forEach(d=>{
    jobs.push(async()=>{
      for(let a=0;a<2&&!d.head;a++){ let r=null; try{ r=await sample.json(crHeadPrompt(d,o),opts); }catch(e){ if(e&&e.code==="cancelled") throw e; }
        d.head=crCleanHead(r,d,o); }
      if(d.head&&d.head.title_ko) d.title_ko=d.head.title_ko;
    });
    for(let k=0;k<d.sents.length;k+=5){ const chunk=d.sents.slice(k,k+5);
      jobs.push(async()=>{
        for(let a=0;a<2;a++){
          const need=chunk.filter(x=>x.status!=="done"); if(!need.length) break;
          let r=null; try{ r=await sample.json(crSentPrompt(d,need),opts); }catch(e){ if(e&&e.code==="cancelled") throw e; continue; }
          const got=(r&&Array.isArray(r.sentences))?r.sentences:[];
          need.forEach((x,kk)=>{ const hit=got.find(g=>g&&Number(g.i)===x.i)||(got.length===need.length?got[kk]:null); const c=hit&&crCleanSent(hit,x.s); if(c) Object.assign(x,c,{status:"done"}); });
        }
        chunk.forEach(x=>{ if(x.status!=="done") x.status="err"; });
      });
    }
  });
  run.total=jobs.length; renderCrProgress();
  const q=[...jobs];
  await Promise.all(Array.from({length:5},async()=>{ while(q.length&&!run.ctl.signal.aborted){ try{ await q.shift()(); }catch(e){ if(e&&e.code==="cancelled") break; toast(errCopy(e)); } run.done++; renderCrProgress(); }}));
  run.running=false; LS.set("bj-cr-last",state.crResult); renderCrProgress(); renderCrSheets();
  if(docs.some(d=>d.head||d.sents.some(x=>x.status==="done"))){
    const groups=[]; let cur=[],size=0;
    docs.forEach(d=>{ const n=matBytes(d); if(cur.length&&size+n>170000){groups.push(cur);cur=[];size=0} cur.push(d); size+=n; });
    if(cur.length) groups.push(cur);
    const base=(H.kicker?H.kicker+" ":"")+"시험 직전 정리";
    let saved=0;
    for(let g=0;g<groups.length;g++){
      const m=await saveMaterial("cr",groups.length>1?`${base} (${g+1}/${groups.length}) ${groups[g].map(d=>d.no||d.n).join("·")}`:base,{...state.crResult,docs:groups[g]});
      if(m) saved++;
    }
    if(saved) toast(`수업자료 › 시험 직전 정리에 저장했습니다.${groups.length>1?` (${groups.length}개로 나눠 저장)`:""}`);
  }
}

  if(t.dataset&&(t.dataset.attSn!==undefined||t.dataset.attSg!==undefined)){ const sn=t.dataset.attSn!==undefined; const [dep,i,k]=(sn?t.dataset.attSn:t.dataset.attSg).split(":"); const cl=state.att[dep].classes[+i]; const x=cl&&cl.students[+k]; if(x){ if(sn) x.n=t.value; else x.g=t.value; attSave(); const c=$("#att-cnt-"+dep+"-"+i); if(c) c.textContent=attStudents(cl).length+"명"; clearTimeout(draftT.att); draftT.att=setTimeout(renderAttSheets,250); } return }
  if(t.dataset&&t.dataset.attName){ const [dep,i]=t.dataset.attName.split(":"); const cl=state.att[dep].classes[+i]; if(cl){ cl.name=t.value; attSave(); clearTimeout(draftT.att); draftT.att=setTimeout(renderAttSheets,250); } return }
  if(t.id==="att-year"){ const v=parseInt(t.value,10); if(v>=2000&&v<=2100){ state.att.year=v; attSave(); clearTimeout(draftT.att); draftT.att=setTimeout(renderAttSheets,250); } return }
  if(t.id==="att-extra"){ state.att.extra=t.value; attSave(); clearTimeout(draftT.att); draftT.att=setTimeout(renderAttSheets,250); return }
  if(t.dataset.k){const k=t.dataset.k;rowsOf(k)[+t.dataset.i][t.dataset.f]=t.value;clearTimeout(draftT[k]);draftT[k]=setTimeout(()=>saveDraft(k),500);
    if(k==="gen"){ renderTally(); const p=$("#plan"); if(p) p.innerHTML=planHTML(); } else if(k==="ana") renderAnaTally(); else if(k==="exam") renderExamTally(); else if(k==="hs") renderHsTally(); else if(k==="cr") renderCrTally(); else renderClsTally(); return}
  if(t.dataset.g){state.gen[t.dataset.g]=t.value;clearTimeout(draftT.gen);draftT.gen=setTimeout(()=>saveDraft("gen"),500);return}
  if(t.dataset.g2!==undefined&&t.dataset.gi!==undefined){const g=state.bookGrammar[+t.dataset.gi]; if(g){g[t.dataset.g2]=t.value; if(t.dataset.g2==="name"){const m=String(t.value).match(/^(\d{2})\s/); g.unit=m?`SKY Unit ${+m[1]}`:"";} LS.set("bj-bookgrammar",state.bookGrammar); renderTally(); const c=$("#g-count"); if(c) c.textContent=`지문마다 ${grammarItems().length}문항이 더 만들어집니다.`;} return}
  if(t.dataset.e){state.ext[t.dataset.e]=t.value;LS.set(extKey(),state.ext);return}
  if(t.dataset.a){state.ana[t.dataset.a]=t.value;clearTimeout(draftT.ana);draftT.ana=setTimeout(()=>saveDraft("ana"),500);return}
  if(t.dataset.c){state.cls[t.dataset.c]=t.value;clearTimeout(draftT.cls);draftT.cls=setTimeout(()=>saveDraft("cls"),500);return}
  if(t.dataset.wwm){ const [di,wi]=t.dataset.wwm.split(":").map(Number); const w=state.wkbkResult&&state.wkbkResult.docs[di]&&state.wkbkResult.docs[di].words[wi]; if(w){ w.mean=t.value; clearTimeout(draftT.wwm); draftT.wwm=setTimeout(()=>{LS.set("bj-wkbk-last",state.wkbkResult);renderWkbkWordSheets()},500); } return }
  if(t.dataset.k2){state.wkbk[t.dataset.k2]=t.value;clearTimeout(draftT.wkbk);draftT.wkbk=setTimeout(()=>saveDraft("wkbk"),500);return}
  if(t.dataset.t2){const T=state.tb; T[t.dataset.t2]=t.value; clearTimeout(draftT.tb); draftT.tb=setTimeout(tbSaveDraft,500); if(t.dataset.t2==="text"){ T.skip=[]; clearTimeout(draftT.tbd); draftT.tbd=setTimeout(renderTbDays,300); } return}
  if(t.dataset.t2n){const T=state.tb; T.perDay=Math.max(3,Math.min(30,parseInt(t.value,10)||9)); clearTimeout(draftT.tb); draftT.tb=setTimeout(tbSaveDraft,500); if(T.mode==="count"){ clearTimeout(draftT.tbd); draftT.tbd=setTimeout(renderTbDays,300); } return}
  if(t.dataset.c2){state.cr[t.dataset.c2]=t.value;clearTimeout(draftT.cr);draftT.cr=setTimeout(crSaveDraft,500);return}
  if(t.dataset.h2){state.hs[t.dataset.h2]=t.value;clearTimeout(draftT.hs);draftT.hs=setTimeout(hsSaveDraft,500);return}
  if(t.dataset.e2){state.exam[t.dataset.e2]=t.value;clearTimeout(draftT.exam);draftT.exam=setTimeout(exSaveDraft,500); const hp=$("#exam-headprev"); if(hp) hp.textContent=exHeadTitle(state.exam)||"(학교·시험 이름을 넣어 주세요)"; return}
  if(t.dataset.e2n){const v=Math.max(0,Math.min(20,parseInt(t.value,10)||0)); state.exam[t.dataset.e2n]=t.dataset.e2n==="maxPer"?Math.max(1,v):v; clearTimeout(draftT.exam);draftT.exam=setTimeout(exSaveDraft,500);renderExamTally();return}
  if(t.dataset.exsc){const v=Math.max(1,Math.min(10,parseInt(t.value,10)||0)); if(v){state.exam.scores[t.dataset.exsc]=v;clearTimeout(draftT.exam);draftT.exam=setTimeout(exSaveDraft,500);renderExamTally();} return}
  if(t.dataset.r2){state.rf[t.dataset.r2]=t.value;clearTimeout(draftT.rf);draftT.rf=setTimeout(()=>saveDraft("rf"),500);return}
  if(t.dataset.m2){state.mt[t.dataset.m2]=t.value;clearTimeout(draftT.mt);draftT.mt=setTimeout(()=>saveDraft("mt"),500);return}
  if(t.dataset.mtn){const lim=t.dataset.mtn==="sets"?[1,10]:[5,45]; state.mt[t.dataset.mtn]=Math.min(lim[1],Math.max(lim[0],parseInt(t.value)||lim[0])); LS.set("bj-mt-opts",{sets:state.mt.sets,per:state.mt.per}); mtTally(); return}
  if(t.dataset.p2){state.ps[t.dataset.p2]=t.value;clearTimeout(draftT.ps);draftT.ps=setTimeout(()=>saveDraft("ps"),500);return}
  if(t.dataset.pstype){const set=new Set(state.ps.types); if(t.checked) set.add(t.dataset.pstype); else set.delete(t.dataset.pstype); state.ps.types=PS_ORDER.filter(x=>set.has(x)); LS.set("bj-ps-types",state.ps.types); psTally(); return}
  if(t.dataset.b2){state.basic[t.dataset.b2]=t.value;clearTimeout(draftT.basic);draftT.basic=setTimeout(()=>saveDraft("basic"),500);return}
  if(t.id==="mat-q"){state.matQ=t.value;clearTimeout(draftT.matq);draftT.matq=setTimeout(()=>{const el=$("#mat-q");const pos=el&&el.selectionStart;renderView();const e2=$("#mat-q");if(e2){e2.focus();try{e2.setSelectionRange(pos,pos)}catch(_){}}} ,250);return}
  if(t.id==="s-academy"){state.academy=t.value;persist();renderNav();return}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="att-month"){ state.att.month=+t.value; attSave(); renderAttSheets(); return }
  if(t.id==="att-pad"||t.id==="att-hol"){ state.att[t.id.slice(4)]=t.checked; attSave(); renderAttSheets(); return }
  if(t.dataset&&t.dataset.gsel){ t.checked?state.genSel.add(t.dataset.gsel):state.genSel.delete(t.dataset.gsel); renderView(); return }
  if(t.id==="gen-all"){ const list=state.materials.filter(m=>m.kind==="variant"); if(t.checked) list.forEach(m=>state.genSel.add(m.id)); else state.genSel.clear(); renderView(); return }
  if(t.dataset&&t.dataset.g2!==undefined&&t.dataset.gi!==undefined){const g=state.bookGrammar[+t.dataset.gi]; if(g){g[t.dataset.g2]=t.value;LS.set("bj-bookgrammar",state.bookGrammar);renderTally();const c=$("#g-count");if(c)c.textContent=`지문마다 ${grammarItems().length}문항이 더 만들어집니다.`;} return}
  if(t.dataset&&t.dataset.e){state.ext[t.dataset.e]=t.value;LS.set(extKey(),state.ext);return}
  if(t.id==="m-exam"&&state.modal){state.modal.examId=t.value;state.modal.sel=new Set();renderModal();return}
  if(t.id==="book-split"){state.bookSplit=t.value;persist();renderTally();return}
  if(t.id==="sort-sel"||t.id==="sort-sel2"){state.sort=t.value;persist();if(t.id==="sort-sel2"){renderSheets();renderView()}return}
  if(t.id==="version"){state.version=t.value;persist();renderSheets();return}
  if(t.id==="s-tier"){state.tier=t.value;persist();return}
  if(t.dataset&&t.dataset.extsel!==undefined&&state.modal&&state.modal.type==="ext"){const i=+t.dataset.extsel;t.checked?state.modal.sel.add(i):state.modal.sel.delete(i);const b=$("#ext-add");if(b){b.textContent=`${state.modal.sel.size}편 표에 넣기`;b.disabled=!state.modal.sel.size}return}
  if(t.dataset&&t.dataset.pdfsel!==undefined&&state.modal&&state.modal.type==="pdf"){const i=+t.dataset.pdfsel; t.checked?state.modal.sel.add(i):state.modal.sel.delete(i); const b=$("#pdf-add"); if(b){b.textContent=`${state.modal.sel.size}개 지문 표에 넣기`; b.disabled=!state.modal.sel.size;} return}
  if(t.dataset&&t.dataset.bulkfile){ if(t.files.length) bulkImport(t.files); t.value=""; return}
  if(t.id==="bulk-ow"){state.bulk.overwrite=t.checked;return}
  if(t.dataset&&t.dataset.dropfile){ if(t.files.length) handleDropFiles(t.dataset.dropfile,t.files); t.value=""; return}
  if(t.id==="tb-file"){ tbLoadFile(t.files&&t.files[0]); t.value=""; return }
  if(t.id==="tb-key"){ state.tb.key=t.checked; renderTbSheets(); return }
  if(t.name==="tbmode"){ state.tb.mode=t.value; state.tb.skip=[]; tbSaveDraft(); renderTbDays(); return }
  if(t.dataset&&t.dataset.tbday){ const n=+t.dataset.tbday, T=state.tb; T.skip=t.checked?T.skip.filter(x=>x!==n):[...T.skip.filter(x=>x!==n),n]; t.closest(".tbday").classList.toggle("on",t.checked); tbSaveDraft(); renderTbTally(); return }
  if(t.dataset&&t.dataset.tbopt){ state.tb.opts[t.dataset.tbopt]=t.checked; t.closest(".wbcard").classList.toggle("on",t.checked); tbSaveDraft(); return }
  if(t.dataset&&t.dataset.cropt){state.cr.opts[t.dataset.cropt]=t.checked;t.closest(".wbcard").classList.toggle("on",t.checked);crSaveDraft();return}
  if(t.dataset&&t.dataset.hsopt){state.hs.opts[t.dataset.hsopt]=t.checked;t.closest(".wbcard").classList.toggle("on",t.checked);hsSaveDraft();return}
  if(t.dataset&&t.dataset.wk2act){const id=t.dataset.wk2act; const w=state.wkbk; w.acts=t.checked?[...WB_ACTS.map(a=>a.id).filter(x=>w.acts.includes(x)||x===id)]:w.acts.filter(x=>x!==id); LS.set("bj-wkbk-acts",w.acts); t.closest(".wbcard").classList.toggle("on",t.checked); renderWkbkTally(); return}
  if(t.dataset&&t.dataset.wbact){const id=t.dataset.wbact; state.cls.wb=t.checked?[...WB_ACTS.map(a=>a.id).filter(x=>state.cls.wb.includes(x)||x===id)]:state.cls.wb.filter(x=>x!==id); LS.set("bj-cls-wb",state.cls.wb); t.closest(".wbcard").classList.toggle("on",t.checked); const h=document.querySelector('[data-count="cls"]'); return}
  if(t.id==="cls-wbn"){state.cls.wbN=+t.value;LS.set("bj-cls-wbn",state.cls.wbN);return}
  if(t.id==="pdf-split"){state.splitLong=t.checked;LS.set("bj-split-long",state.splitLong);return}
  if(t.id==="cls-key"){state.cls.key=t.checked;renderClsSheets();return}
  if(t.id==="wkbk-key"){state.wkbk.key=t.checked;renderWkbkSheets();return}
  if(t.id==="wkbk-tfans"){state.wkbk.tfAns=t.checked;renderWkbkSheets();return}
  if(t.id==="wwd-merge"||t.id==="wwd-shuffle"||t.id==="wwd-ex"||t.id==="wwd-key"){ const wd=state.wkbk.wd; wd[t.id.slice(4)]=t.checked; renderWkbkWordSheets(); return }
  if(t.dataset&&t.dataset.wwoff){ const [di,wi]=t.dataset.wwoff.split(":").map(Number); const w=state.wkbkResult&&state.wkbkResult.docs[di]&&state.wkbkResult.docs[di].words[wi]; if(w){ w.off=!t.checked; LS.set("bj-wkbk-last",state.wkbkResult); renderWkbkWordSheets(); } return }
  if(t.id==="rf-pass"){state.rf.showPass=t.checked;renderRfSheets();return}
  if(t.id==="basic-key"){state.basic.key=t.checked;renderBasicSheets();return}
  if(t.dataset&&t.dataset.extype){const id=t.dataset.extype; const E=state.exam; E.types=t.checked?[...EX_TYPES.map(x=>x.id).filter(x=>E.types.includes(x)||x===id)]:E.types.filter(x=>x!==id); exSaveDraft(); t.closest(".exchk").classList.toggle("on",t.checked); const h=document.querySelector(".exgrid").closest(".card").querySelector("h3 small"); if(h) h.textContent=E.types.length+"개 유형 선택"; return}
  if(t.id==="exam-grade"){state.exam.grade=t.value;exSaveDraft();const hp=$("#exam-headprev"); if(hp) hp.textContent=exHeadTitle(state.exam)||"(학교·시험 이름을 넣어 주세요)";return}
  if(t.id==="imp-file"||t.id==="imp-ans"){state.imp=state.imp||{}; state.imp[t.id==="imp-file"?"file":"ansFile"]=t.files[0]||null; t.closest(".drop").classList.toggle("has",!!t.files[0]); const b=t.closest(".drop").querySelector("b"); if(t.files[0]) b.textContent=t.files[0].name; return}
  if(["imp-year","imp-grade","imp-month","imp-kind"].includes(t.id)){state.imp=state.imp||{};state.imp[t.id.slice(4)]=t.id==="imp-grade"||t.id==="imp-kind"?t.value:+t.value;return}
  if(t.dataset.k){saveDraft(t.dataset.k);}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&state.modal){closeModal(state.modal.type==="confirm"?false:null);} if(e.key==="Enter"&&state.modal&&state.modal.type==="text"){closeModal(($("#md-input").value||"").trim());}});
let rsz; window.addEventListener("resize",()=>{clearTimeout(rsz);rsz=setTimeout(()=>{fitScale("#sheets");fitScale("#ana-sheets");fitScale("#cls-sheets");fitScale("#wkbk-sheets");fitScale("#basic-sheets");fitScale("#exam-sheets");fitScale("#hs-sheets");fitScale("#cr-sheets");fitScale("#tb-sheets")},120)});

function renderAnaTally(){
  const el=$("#ana-tally"); if(!el) return; const rows=filledRows("ana");
  el.innerHTML=`지문 <b>${rows.length}</b>개 · 문장 <b>${rows.reduce((a,r)=>a+splitSentences(r.text).length,0)}</b>개${rows.length?` · 예상 약 ${Math.max(1,Math.round(rows.reduce((a,r)=>a+Math.ceil(splitSentences(r.text).length/4)+5,0)/5*1.2))}분`:""}${splitInfo("ana")}`;
  const b=$("#ana-run"); if(b) b.disabled=!rows.length||state.anaRun.running||(sampleChecked&&!sample);
}
/* ================= boot ================= */
const _qz=quizFromHash();
if(_qz){ document.head.insertAdjacentHTML("beforeend",`<style>${QUIZ_CSS}</style>`); startQuiz(_qz); }
else {
renderView();
(async()=>{
  if(!window.claude||!window.claude.use){standaloneInit();return}
  const [s,d,b]=await Promise.all(["sample","downloads","db"].map(n=>window.claude.use(n).catch(()=>null)));
  sample=s; downloads=d; db=b; sampleChecked=true;
  if(db) Object.values(MAT_PEND).forEach(m=>{ if(m&&m.id) dbWriteMat(m); });
  if(db) syncBoot();
  if(db){
    db.collection("exams").onSnapshot(snap=>{state.library=snap.docs.map(x=>x.data()).filter(x=>x&&Array.isArray(x.passages)); renderNav(); if(state.view==="lib"&&!(state.imp&&state.imp.passages)) renderView(); if(state.modal) renderModal();},()=>{});
    db.doc("meta/lessons").onSnapshot(snap=>{const v=snap.exists&&snap.data(); if(v&&v.byType){state.lessons=JSON.parse(JSON.stringify(v.byType));LS.set("jp-lessons-local",state.lessons); if(state.view==="notes") renderView();}},()=>{});
    db.collection("vocab").onSnapshot(snap=>{snap.docs.forEach(x=>{const v=x.data(); if(v&&v.items) state.vocab[x.id]=v.items;}); LS.set("bj-vocab-local",state.vocab); if(state.view==="wd"&&!state.words.busy) renderView();},()=>{});
    db.collection("materials").onSnapshot(snap=>{state.materials=mergeMaterials(snap.docs.map(x=>x.data()).filter(Boolean)); renderNav(); if(state.view==="mat") renderView();},()=>{});
  }
  renderView();
})();
}

</script>

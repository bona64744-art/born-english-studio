<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Born English Class Material Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@300;400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --side:#0F1A2B; --side-2:#16243A; --side-ink:#C9D2DF; --side-mute:#6F7E93;
  --bg:#F3F4F7; --panel:#FFFFFF; --ink:#1B2230; --muted:#5E6878; --faint:#98A1AE;
  --line:#E3E6EC; --line-2:#EEF0F4; --blue:#1F5BD8; --blue-ink:#fff; --blue-soft:#EAF0FD;
  --violet:#6A48F2; --red:#D32F2F; --red-soft:#FCECEC; --ok:#1E7F52; --maroon:#7A2233;
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --serif:'Source Serif 4','Times New Roman',Georgia,serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --side:#0B121E; --side-2:#15202F; --bg:#141922; --panel:#1C232E; --ink:#E6E9EE; --muted:#A3ACB8; --faint:#7C8592;
    --line:#2F3845; --line-2:#262E3A; --blue:#6E93FF; --blue-ink:#0D1424; --blue-soft:#22304F; --violet:#9C85FF; --red:#FF6F64; --red-soft:#3A2224; --ok:#5BC894;
  }
}
:root[data-theme="dark"]{
  --side:#0B121E; --side-2:#15202F; --bg:#141922; --panel:#1C232E; --ink:#E6E9EE; --muted:#A3ACB8; --faint:#7C8592;
  --line:#2F3845; --line-2:#262E3A; --blue:#6E93FF; --blue-ink:#0D1424; --blue-soft:#22304F; --violet:#9C85FF; --red:#FF6F64; --red-soft:#3A2224; --ok:#5BC894;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(190px,20%) minmax(0,1fr);height:100%}

/* sidebar */
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;height:100%;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 20px}
.brand img{width:38px;height:38px;border-radius:9px;background:#fff;padding:3px;object-fit:contain}
.brand b{display:block;color:#fff;font-size:15.5px;letter-spacing:-0.01em;line-height:1.2}
.brand small{color:var(--side-mute);font-size:11.5px}
.nav{padding:0 10px 20px;flex:1}
.nav h6{margin:16px 8px 6px;font-size:11px;font-weight:500;color:var(--side-mute)}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:var(--side-ink);padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px;text-align:left}
.nav button svg{width:17px;height:17px;flex:none;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.05)}
.nav button[aria-current="page"]{background:var(--side-2);color:#fff;font-weight:600}
.nav .badge{margin-left:auto;font-size:11px;color:var(--side-mute);font-variant-numeric:tabular-nums}

/* top */
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:auto}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;height:58px;padding:0 28px;background:var(--panel);border-bottom:1px solid var(--line)}
.crumb{font-size:14px;color:var(--faint)}
.crumb b{color:var(--ink);margin-left:6px}
.crumb i{font-style:normal;margin:0 6px}
.top .spacer{flex:1}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.who b{color:var(--ink);font-weight:600}
.who .av{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:13px}
.view{padding:20px 28px 80px;flex:1}
.view:has(.gen){padding-left:16px;padding-right:20px}
.phead{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.phead h1{margin:0;font-size:21px;letter-spacing:-0.03em}
.phead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.phead .spacer{flex:1}
.subtabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.subtabs button{border:0;background:transparent;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--muted)}
.subtabs button[aria-selected="true"]{background:var(--blue);color:var(--blue-ink);font-weight:600}
.subtabs .cnt{margin-left:5px;font-size:11.5px;opacity:.8;font-variant-numeric:tabular-nums}

/* generic */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.card h3{margin:0 0 4px;font-size:16px;letter-spacing:-0.02em}
.card h3 small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.hint{margin:0 0 12px;color:var(--muted);font-size:12.5px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px}
.field>span small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.field input,.field select,.field textarea,.inp{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:11px 14px}
.gen-right .card .field input{height:44px;font-size:15px}
.gen-right .card{padding:18px 22px 16px}
.gen-right .card .field{margin-bottom:10px}
.gen-right .card .field>span{margin-bottom:5px}
.gen-right .card h3,.bare .bh{font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.violet{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.block{width:100%}
.btn.big{height:48px;font-size:15px;padding:0 22px}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px}
.link{border:0;background:none;padding:0;color:var(--blue);cursor:pointer;font-size:12.5px;font-weight:500}
.link.danger{color:var(--red)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.notice{margin:0 0 14px;padding:10px 12px;border-radius:8px;font-size:13px;background:var(--red-soft);color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.on{opacity:1}

/* generator layout */
.gen{display:grid;grid-template-columns:minmax(250px,25%) minmax(0,1fr);column-gap:20px;align-items:start}
.gen>.gen-left{grid-column:1}
.gen>.gen-right{grid-column:2}
#topx{margin-left:18px}
#topx .subtabs{padding:2px}
#topx .subtabs button{padding:4px 12px;font-size:13px}
.plan-card{padding:14px}
.plan-card h3{font-size:15px}
.plan-card .plan{grid-template-columns:1fr}
.gen-left{display:grid;gap:12px;position:sticky;top:70px;max-height:calc(100vh - 82px);overflow:auto;padding:0 4px 24px 0;scrollbar-width:thin}
.gen-left .lead{font-size:12.5px;color:var(--muted);margin:0 2px}
.gen-right{display:grid;gap:18px;min-width:0}
.gtop{display:flex;justify-content:flex-end;margin-bottom:-6px}
.bare .bh{margin:0 0 2px;font-size:16px;letter-spacing:-0.02em}
.bare .bh small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.bare .hint{margin-bottom:10px}
.bare .ptable{background:var(--panel)}
.plan-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.plan-h h3{margin:0}
.plan-h span{font-size:13px;color:var(--muted)}
.plan-h span b{color:var(--ink);font-size:15px}
.plan{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.plan li{display:flex;align-items:baseline;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px}
.plan li .pc{font-size:11px;color:var(--faint)}
.plan li em{margin-left:auto;font-style:normal;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tcard.has{border-color:color-mix(in srgb,var(--blue) 55%,var(--line))}
.tcard>header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.tcard>header b{font-size:15px}
.tcard>header .n{font-size:12px;color:var(--blue);font-weight:600;font-variant-numeric:tabular-nums}
.tcard>header .spacer{flex:1}
.tcard>header .fold{border:0;background:none;color:var(--faint);cursor:pointer;font-size:11px;padding:4px}
.tcard>header .mini{border:1px solid var(--line);background:var(--panel);border-radius:6px;font-size:11.5px;color:var(--muted);padding:2px 8px;cursor:pointer}
.tcard .sub{margin:8px 14px 0;font-size:12px;color:var(--muted)}
.tcard .tb{padding:4px 14px 14px}
.tcard.closed .tb,.tcard.closed .sub{display:none}
.ttype h4{margin:12px 0 6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ctr{border:1px solid var(--line);border-radius:8px;padding:6px 8px 8px;background:var(--bg)}
.ctr.on{background:var(--blue-soft);border-color:color-mix(in srgb,var(--blue) 45%,var(--line))}
.ctr>span{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
.stp{display:grid;grid-template-columns:28px 1fr 28px;align-items:center}
.stp button{height:28px;border:1px solid var(--line);background:var(--panel);border-radius:6px;cursor:pointer;font-weight:700;font-size:15px;line-height:1}
.stp output{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.fill{margin-top:12px}

/* passage table */
.ptable{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ptr{display:grid;grid-template-columns:52px minmax(96px,160px) minmax(96px,160px) minmax(0,1fr) 40px;border-top:1px solid var(--line-2)}
@media (max-width:1500px){.ptr{grid-template-columns:48px 108px 108px minmax(0,1fr) 36px}}
@media (max-width:1280px){.ptr{grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) 36px}.ptr.head{display:none}.ptr .pi{grid-row:span 2}.ptr .del{grid-row:1/span 2;grid-column:4}.ptr input{border-bottom:1px solid var(--line-2)}.ptr textarea{grid-column:2/4;min-height:130px}}
.ptr:first-child{border-top:0}
.ptr.head{background:var(--bg);font-size:12.5px;font-weight:600;color:var(--muted)}
.ptr.head>span{padding:10px 12px}
.ptr .pi{display:grid;place-items:start center;padding-top:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--bg)}
.ptr input,.ptr textarea{border:0;border-left:1px solid var(--line-2);background:transparent;padding:11px 12px;width:100%;min-width:0;resize:vertical}
.ptr textarea{min-height:150px;font-family:var(--serif);font-size:15px;line-height:1.6}
.ptr input{font-size:15px}
.ptr.head>span{padding:13px 14px;font-size:13.5px}
.ptr input:focus,.ptr textarea:focus{outline:2px solid var(--blue);outline-offset:-2px;background:var(--blue-soft)}
.ptr .del{border:0;border-left:1px solid var(--line-2);background:transparent;color:var(--faint);cursor:pointer;font-size:16px}
.ptr .del:hover{color:var(--red)}
.tablebar{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.tablebar small{color:var(--muted);font-size:12.5px}
.savedat{font-size:12px;color:var(--muted);margin-top:-2px}
.runbar{position:sticky;bottom:12px;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 10px 30px -18px rgba(15,26,43,.5)}
.runbar .tally{font-size:13px;color:var(--muted)}
.runbar .tally b{color:var(--ink);font-size:20px;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.runbar .spacer{flex:1}
.runbar select{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 10px}

/* results */
.rbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rbar .spacer{flex:1}
.rbar select{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 10px;font-weight:600}
.rinfo{font-size:13px;color:var(--muted);margin-bottom:10px}
.rinfo strong{color:var(--ink)}
.prog{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:0;list-style:none}
.prog li{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.prog li b{color:var(--ink);margin-right:4px}
.prog li.busy{border-color:var(--blue);color:var(--blue)}
.prog li.done{border-color:color-mix(in srgb,var(--ok) 40%,var(--line));color:var(--ok)}
.prog li.err{border-color:var(--red);color:var(--red)}
.seal{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 10px;border:2px solid var(--red);border-radius:5px;color:var(--red);font-weight:700;font-size:12.5px;transform:rotate(-4deg)}
.sheets{display:flex;flex-direction:column;align-items:center;gap:22px;padding:6px 0 40px}
.frame{position:relative;flex:none;box-shadow:0 1px 0 rgba(0,0,0,.05),0 10px 24px -12px rgba(20,30,50,.35)}
.frame .page{transform:scale(var(--s,1));transform-origin:top left;position:absolute;left:0;top:0}
.pageno{position:absolute;right:-2px;top:-20px;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.empty{max-width:560px;margin:50px auto;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:18px;margin:0 0 8px}

/* proof log */
.log{width:100%;max-width:980px;display:grid;gap:16px}
.log-unit{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.log-unit>header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.log-q{display:grid;grid-template-columns:190px 1fr;gap:16px;padding:14px 16px;border-top:1px solid var(--line-2)}
.log-q:first-of-type{border-top:0}
.log-q .nm{font-weight:600;font-size:13.5px}
.log-q .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.stamps{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.stamp{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:62px;height:46px;border:2px solid var(--red);border-radius:6px;color:var(--red);transform:rotate(-3deg);line-height:1.1}
.stamp:nth-child(2n){transform:rotate(2deg)}
.stamp b{font-size:14px;font-weight:700}
.stamp small{font-size:10.5px;font-weight:600}
.stamp.clean{border-color:var(--ok);color:var(--ok)}
.stamp.fixed{background:var(--red-soft)}
.issues{margin:0;padding:0 0 0 18px;font-size:12.5px;color:var(--muted)}
.issues li{margin:3px 0}
.issues li b{color:var(--red);font-weight:600;margin-right:4px}
.issues li.ok b{color:var(--ok)}
.excluded{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;color:var(--red)}
.lessons{list-style:none;margin:0;padding:0}
.lessons li{display:grid;grid-template-columns:130px 1fr auto auto;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line-2);font-size:13px}
.lessons li .ty{color:var(--muted);font-size:12px}
.lessons li .n{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}

/* library */
.lib{width:100%;max-width:1040px;display:grid;gap:18px}
.drop{display:block;border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;background:var(--bg)}
.drop b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.drop input{display:block;margin:8px auto 0;font-size:12px}
.drop.has{border-style:solid;border-color:var(--blue);background:var(--blue-soft)}
.lib textarea{min-height:90px}
.imp-status{margin:12px 0 0;font-size:13px;color:var(--muted)}
.imp-status.err{color:var(--red)}
.pv{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line-2);max-height:460px;overflow:auto}
.pv li{border-bottom:1px solid var(--line-2);padding:8px 2px}
.pv summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;font-size:13px}
.pv summary b{min-width:42px;font-variant-numeric:tabular-nums}
.pv summary span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.pv .warn{color:var(--red);font-size:11.5px;font-weight:600;white-space:nowrap}
.pv textarea{width:100%;margin-top:8px;min-height:120px;border:1px solid var(--line);border-radius:6px;padding:8px;font-family:var(--serif);font-size:13.5px;background:var(--bg)}
.pv .note{font-size:12px;color:var(--red);margin-top:4px}
.shelf h4{margin:14px 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.shelf h4:first-child{margin-top:0}
.shelf-row{display:grid;grid-template-columns:1fr auto 36px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line-2);font-size:13.5px}
.shelf-row small{color:var(--muted);font-size:12px;margin-left:8px}
.actions-row{display:flex;gap:8px}

/* materials */
.mat{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start;max-width:1200px}
.mtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 14px}
.mtabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.mtabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--violet)}
.mlist{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mrow{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line-2)}
.mrow:first-child{border-top:0}
.mrow .ic{width:18px;height:18px;color:var(--faint)}
.mrow b{font-size:14px}
.mrow small{color:var(--muted);font-size:12px;margin-left:8px}
.mrow .acts{display:flex;gap:14px}
.folders{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.folders h4{margin:0 0 10px;font-size:13px}
.folders button.f{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:7px 8px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--ink)}
.folders button.f[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue);font-weight:600}
.folders button.f span:last-child{color:var(--faint);font-variant-numeric:tabular-nums}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,16,28,.45);display:grid;place-items:center;padding:20px}
.modal .box{width:min(640px,100%);max-height:88vh;overflow:auto;background:var(--panel);border-radius:14px;padding:22px}
.modal h3{margin:0 0 12px;font-size:17px}
.chips{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:10px 0 4px}
.chip{height:34px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}

const PASSAGES = {"고1":[{"no":"18","text":"\"Dear Parents and Guardians,\nWe appreciate your support and cooperation in our school programs. We would like to share important information regarding this Friday's school field trip. Our school had originally planned an outdoor field trip to Dreamland Amusement Park. However, according to the latest weather forecast, extremely low temperatures are expected throughout Friday. Spending long hours outdoors under these conditions may be potentially unsafe for students. After careful consideration, we have decided to change the location. Instead of the amusement park, students will visit the City Science Museum, where they will participate in guided exhibitions and hands-on learning activities. We kindly ask for your understanding.\nSincerely,\nMichael Thompson\nVice Principal\""},{"no":"19","text":"Maggie stood up, her hands gripping the seat in front of her. She had never sung alone before, and as she opened her mouth to begin, her voice started shaking. A few children turned around to look at her, and her heart began to race. She focused hard on the lyrics, trying not to forget the words. Then she noticed movement beside her. Durwood quietly stood up and began to sing along. His voice was steady and calm, carrying the song forward. Maggie let out a breath she hadn't realized she was holding. The tightness in her shoulders slowly faded. With Durwood singing beside her, the tension in her chest eased. She continued the song, no longer frozen, and they finished it together."},{"no":"20","text":"Learning games need to be what we call 'fun enough.' Many new learning-game developers try to design an entertaining game. Unfortunately, that often makes learning harder rather than easier. Remember, you are not creating the next great commercial game to entertain your learners; you are creating a learning game in which success will be measured by the achievement of learning outcomes. Resist the temptation to create a ton of rules, pile on different game elements, and incorporate multiple dynamics to keep player interest high. Yes, the game should be engaging with a mild level of fun, but learning should be the goal. Focus on engagement rather than entertainment. The goals of the game play should be interactivity and engagement. Research shows that what makes games instructional is the level of interactivity and engagement the learners have with the content. Given those parameters, making sure the learners are engaged and active is far more important than making sure they are entertained."},{"no":"21","text":"We are wonderfully made, yet we don't allow ourselves to participate in the wonder for which we were created. Instead of moving anywhere and everywhere, most of us spend our time moving nowhere. We occupy the same square footage of a chair for hours and hours every day. Many kids today are being held captive by 'smart' devices like phones and tablets. They are not going outside to play, they are not learning how to socialize and read physical cues from others. As a result they are not learning or building their movement repertoire, the very thing that will help them learn, communicate, create, and become emotionally mature. They are not even learning how to run, how to skip, or how to climb. Instead, they are learning how to live with anxiety, depression, and even diseases they were never meant to have. The point is we are getting further and further away from our design. We were made to move - and through movement, we are meant to live extraordinary lives. Movement is life to us."},{"no":"22","text":"Perhaps you have heard of the Law of Attraction, which states that 'like attracts like' and that by focusing on positive or negative thoughts, one can bring about positive or negative results. The common flaw in our understanding of this law is that we believe all we have to do is think about or visualize something to manifest it. It is true that we attract at the level of our own vibration and that our thoughts and words are extremely magnetic. But the most powerful attractor is our belief system. You can create beautiful poster boards full of images of what you want and affirm every day that you are available for an incredibly successful, passionate career or a loving relationship; but if you don't truly believe you are enough, worthy, lovable, and deserving, then attracting a great career or relationship into your life may be more challenging. Consider what limiting beliefs you have that contradict your desires and upgrade them to beliefs that are in line with what you want to attract."},{"no":"23","text":"It's important for humans to have many kinds of minds, because variation is critical for the survival of a species. One of Charles Darwin's greatest insights was that variation is a prerequisite for natural selection to work. Think about it: If there's a huge change in the environment, like a catastrophic drop in the food supply or a big increase in temperature, a species without much variation might be completely wiped out. A species with great variation will more likely have some survivors after any catastrophe - the members who are well suited for the new environment. Darwin observed variation in the bodies of animals, and the same principle applies to human minds. If we all had the same kind of mind - if there were only one human nature - then when disaster struck, we might become extinct. Thankfully, our species has many kinds of minds, both within a single culture and across cultures, so we're less likely to be wiped out. This variation preserves the evolvability of our species."},{"no":"24","text":"Letting go of our need for control, being aware, is a lot about gathering the courage to face uncertainty. Human beings want to know. When we don't know, when things are uncertain, we often feel frightened and become inflexible. So we pretend that things are more predictable than they really are, even though we actually live with enormous uncertainty all the time. We cling to our plans and ideas about how things should be and turn out ever so desperately. And there's nothing wrong with having plans. I think it's a beautiful thing. But there's a difference between planning and thinking all your plans have to come to fruition. American president Eisenhower once said: 'Plans are worthless, but planning is everything.' Imagine if we all used pencil instead of ink to write in our calendars and planners. Both figuratively and literally. Imagine if we could bear in mind that what we write down, what we think is going to happen, might not be what actually happens. And if we could try our best to be all right with that."},{"no":"26","text":"Paul Farmer was an American medical anthropologist and physician. He was born in 1959 in Massachusetts and grew up with an early awareness of social inequality. During his time at Duke University, he lived in Paris for half a year and became fluent in French, which benefited him in his future work in Haiti. After graduating from Duke University, he began volunteer work at a hospital in Cangé, Haiti. He later returned to the United States and earned both a master's degree and a PhD in medical anthropology at Harvard University. In 1987, he co-founded Partners In Health, an organization that works in countries like Haiti, Rwanda, and Peru to provide medical treatment and strengthen public health systems. Throughout his life, he wrote more than ten books and over a hundred academic papers. He received many major awards during his career, and after his death, he was also honored with the WHO Director-General's Global Health Leaders Award for his lifelong work to improve health for the poor."},{"no":"29","text":"To understand how breathing affects athletic performance, we first need to understand how the body makes energy from air and food. There are two options: with oxygen, a process known as aerobic respiration, and without it, which is called anaerobic respiration. Anaerobic energy is generated only with glucose (a simple sugar), and it's quicker and easier for our bodies to access. It's a kind of backup system and turbo boost when the body doesn't have enough oxygen. But anaerobic energy is inefficient and can be toxic, creating too much lactic acid. The sickness, muscle weakness, and sweating you experience after you've pushed it too hard at the gym is the feeling of anaerobic overload. This process explains why the first few minutes of an intense workout are often so miserable. Our lungs and respiratory system haven't caught up to supply the oxygen our bodies need, and so the body has to use anaerobic respiration. This also explains why, after we're warmed up, exercise feels easier. The body has switched from anaerobic to aerobic respiration."},{"no":"30","text":"Keep your paragraphs short. Writing is visual - it catches the eye before it has a chance to catch the brain. Short paragraphs put air around what you write and make it look inviting, whereas a long chunk of type can discourage a reader from even starting to read. Newspaper paragraphs should be only two or three sentences long; newspaper type is set in a narrow width, and the inches quickly add up. You may think such frequent paragraphing will damage the development of your point. Obviously The New Yorker is obsessed by this fear - a reader can go for miles without relief. Don't worry; the gains far outweigh the hazards. But don't go too far. A succession of tiny paragraphs is as annoying as a paragraph that's too long. I'm thinking of all those tiny paragraphs - verbless wonders - written by modern journalists trying to make their articles quick 'n' easy. Actually they make the reader's job harder by chopping up a natural train of thought."},{"no":"31","text":"Our tastes are social. Even when you first drank milk, there was the milk, yes, but there was also the person behind the milk who will have presumably either made or messed up your relationship with food for the couple of decades after that. We learn to eat from our families and friends, at school and in work. A village develops a particular recipe for an apple pie - one that nobody outside the village likes, but who cares? We want these things not just because of what they are, but who we are. Tastes spread like this, person to person, like viruses, almost irrespective of the qualities of the food involved. We observe other people in their food lives, often judgmentally. Nothing turns me off something quicker than the wrong people liking it, by which I mean people almost identical to me in every respect, in a way that doesn't flatter me. I avoided the viral chopped salad moment of 2024 by the skin of my teeth."},{"no":"32","text":"One of the most fascinating and empowering insights in Stoic philosophy is that our emotions are not random; they arise from our judgments. This may sound surprising, especially if you've ever felt overwhelmed by anger, fear, or sadness. But the Stoics taught that emotions aren't just automatic reactions. They're shaped by how we interpret events. Here's how it works: something happens, you interpret what it means, and that interpretation triggers an emotional response. For example: If someone criticizes you, you may feel angry not due to the words themselves but because you perceive the comment as unfair or threatening. If you lose a job, you might feel devastated not simply because of the job loss but because you believe it defines your worth or future. Change the judgment, and you change the emotion. This doesn't mean suppressing how you feel; it means examining the story you tell yourself and choosing one that serves you better."},{"no":"33","text":"The ancient Greeks felt that the visual artist's goal was to copy visual experience. This approach appears in the realism of ancient Greek sculpture and pottery. We must sadly note that, due to the action of time and weather, no paintings from ancient Greek artists exist today. We can only surmise their quality based on tales such as that of Zeuxis and Parhassios, the obvious skill in ancient Greek sculpture, and in drawings that survive on ancient Greek pottery. This definition of art as copying reality has a problem, though. Jackson Pollock, a leader in the New York School of the 1950's, intentionally did not copy existing objects in his art. While painting these works, Pollock and his fellow artists would consciously avoid making marks or passages that resembled recognizable objects. They succeeded at making artwork that did not copy anything, thus demonstrating that the ancient Greek view of art as mimesis - simple copying - does not sufficiently define art."},{"no":"34","text":"If our bodies know best, why are they easily injured when we do something so seemingly natural as running? On the one hand, running seems very easy, but that is only because our bodies are so very good at it. The most powerful supercomputer on the planet cannot administer the enormous number of computations it takes to run, untethered, on two legs. Wherever our running intelligence is, running is not all conscious to us and is so complicated that only the T-1000 Terminators of our imagination are able to do it. Because our running knowledge is buried so deeply within muscle fibres, cells and our DNA, we have to accept that we cannot fully explain its complexities. That doesn't mean our bodies don't know how to do it. We may feel our way towards understanding the alchemy of running by learning how to use our senses, getting them firing, and seeing what they are capable of, and accepting that our bodies know more about running than we ever will."},{"no":"35","text":"Our number one criterion for how we care for our pets should be, \"Is this what they actually need? How is it impacting them?\" rather than, \"What do I want?\" For example, we have encountered many dog owners who bathe their dogs religiously multiple times a week because they want to avoid the 'doggy' smell, but veterinary dermatologists warn against such practices, as they are not good for a dog's skin. If someone is really concerned about their dog's smell they can use waterless shampoo and thoroughly brush their dog every day but keep the baths down to once or twice a week at most. Unless they have a skin condition for which a vet has prescribed medicated baths, most dogs don't need to be bathed on a regular basis. Even dogs with thick, heavy coats generally only need baths every 6 to 8 weeks."},{"no":"36","text":"The central concerns of mathematics are not numbers, but patterns, structures, symmetries and connections. Take, for example, the Sudoku puzzles that appear daily in newspapers. The objective is to complete a 9 × 9 grid, starting from a few given numbers or clues, while ensuring that each row, each column and each 3 × 3 block contains all the digits from 1 to 9 once and only once. But the numerical values of the digits are irrelevant; what is important is that there are nine distinct symbols. They could be nine letters or nine shapes. It's the pattern that matters. One Irish daily paper publishes these puzzles with the statement 'There's no maths involved, simply use reasoning and logic!' It seems that even the idea that something might be spoiled by mathematics is enough to scare off potential solvers! Could you imagine the promotion of an exhibition in the National Gallery with the slogan 'No art involved, just painting and sculpture'? If you can do Sudoku, you can do maths!"},{"no":"37","text":"Even before telescopes existed, people looked out into space and tried to understand the universe. The Egyptians, Babylonians, Greeks, and Maya were among the first peoples to map the movements of the stars. In Europe, a 16th-century Polish mathematician named Nicolaus Copernicus put forth a revolutionary idea. Copernicus watched the stars and took measurements by eye. He concluded that the view of the universe accepted at the time ─ that the Sun traveled around Earth ─ was wrong, and that it was in fact Earth that traveled around the Sun. Despite widespread objections to his ideas, he published his theory in a book. Later astronomers built on Copernicus' work. Technological improvements led to the development of the telescope in the early 17th century. Using a telescope, the Italian scientist Galileo Galilei discovered the four largest moons of Jupiter and observed craters on Earth's Moon. He also confirmed that Copernicus' theory was correct. Over the centuries, scientific discoveries and information from telescopes advanced our knowledge of how the universe works."},{"no":"38","text":"To harness the full potential of units of measurement, we need some degree of consistency. Subjective measures contain useful knowledge, but this can be difficult to share, based as it is on an individual's experience. The historian of science Theodore M. Porter describes measurement as a 'technology of distance': a tool that uses shared rules to bridge differences of culture and geography, allowing for the exchange of information. Following this logic, if measurement is another sort of language, then just as with words, individual units need reliable definitions in order to communicate. In the earliest societies, these definitions might need to be shared no more widely than a single settlement, meaning that the definition can be no more complex than knowing that a unit was equal to a certain body part. As these communities grew in size, though, the inadequacies of this system would become evident. Imagine a disagreement over trade or tribute: it is a moment of conflict that demands greater consistency in measurement."},{"no":"39","text":"With millions of members in a colony, leaf-cutter ants cultivate their own food. Just like humans, they're farmers. Some of the ants set forth from the nest to find fresh vegetation; when they find it, they chew off large pieces that they carry back to the nest. However, the ants don't eat these leaves. Instead, smaller worker ants take the pieces of leaves, chew them into smaller pieces, and use these as fertilizer to grow fungus in large underground 'gardens.' The ants feed the fungus, and the fungus blossoms into small fruiting bodies which the ants later eat. Using this successful farming strategy, the ants build enormous nests underground, something spanning hundreds of square meters. Just like humans, they have perfected an agricultural civilization."},{"no":"40","text":"From an evolutionary perspective, self-esteem has developed as a monitoring mechanism for the quality of our relationships. The system monitors other people's reactions to our behaviors and sends an alarm that alerts us to any possible changes in our inclusion status. The monitoring system generally operates nonconsciously until it detects that our relational value is falling or low. When the alarm bell rings, the threat to our social bonds is pushed into conscious awareness and we evaluate the situation. Am I being accepted or am I being pushed out? Do I need to adjust my behaviors to fix the relationship? With such a high value for survival closely tied with relationships, it makes sense that the way we mobilize our internal resources around relationships would be highly networked in our brain and body. It also makes sense that we would develop specific mechanisms to attend to minimizing rejection and enhancing acceptance. The continuous scanning is normal, a part of being human. We all have an interpersonal process of searching for cues from the environment to assess our value in the social structure."},{"no":"41~42","text":"The role of 'slang' in popular culture has fundamentally changed because of the internet. Since the emergence of Standard English, the rule makers of language have been in charge, and their prescriptive norms about a 'correct' version of the English language have dominated our channels of communication. If you wanted your voice to be heard by the public, you had to work within their limits, conforming to the strict expectations of either print or broadcast media. Social media completely broke that barrier. The playing field is now level, and public access is democratized. Anybody and everybody can become a public figure on the new communicative platforms, meaning that nobody's left to enforce the old rules. TV presenters and journalists might not have been able to use slang, but content creators can. We regularly use words like 'function' and 'side-eye,' and our influence both legitimizes these terms and gives them a large platform to spread quicker than they could have before. Content creators also come from a greater variety of backgrounds than people working in traditional media. This means that slang can more naturally go beyond the economic and social barriers that once limited its growth. The loose social networks that previously connected us geographically are simply stronger online, and memes are now transmitted at rapid pace."},{"no":"43~45","text":"Once upon a time in Persia, there was a merchant who traveled the world for his business. On one of his journeys to India, he received a beautiful parrot as a gift and named him Tuti. He loved Tuti deeply and put him in a shiny golden cage. Days passed, but no matter how much the merchant cared for his parrot, the colorful bird seemed sad. Before leaving for India again, the merchant asked Tuti, \"What present would you like me to bring from India?\" \"When you see the parrots of India, look for my friend and tell her all about me. Tell her that I would love to see her, but I can't because I live in a cage,\" Tuti answered. The merchant loved his parrot so much that he couldn't imagine letting him out of the cage for fear of losing him, but he promised to deliver the message and then left to go on his trip. At the end of his visit to India, he found Tuti's friend and repeated Tuti's exact words. The moment the merchant finished the last sentence, Tuti's friend began to tremble and fell down dead. He couldn't believe his eyes. \"How can I tell this sad news to Tuti?\" he said. A few days later, he arrived home and went straight to Tuti. \"Did you give my message to my friend?\" his parrot asked him happily. The merchant told him the whole story. The moment he finished, Tuti trembled and fell down dead, just like the parrot in India. Shocked and with tears trickling down his face, the merchant held Tuti in his arms. Suddenly, he flew and escaped through a window into the garden. \"Why are you acting like this?\" he asked Tuti. \"This is a trick my friend taught me to regain my freedom by playing dead. You are a good master, but I am a bird and I wish to be free, not live my life in a cage,\" answered Tuti. The merchant realized that freedom mattered more than all the wealth in the world and he was happy to have the company of two beautiful parrots occasionally."}],"고2":[{"no":"18","text":"To whom it may concern,\nI am a teacher at Pendington High School, and we are currently preparing a new school promotional brochure. As we wish to update the overall design of our brochure, we are considering working with a new printing company. While reviewing several options, we felt that your design style and printing formats seemed to suit our needs well. We intend to make a four-paged brochure and print 500 copies in full color. Before proceeding, we would like to ask you how much it would cost. This will greatly help us in setting our budget and schedule more effectively. Thank you very much for your time and assistance. I look forward to your response.\nSincerely,\nSarah Clayton"},{"no":"19","text":"I ran into the music room, breathing heavily. The rest of the band were sitting with long faces. Immy looked up at me and shook her head. I sank into a chair. I had truly believed we would make it; our audition had been flawless. My chest felt heavy as I asked, \"So, who won?\" I was holding back my tears. \"A band called A Happy Accident. They were quite good,\" she said calmly. A moment later, a big smile spread across Immy's face, and the others began to cheer. \"Wait, what? That's us!\" I said. Immy laughed and said, \"Since you were late, we decided to play a joke on you! We made it!\" I was filled with joy. We jumped up and hugged each other. My heart was racing with excitement."},{"no":"20","text":"Only when you're happy that you've done the best you can for your story should you show it to someone else. You may well want to show it to your nearest and dearest, and that's fine, but in most cases you shouldn't look to their reading for any great benefit to your work. The most valuable feedback is likely to come from other sources: you should choose readers for their critical insight, not their closeness to you. Fellow writers are ideal, but don't imagine that any writer will do. If you are part of a writers' circle or class, you'll know whose writing you admire, and if you've had feedback in the past you'll know whose opinions have been helpful - and whose have not."},{"no":"21","text":"A meeting in a flexible-time culture like those found in South America, parts of Europe, Africa, and the Middle East is more like an evergreen tree. An agenda with a meeting start time and a topic will probably be circulated before the meeting. This will serve as the trunk of the tree. But there's no expectation that the meeting will progress in a linear manner. What seemed like a priority last week when the agenda was crafted is not necessarily the priority right now - so discussion may branch off in a new direction. Other branches may sprout as some members have urgent phone calls that take them in and out of the meeting. Or sub-groups may form within the room to discuss timely subjects linked in some way to the main meeting trunk. In flexible-time cultures, it seems clear that the most productive meetings grow in unpredictable ways, and the effective manager is flexible and professional enough to capitalize on priorities and changing needs as they arise. Interruptions, agenda changes, and frequent shifts in direction are seen as natural and necessary."},{"no":"22","text":"When we are 'always on' we are constantly ingesting content - reading alerts and texts, liking, checking emails, downloading, uploading, upgrading, updating, deleting, submitting responses, and posting. If we do it while we are eating, our multi-tasking is overloading us. As our will attempts to digest the virtual content its forces are diverted from the physical content, our food. It's easy to eat a sandwich in a minute while talking on the phone. Some people are skilled at doing both at the same time. Others write a half-hearted, shorthand text while they hurriedly eat their sandwich at the same time. The result can be a misunderstood text with the need for further clarifying texts and the beginnings of nervous indigestion. Eat your sandwich. Taste it. Let it go down. Then text."},{"no":"23","text":"Music can bring us into a very comfortable rhythm, and it can be satisfying in and of itself. Most of the time, however, we want something more to happen. There needs to be a process that creates tension and drives the movement towards something in particular. The excitement that arises in this process creates satisfaction and pleasure. This is seen in the measureless prelude as well. But there the tension might be caused by the ambiguity of the rhythm. Therefore, the fluid movement in the prelude usually creates a tension that can be released in the subsequent movement with a set rhythm. This, in turn, creates new and other types of tensions, where the rhythm is unambiguous and predictable, but where unexpected chords and modulations create drama and an experience of development in the piece."},{"no":"24","text":"Progressive educators and librarians are developing curricula to teach what we might call attention literacy. This means helping students recognize, for example, how the architecture of a social media feed or a news site is deliberately designed to distract or provoke them. Classes in media literacy traditionally cover how to evaluate the credibility of sources - now they also include recognizing clickbait, understanding the role of algorithms in what content is served up, and observing one's own patterns of distraction. A student might be tasked with tracking how many times they switch tasks or check their phone in an hour of homework, to raise self-awareness about fragmentation. Another lesson might involve unpacking the design of popular apps: Why does an app use infinite scrolling instead of pages? Why do notifications appear with specific colors and sounds? By treating these as deliberate design choices (often rooted in psychology and profit motives), young people become more critical users rather than passive consumers."},{"no":"26","text":"Frederick Law Olmsted, known as the father of American landscape architecture, was born in 1822. When Olmsted was young, he often went on trips to the countryside with his father, who loved scenery. At age 14, he was preparing himself to study at Yale College, but he could not enter due to a severe sumac poisoning that damaged his eyesight. Instead of attending a college, he gained experience working as a clerk, a sailor, and a farmer. In 1858, he worked with Calvert Vaux and won the design competition for New York City's Central Park with the \"Greensward Plan.\" During the Civil War, Olmsted served as General Secretary of the United States Sanitary Commission. Although he passed away in 1903, his sons and successors continued his design philosophy. In 1979, the National Park Service designated his home and office in Brookline, Massachusetts, as a National Historic Site to honor his legacy."},{"no":"29","text":"Capitalism is not a system where cash is everywhere but rather one in which islands of cash exchange exist within oceans of cheap - or potentially cheap - natures. Reproducing life within the cash nexus is expensive, and it grows more expensive over time. Workers' wages can be frozen, even rolled back, but in the end inequality leads to crises of the kind we've recently seen bring about populist protests in the United States and the United Kingdom. Workers demand dignity, and their labor becomes expensive. Production processes burn through an island, and energy is no longer cheap. The climate changes, and crops can no longer grow as abundantly as they once did. Frontiers are so important in these processes because they offer places where the new cheap things can be seized - and the cheap work of humans and other natures can be forcefully taken."},{"no":"30","text":"Some people are more likely to cheat and steal after purchasing \"eco-friendly\" products, probably because they feel licensed to do so since they morally account the \"eco-friendly\" choice as a \"good\" deed. Moral licensing has also been observed in the context of cooperation for the good of the environment. When people are reminded of deeds they have done that they know were harmful to the environment, they might be left with a feeling of \"eco-guilt.\" People who experience eco-guilt seek pro-environmental actions to compensate for this guilt and restore balance. In their search for such a balance, people are inclined to believe in \"quick-fixes,\" because they want to re-establish the moral balance and escape the guilt as quickly and easily as possible. In the same way that people may change their attitudes to reduce inconsistencies between attitudes and behavior, people may also change their evaluation of past environmentally burdening behaviors and future environmentally friendly behaviors. For instance, people are more likely to sign a petition addressing environmental damage after viewing evidence of human-caused environmental damage."},{"no":"31","text":"Human geography is becoming unclear. As people find themselves regularly on the move, we are experiencing a phase shift like when matter transitions from solid to liquid to gas: molecules heat up and loosen from one another, vibrating more rapidly. One might even say that humans are becoming like particles in quantum physics, their velocity and location always in flux. It would be nice to return to some form of stability, but that's not how things work in a quantum world. Instead, the complexity of today's world makes it increasingly difficult to settle permanently anywhere. Highly paid digital nomads and billionaires with multiple passports as well as migratory workers are all part of the diverse and growing global demographic of quantum people."},{"no":"32","text":"Of the cognitive motivations, the most fundamental one encourages people to understand their environment to predict what is going to happen in case of uncertainties. Most important, people prefer to develop meanings that are shared with other people. For example, if in a given year more people accept offers of admission than a college expects, quite a few students end up living in dorm lounges or campus hotels. It is easy to understand why living in the lounge is problematic (no closet, for one thing). But what is wrong with a room at campus hotels? After all, students in a hotel get private bathrooms, their own TV, and larger rooms. In fact, living in those hotels is problematic because the student residents are not a part of a stable group with people who will be their neighbors for the year; they must wait in uncertainty before finding their social niche. The uncertainty itself is the problem. People lack a shared social understanding, normally developed from membership in a stable group."},{"no":"33","text":"Psychological theories across the field agree on the importance of grieving our losses, from the highly personal through to the broadly collective. Grief is a dynamic emotional process essential to consciousness. At a psychological level, it supports us to both face into our own and others' vulnerability, transience and mortality, and to repair life energy after significant loss. Grief work honours the loss, the sadness and the experience of diminishment or absence, while also setting up the ground for self-transformation and the continuation of life. Psychotherapist Fran Weller describes grief work is \"an act of devotion, rooted in love and compassion\" that requires \"an ongoing practice of deepening, attending and listening.\" When we grieve for what is lost, it clears the way towards a strengthening of love and commitment for what remains. In time this may build a desire to make good from the loss by repairing as many damages as we can and/or compensating for them. Grief can make us both very sad and very motivated to act."},{"no":"34","text":"When we focus on the obvious aspects of media, we miss the changes that accumulate over time but are not apparent day to day. Most of us notice the obvious aspects of a new medium or technology while missing the more subtle aspects. Take, for example, the microwave oven. It was introduced in the early 1980s and revolutionized food preparation. Traditionally, one person spent the better part of an afternoon fixing an evening meal for a family. Now, it was possible to prepare foods very quickly, and this shortening of preparation time was liberating for the cooks in the family, most of whom tended to be women. But the short-term, obvious implications of greater convenience made it easy to overlook the long-term implications of no longer having one person fix food for the family to eat together at an evening meal. As time went on, fewer and fewer families sat down together to eat dinner. Meals that took a long time to prepare became a luxury of the past, except perhaps for special occasions. The effects of the microwave oven on family life were not anticipated and would have been difficult to foresee."},{"no":"35","text":"Digital twins are digital replicas of assets or activities using modeling and sensors to create digital representations. Digital twins are not new; engineering teams in various industries have used 3D renderings of computer-aided design models, asset models, and process simulations for years. However, faster wireless networks and the resulting availability of real-time data enable much more detailed and dynamic digital representations. When sensors collect data from a connected device, the sensor data can be used to continuously update the digital twin. The digital twin becomes a real-time accurate copy of a physical object's properties and states. For instance, digital twins of physical assets such as power-generation turbines, jet engines, and train engines are becoming common when the assets are very valuable and when downtime would be very costly."},{"no":"36","text":"The ability to select a set of surroundings suitable for foraging, shelter from predators, and the availability of mates is one of the most important determinants of biological success - measured as survival to reproductive age and the production of offspring. Many studies have shown that not only do animals have a remarkable ability to seek out the best available locations for the necessities of life, but that they are able to anticipate how a setting will serve their future needs. For example, the black-throated green warbler, a small songbird that nests in spruce forests of eastern North America, establishes territories preferentially among the red spruce trees early in the summer months, even though these trees offer less food than the neighboring white spruce trees. Later, though, when nests are built and hungry baby birds need nourishment, it is the red spruce forest that offers the easier pickings. Somehow, the warbler has been guided to settle in locations that will suit its future parenting needs better than its present ones."},{"no":"37","text":"Language is a manifestation of culture. At different language acquisition stages, children do not learn language per se; rather they learn the various patterns and styles of language interaction that enable them to function as competent communicators in different situational contexts. They develop a culture-specific communication style that is, for example, direct and explicit in individualistic cultures or indirect and implicit in collectivistic cultures. Examples of words linked with the direct style are categorical words like absolutely, certainly, or positively. By contrast, the cultural assumptions of interdependence and harmony require that collectivists limit themselves to implicit and even ambiguous use of words, using terms like maybe, perhaps, or probably. The English language is the only language in the world that spells I with a capital letter. This phenomenon may reflect the fact that the roots of individualism are in England. There is no Japanese equivalent for the English I. Different words are used to refer to the self, depending on the social situation, the speaker's gender, age, and the other social attributes relative to the listener."},{"no":"38","text":"Environmental psychologists make a distinction between the physical measurement of density (how many people are in a particular space) and crowding (the psychological feeling of not having enough space). Usually, high density is needed for the phenomenon of crowding, which makes people experience sensory overload, a lack of control, and rising stress and anxiety. However, some psychologists see crowding as neutral rather than invariably negative, and believe that people's moods and behaviors intensify as density increases. So if an individual is looking forward to a concert, say, the feeling of crowding enhances their enjoyment of the performance. But if they are dreading an event, crowding will make the person's experience of it even worse. Put into a community setting, crowding may accentuate the dominant behavior - an aggressive group may turn violent as density rises. Conversely, creating positive social spaces such as parks and pedestrian areas in high-density urban environments may help to lift the general mood and defuse tension."},{"no":"39","text":"Exclusion is a state that is ignored by the organization psychologists. Therefore, it is possible that precautions regarding organizational exclusion are not taken. Individuals react to organizational exclusion by trying to strengthen their basic needs, which are threatened. Positive social behaviors develop belonging and self-respect. The likelihood that individuals who try to adapt to positive social behaviors will experience organizational exclusion decreases. However, individuals may be faced with more exclusion when they cannot adapt to a group. When excluded individuals grow away from communication and social activities, their contribution to the organization they are in may decrease. When this situation is not avoided, exclusion increases even more and strongly affects the performance of the employee in a negative way. Precautions need to be taken regarding organizational exclusion, which is very important for business."},{"no":"40","text":"Our adult brains retain a preference for perpetuating good, fair behavior. Simply perceiving ourselves as people who do good deeds and behaving accordingly motivates us to do greater good in the future. In one paid study of one hundred college students, subjects who wrote down a list of past good deeds and were then asked to donate money to a charity gave, on average, over half the earnings they'd made from the study - almost twice as much as those who had been instructed to recall previous bad deeds. In addition, subjects who'd taken pains to describe not only how they'd been nice to others but how people responded were likely to donate significantly less than those who focused purely on the actions themselves. In other words, people who seemed concerned about appearances (e.g., the impact of their good deed, as much as the deed itself) were less generous than those who cared more about doing good for its own sake."},{"no":"41~42","text":"The concept of \"choice architecture,\" popularized in behavioral economics, highlights how the design of the environment in which choices are made can significantly influence the decisions people make. Algorithms are, in essence, sophisticated architects of our digital environments. By curating what we see, what we are recommended, and what options are presented to us, they subtly, and sometimes not so subtly, nudge us towards particular paths. While nudges can be used for beneficial purposes, such as encouraging healthier habits, they also carry the potential for manipulation, particularly when the underlying objectives of the architects are not aligned with the well-being or autonomy of the individual. The question then becomes: how can we cultivate and protect our human agency in an increasingly algorithmic world? It requires a conscious effort to maintain critical engagement with the technologies we use. It means actively seeking out diverse perspectives, challenging algorithmic recommendations, and making deliberate choices that go against the predicted grain. It involves cultivating a healthy skepticism towards the seemingly objective outputs of algorithms and remembering that these systems are designed by humans with specific goals, and that their data is a reflection of past realities, not necessarily a prescription for future flourishing."},{"no":"43~45","text":"Ridge was a high school student who wanted to major in music in college. For weeks, on his balcony, every night he listened to a man playing the guitar in the apartment across the courtyard. Although the songs the man played were all new to Ridge, he somehow managed to attach his own made-up lyrics to them. One night, Ridge slid open the balcony door and stepped outside. He told his mom he was going out to the balcony to do his homework. The man was playing the guitar on his balcony as usual and Ridge started to mindlessly follow the rhythm. While Ridge was singing along to the music, the man suddenly stopped playing. He had never stopped in the middle of a song, so naturally Ridge looked in his direction. The man held up his index finger as if to say, \"Hold on.\" He lifted one sheet of paper, and Ridge narrowed his eyes to get a good look at what was written on it. His phone number and \"Text me\" were written on the sheet. Then he flipped the paper over and wrote, \"I have a question.\" Curious about the man's question, and wondering why he had asked for a text instead of a call, Ridge pulled out his phone and entered the number. He typed, \"What's your question?\" The man texted, \"I want to know how you're singing lyrics to my songs when I haven't even added lyrics to them yet.\" Ridge was greatly surprised. Why hadn't he thought the man could see him sitting out there? He had never thought the man had noticed him singing along to his music. The man sent another message asking, \"Will you send them to me?\" After reading the man's message asking for his lyrics, Ridge hesitated. Ridge loved writing lyrics, but he had never shared anything he'd written with anyone. Eventually, he wrote down one of his favorite lyrics and sent it to him. A few days later, a new message came from the man. He wanted to use Ridge's lyrics for his new album. It turned out he was a deaf guitarist and songwriter in a band called Brennan's Band."}]};

const SYNC_KEYS=new Set(["bj-rf-draft","bj-mt-draft","bj-mt-opts","bj-ps-draft","bj-ps-types","bj-gen-draft","bj-gen-draft-mid","bj-ana-draft","bj-cls-draft","bj-wkbk-draft","bj-basic-draft",

function syncTs(){ try{return JSON.parse(localStorage.getItem(SYNC_TS_KEY)||"{}")||{}}catch(e){return {}} }
function syncTouch(k){
  if(!SYNC_KEYS.has(k)) return;
  const ts=syncTs(); ts[k]=Date.now(); try{localStorage.setItem(SYNC_TS_KEY,JSON.stringify(ts))}catch(e){}
  clearTimeout(_syncT[k]); _syncT[k]=setTimeout(()=>syncPush(k),1500);

async function syncPush(k,t){
  let d=null; try{d=db}catch(e){} if(!d) return;

}
function syncBoot(){
  let un=null;
  const handle=snap=>{
    document.querySelectorAll("[data-syncbar]").forEach(x=>x.remove());
    const remote={}; snap.docs.forEach(x=>{const r=x.data(); if(r&&typeof r.v==="string") remote[x.id]={t:+r.t||0,v:r.v}});
    const ts=syncTs(); const pull=[];
    SYNC_KEYS.forEach(k=>{
      let raw=null; try{raw=localStorage.getItem(k)}catch(e){}
      const r=remote[k], lt=ts[k]||0;
      if(r){
        if(raw===r.v) return;
        if(raw!=null&&lt>r.t) syncPush(k,lt);
        else pull.push([k,r]);
      } else if(raw!=null){ syncPush(k,lt||Date.now()); }
    });
    let dis={}; try{dis=JSON.parse(sessionStorage.getItem("bj-sync-dis")||"{}")}catch(e){}
    const list=pull.filter(([k,r])=>dis[k]!==r.t);
    if(!list.length) return;
    const bar=document.createElement("div"); bar.dataset.syncbar="1";
    bar.style.cssText="position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;background:#1f2a44;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.3);font:14px/1.5 system-ui,sans-serif;display:flex;gap:12px;align-items:center;max-width:92vw";
    bar.innerHTML='<span>다른 컴퓨터(또는 이전 작업)에서 저장된 <b>초안·작업 내용 '+list.length+'건</b>이 있습니다. 이 화면에 불러올까요?</span><button type="button" style="background:#fff;color:#1f2a44;border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer" data-y="1">불러오기</button><button type="button" style="background:transparent;color:#cdd;border:1px solid #567;border-radius:8px;padding:6px 10px;cursor:pointer" data-n="1">나중에</button>';
    bar.addEventListener("click",e=>{
      if(e.target.dataset.n){ list.forEach(([k,r])=>dis[k]=r.t); try{sessionStorage.setItem("bj-sync-dis",JSON.stringify(dis))}catch(_){} bar.remove(); return; }
      if(e.target.dataset.y){
        const t2=syncTs();
        list.forEach(([k,r])=>{ try{localStorage.setItem(k,r.v); t2[k]=r.t;}catch(_){} });
        try{localStorage.setItem(SYNC_TS_KEY,JSON.stringify(t2))}catch(_){}
        bar.textContent="불러오는 중…"; setTimeout(()=>location.reload(),300);
      }
    });
    document.body.appendChild(bar);
  };
  try{ un=db.collection("state").onSnapshot(handle,()=>{}); }catch(e){}
}

function packSet(set){

  return {title:set.title,level:set.level||"high",created:set.created||Date.now(),passages,questions:qs,quiz:set.quiz||null,quizGroups:set.quizGroups||null};
